<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JN AI COMPANY · LIVE OFFICE</title>
<link href="https://cdn.jsdelivr.net/npm/neodgm-webfont@1.530/neodgm/style.css" rel="stylesheet">
<style>
:root{
  --bg:#241b12;          /* 사무실 바닥 어두운 우드 */
  --plank:#2c2217;
  --room:#3b2e1f;        /* 방 내부 */
  --room-floor:#332818;
  --gold:#c9a45c;        /* 방 테두리 금색 */
  --gold-dim:#8a6f3e;
  --cream:#f3e7cd;
  --ink:#1d1608;
  --green:#4ade80;
  --yellow:#fbbf24;
  --red:#f4574d;
  --bubble:#fffdf5;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'NeoDunggeunmo','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color:var(--cream);
  background:
    repeating-linear-gradient(90deg, var(--bg) 0 90px, var(--plank) 90px 92px),
    var(--bg);
  padding-bottom:64px;
}

/* ── 상단 간판 ─────────────────────────── */
header{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(#2b2c52,#232447);
  border-bottom:3px solid var(--gold);
  padding:10px 18px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  box-shadow:0 4px 14px rgba(0,0,0,.5);
}
header h1{font-size:17px;letter-spacing:2px;color:#e8dcae}
header h1 .dot{color:var(--gold)}
.hud{margin-left:auto;display:flex;gap:14px;align-items:center;font-size:13px}
.hud .clock{color:#cfd3ff}
.hud .count{display:flex;gap:10px}
.hud .count span::before{content:'●';margin-right:4px}
.hud .c-work::before{color:var(--green)} .hud .c-ready::before{color:var(--yellow)} .hud .c-err::before{color:var(--red)}
.hud .c-work,.hud .c-ready,.hud .c-err{color:var(--cream)}

/* ── 사무실 그리드 ─────────────────────── */
.office{
  max-width:1080px;margin:22px auto;padding:0 16px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;
}
.room{
  border:2px solid var(--gold-dim);
  border-radius:10px;
  background:var(--room);
  box-shadow:inset 0 0 0 4px rgba(0,0,0,.25), 0 6px 16px rgba(0,0,0,.45);
  overflow:hidden;
  display:flex;flex-direction:column;
}
.room-head{
  display:flex;align-items:center;gap:8px;
  padding:7px 10px;
  background:linear-gradient(#4a3a22,#3e3120);
  border-bottom:2px solid var(--gold-dim);
  font-size:13px;
}
.room-head .tag{
  background:var(--cream);color:var(--ink);
  border-radius:5px;padding:2px 8px;font-size:12px;
  box-shadow:0 2px 0 rgba(0,0,0,.4);
}
.room-dot{margin-left:auto;width:10px;height:10px;border-radius:50%;
  box-shadow:0 0 6px currentColor}
.room-dot.working{background:var(--green);color:var(--green)}
.room-dot.ready{background:var(--yellow);color:var(--yellow)}
.room-dot.error{background:var(--red);color:var(--red);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.floor{
  position:relative;height:170px;
  background:
    repeating-linear-gradient(0deg, transparent 0 34px, rgba(0,0,0,.14) 34px 35px),
    repeating-linear-gradient(90deg, transparent 0 34px, rgba(0,0,0,.14) 34px 35px),
    var(--room-floor);
}
.room-note{
  font-size:11px;color:#bfa876;text-align:right;
  padding:5px 10px;border-top:1px dashed rgba(201,164,92,.35);
}

/* ── 캐릭터 ───────────────────────────── */
.char{
  position:absolute;width:64px;text-align:center;
  transform:translate(-50%,-100%);
  transition:left 2.6s ease-in-out, top 2.6s ease-in-out;
  cursor:pointer;z-index:2;
}
.char:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:8px}
.avatar{
  width:44px;height:44px;margin:0 auto;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;line-height:1;
  background:radial-gradient(circle at 35% 30%, #5a4930, #3a2d1a);
  border:3px solid var(--green);
  box-shadow:0 3px 6px rgba(0,0,0,.5);
  animation:idle 2.4s ease-in-out infinite;
}
.char.s-working .avatar{border-color:var(--green)}
.char.s-ready   .avatar{border-color:var(--yellow)}
.char.s-error   .avatar{border-color:var(--red);animation:panic .5s ease-in-out infinite}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes panic{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.nametag{
  display:inline-block;margin-top:4px;
  background:var(--cream);color:var(--ink);
  font-size:11px;padding:1px 7px;border-radius:4px;
  box-shadow:0 2px 0 rgba(0,0,0,.45);
  white-space:nowrap;
}
.warn{
  position:absolute;top:-14px;right:2px;font-size:15px;
  animation:idle 1s ease-in-out infinite;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));
}
.badge{
  position:absolute;top:-7px;left:calc(50% + 10px);
  min-width:19px;height:19px;padding:0 5px;border-radius:10px;
  background:#e5484d;color:#fff;font-size:11px;line-height:19px;
  box-shadow:0 2px 4px rgba(0,0,0,.5), inset 0 -1px 0 rgba(0,0,0,.25);
  z-index:4;
}
.room.wide{grid-column:span 2}
@media (max-width:660px){ .room.wide{grid-column:span 1} }
.bubble{
  position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%) scale(0);
  background:var(--bubble);color:var(--ink);
  font-size:11px;line-height:1.35;
  padding:5px 9px;border-radius:9px;
  white-space:nowrap;max-width:210px;
  box-shadow:0 3px 8px rgba(0,0,0,.45);
  transition:transform .18s cubic-bezier(.34,1.56,.64,1);
  pointer-events:none;z-index:5;
}
.bubble::after{
  content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:5px solid transparent;border-top-color:var(--bubble);
}
.bubble.show{transform:translateX(-50%) scale(1)}
.char.s-error .bubble{background:#ffe1de}
.char.s-error .bubble::after{border-top-color:#ffe1de}

/* ── 하단 범례 바 ─────────────────────── */
footer{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:#171008;border-top:2px solid var(--gold-dim);
  padding:9px 16px;font-size:12px;color:#d8c69a;
  display:flex;gap:16px;flex-wrap:wrap;align-items:center;
}
footer b{color:var(--cream)}
footer .lg::before{content:'●';margin-right:4px}
.lg-g::before{color:var(--green)} .lg-y::before{color:var(--yellow)} .lg-r::before{color:var(--red)}

@media (max-width:640px){
  header h1{font-size:14px}
  .floor{height:150px}
}
@media (prefers-reduced-motion:reduce){
  .avatar,.warn{animation:none!important}
  .char{transition:none}
}
</style>
</head>
<body>

<header>
  <h1>🏢 JN AI COMPANY <span class="dot">·</span> LIVE OFFICE</h1>
  <div class="hud">
    <div class="count">
      <span class="c-work" id="cntWork">0</span>
      <span class="c-ready" id="cntReady">0</span>

    <div class="clock" id="clock">--:--</div>

</header>

<div class="office" id="office"></div>

<footer>

<script>
/* ============================================================

   url: justin-apps 기준 상대경로. TODO 표시는 파일명 확인 필요!
   ============================================================ */
const DEPTS = [

  { id:'media',   name:'뉴스 미디어팀',   icon:'📰', note:'한국 뉴스 브리핑' },

const APPS = [
  { id:'ceo_justin',      dept:'ceo',     name:'저스틴 사장', emoji:'🧑‍💼', url:'index.html',
    msgs:['오늘도 순찰 중 👀','국가 퍼밋 언제 나오나…','커피 한 잔 하고 시작하죠'] },

  { id:'stage_received',  dept:'email', name:'접수봇', emoji:'📥', url:'broker_ledger.html', stage:'received',
    msgs:['새 이메일 확인 중…','서류 도착하면 바로 접수!'] },
  { id:'stage_hold',      dept:'email', name:'보류봇', emoji:'⏸️', url:'broker_ledger.html', stage:'hold',
    msgs:['FDA 심사 대기 확인','서류 미비 건 추적 중'] },
  { id:'stage_delivered', dept:'email', name:'전달봇', emoji:'📤', url:'broker_ledger.html', stage:'delivered',
    msgs:['배달 갈 준비 완료!','릴리즈 서류 챙기는 중'] },

  { id:'stage_working',   dept:'work',  name:'작업봇', emoji:'🛠️', url:'broker_ledger.html', stage:'working',
    msgs:['Entry 입력 중…','HTS 분류 확인 중'] },
  { id:'broker_ledger',   dept:'work',  name:'장부봇', emoji:'📒', url:'broker_ledger.html',
    msgs:['AR 회수 체크 중','KPI 갱신했습니다'] },
  { id:'case_notes',      dept:'work',  name:'케이스봇', emoji:'🗂️', url:'case_notes.html',
    msgs:['HTS 케이스 기록 중','CROSS 판례 찾는 중…'] },

  { id:'juhee_chinese',   dept:'chinese', name:'주희쌤', emoji:'👩‍🏫', url:'juhee_chinese.html',
    msgs:['이번 주 단어 외웠어요?','声调 조심하세요~'] },
  { id:'chinese_learner', dept:'chinese', name:'러너봇', emoji:'📖', url:'chinese_learner.html',
    msgs:['Week 7 복습 어때요?','HSK 3급 가즈아'] },
  { id:'chinese_listening',dept:'chinese',name:'듣기봇', emoji:'👂', url:'chinese_listening.html',
    msgs:['오늘 듣기 연습 하셨어요?','다시 한 번 들어볼까요?'] },
  { id:'voca100',         dept:'chinese', name:'보카봇', emoji:'🈶', url:'voca100_chinese.html',
    msgs:['오늘의 100단어 준비 완료','TTS 성대 풀고 있어요'] },

  { id:'english_learner', dept:'english', name:'잉글리시봇', emoji:'🗣️', url:'english_learner.html',
    msgs:['Repeat after me!','Customs 용어 복습 어때요?'] },
  { id:'conversation_lab',dept:'english', name:'회화봇', emoji:'💬', url:'conversation_lab.html',
    msgs:['오늘의 스몰토크 준비 완료','실전 표현 연습해요!'] },
  { id:'grammar_focus',   dept:'english', name:'문법봇', emoji:'✏️', url:'grammar_in_focus.html',
    msgs:['관사 조심하세요 ㅎㅎ','오늘의 문법 포인트!'] },

  { id:'korean_news',     dept:'media',   name:'뉴스봇', emoji:'📰', url:'korean-news-portal.html',
    msgs:['오늘의 헤드라인 정리 중','정치·경제·문화·스포츠 순서로!'] },

  { id:'life_planner',    dept:'life',    name:'플래너봇', emoji:'🗓️', url:'justin_life_planner.html',
    msgs:['여수·순천 자료 모으는 중','이번 분기 목표 점검!'] },

    msgs:['오늘 포트폴리오 어때요?','(모의) 수익률 계산 중'] },

  { id:'moka',            dept:'break',   name:'모카', emoji:'🐕', url:null,
    msgs:['멍!','산책 가요? 🦴','(꼬리 흔드는 중)'] },

  /* ── 나중에 업로드하면 주석 해제 ──
  { id:'item_scout', dept:'kshop', name:'스카웃봇', emoji:'🔎', url:'item_scout.html',
    msgs:['마진 계산 돌리는 중','이 아이템 괜찮은데요?'] },
  */
];

/* 상태 기본값: 각 앱이 localStorage에 보고하기 전까지 사용 */
const DEFAULT_STATUS = { status:'ready', message:null, lastUpdate:null };
const STALE_HOURS = 24;

/* ============================================================
   ② 상태 읽기 — localStorage 규약: jn_status_<appId>
   { "status":"working|ready|error", "message":"...", "lastUpdate":"ISO" }
   ============================================================ */
function readStatus(app){
  let s = { ...DEFAULT_STATUS };
  try{
    const raw = localStorage.getItem('jn_status_' + app.id);
    if(raw){ s = { ...s, ...JSON.parse(raw) }; }
  }catch(e){ /* 무시하고 기본값 */ }
  if(!['working','ready','error'].includes(s.status)) s.status = 'ready';
  // 24시간 이상 소식 없으면 자동 대기 전환
  if(s.status === 'working' && s.lastUpdate){
    const age = (Date.now() - new Date(s.lastUpdate).getTime()) / 36e5;
    if(age > STALE_HOURS){ s.status = 'ready'; s.message = '24시간째 소식이 없어요 💤'; }
  }
  if(typeof missing !== 'undefined' && missing.has(app.id)){
    s.status = 'error';
    s.message = '파일을 못 찾았어요 🔍 (url 확인 필요)';
  }
  return s;
}

/* ============================================================
   ②-2 통관 파이프라인 — 단계별 건수
   1순위: localStorage 'jn_customs_pipeline' (broker_ledger가 기록)
   2순위: 저장소의 customs_status.json (이메일 자동화가 기록 — 2단계)
   형식: {"received":3,"working":2,"hold":1,"delivered":5,"lastUpdate":"ISO"}
   ============================================================ */
const PIPE_KEY = 'jn_customs_pipeline';
let pipeline = { received:0, working:0, hold:0, delivered:0, lastUpdate:null, source:null };

function readPipelineLocal(){
  try{
    const raw = localStorage.getItem(PIPE_KEY);
    if(raw){ pipeline = { ...pipeline, ...JSON.parse(raw), source:'local' }; return true; }
  }catch(e){}
  return false;
}
async function fetchPipelineRemote(){
  if(!location.protocol.startsWith('http')) return;
  try{
    const r = await fetch('customs_status.json?t=' + Date.now());
    if(r.ok){
      const j = await r.json();
      if(!readPipelineLocal()){ pipeline = { ...pipeline, ...j, source:'remote' }; refresh(); }
    }
  }catch(e){ /* 파일 없으면 조용히 무시 */ }
}
function pipelineStale(){
  if(!pipeline.lastUpdate) return false;
  return (Date.now() - new Date(pipeline.lastUpdate).getTime()) / 36e5 > STALE_HOURS;
}
function stageStatus(stage){
  if(pipeline.source === null)
    return { status:'ready', message:'파이프라인 데이터 대기 중' };
  if(pipelineStale())
    return { status:'ready', message:'데이터가 오래됐어요 💤' };
  const n = pipeline[stage] || 0;
  switch(stage){
    case 'received':  return n>0 ? {status:'working', message:`신규 접수 ${n}건 📬`}
                                 : {status:'ready',   message:'새 이메일 대기 중'};
    case 'working':   return n>0 ? {status:'working', message:`Entry 작업 중 ${n}건`}
                                 : {status:'ready',   message:'작업 대기'};
    case 'hold':      return n>0 ? {status:'error',   message:`보류 ${n}건 확인 필요!`}
                                 : {status:'working', message:'보류 없음 ✨'};
    case 'delivered': return n>0 ? {status:'working', message:`전달 완료 ${n}건`}
                                 : {status:'ready',   message:'전달 대기'};
  }
  return { status:'ready', message:null };
}

/* ============================================================
   ③ 렌더링
   ============================================================ */
const officeEl = document.getElementById('office');
const charEls = {};   // appId -> element
const statuses = {};  // appId -> status obj

function build(){
  DEPTS.forEach(d=>{
    const members = APPS.filter(a=>a.dept===d.id);
    const room = document.createElement('section');
    room.className = 'room' + (d.wide ? ' wide' : '');
    room.innerHTML = `
      <div class="room-head">
        <span>${d.icon}</span><span class="tag">${d.name}</span>
        <span class="room-dot working" data-dept="${d.id}"></span>
      </div>
      <div class="floor" data-dept="${d.id}"></div>
      <div class="room-note">${d.note}</div>`;
    officeEl.appendChild(room);

    const floor = room.querySelector('.floor');
    members.forEach((a,i)=>{
      const c = document.createElement('div');
      c.className = 'char s-ready';
      c.tabIndex = 0;
      c.dataset.app = a.id;
      c.style.left = ((100/(members.length+1))*(i+1) + (Math.random()*8-4)) + '%';
      c.style.top  = (55 + Math.random()*35) + '%';
      c.innerHTML = `
        <div class="bubble"></div>
        <div class="warn" hidden>⚠️</div>
        <div class="badge" hidden></div>
        <div class="avatar">${a.emoji}</div>
        <div class="nametag">${a.name}</div>`;
      const open = ()=>{
        if(missing.has(a.id)){ showBubble(a.id, '아직 제 자리가 없어요… url을 고쳐주세요! 🙏', true); return; }
        if(!a.url) return;
        const w = window.open(a.url, '_blank');
        if(!w){
          // 팝업이 차단됐거나 iframe 안이면 현재 창(최상위)에서 이동
          try{ window.top.location.href = a.url; }
          catch(e){ location.href = a.url; }
        }
      };
      c.addEventListener('click', open);
      c.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();open();} });
      floor.appendChild(c);
      charEls[a.id] = c;
    });
  });
}

/* ============================================================
   ④ 상태 반영 (5초마다)
   ============================================================ */
const RANK = { error:3, ready:2, working:1 };
let lastReceived = null;
function refresh(){
  readPipelineLocal();
  // 접수 건수가 늘어나면 전달봇 출동!
  if(pipeline.source !== null){
    if(lastReceived !== null && pipeline.received > lastReceived){
      setTimeout(deliveryTrip, 600);
    }
    lastReceived = pipeline.received;
  }
  let w=0,r=0,e=0;
  APPS.forEach(a=>{
    const s = a.stage ? { ...stageStatus(a.stage), lastUpdate:pipeline.lastUpdate }
                      : readStatus(a);
    if(a.stage && typeof missing !== 'undefined' && missing.has(a.id)){
      s.status='error'; s.message='파일을 못 찾았어요 🔍';
    }
    statuses[a.id] = s;
    const el = charEls[a.id];
    el.className = 'char s-' + s.status;
    el.querySelector('.warn').hidden = (s.status !== 'error');
    // 건수 배지 (파이프라인 단계봇 전용)
    const badge = el.querySelector('.badge');
    if(a.stage){
      const n = pipeline[a.stage] || 0;
      badge.hidden = (n === 0 || pipeline.source === null);
      badge.textContent = n;
    }
    el.title = `${a.name} · ${s.status}` + (s.message ? ` · ${s.message}` : '');
    if(s.status==='working') w++; else if(s.status==='error') e++; else r++;
    if(s.status==='error') showBubble(a.id, s.message || '살려줘! 😵', true);
  });
  // 방 신호등 = 구성원 중 최악 상태
  document.querySelectorAll('.room-dot').forEach(dot=>{
    const members = APPS.filter(a=>a.dept===dot.dataset.dept);
    let worst='working';
    members.forEach(a=>{ if(RANK[statuses[a.id].status] > RANK[worst]) worst = statuses[a.id].status; });
    dot.className = 'room-dot ' + worst;
  });
  document.getElementById('cntWork').textContent = '근무 ' + w;
  document.getElementById('cntReady').textContent = '대기 ' + r;
  document.getElementById('cntErr').textContent = '점검 ' + e;
  document.getElementById('totalLine').textContent =
    `${APPS.length}명의 AI 직원이 ${DEPTS.length}개 부서에서 근무 중`;
}

/* ============================================================
   ⑤ 말풍선 + 돌아다니기
   ============================================================ */
function showBubble(appId, text, sticky=false){
  const el = charEls[appId];
  const b = el.querySelector('.bubble');
  b.textContent = text;
  b.classList.add('show');
  clearTimeout(b._t);
  if(!sticky) b._t = setTimeout(()=>b.classList.remove('show'), 3500);
}

function chatterLoop(){
  const pool = APPS.filter(a => statuses[a.id] && statuses[a.id].status !== 'error');
  if(pool.length){
    const a = pool[Math.floor(Math.random()*pool.length)];
    const s = statuses[a.id];
    // 실제 보고 메시지가 있으면 우선, 없으면 재미 멘트
    const text = (s.message && Math.random() < 0.5) ? s.message
               : a.msgs[Math.floor(Math.random()*a.msgs.length)];
    showBubble(a.id, text);
  }
  setTimeout(chatterLoop, 2500 + Math.random()*3500);
}

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let traveling = false;
function wanderLoop(){
  if(!reduced){
    const a = APPS[Math.floor(Math.random()*APPS.length)];
    if(!(traveling && a.id === 'stage_delivered')){
      const el = charEls[a.id];
      el.style.left = (15 + Math.random()*70) + '%';
      el.style.top  = (50 + Math.random()*42) + '%';
    }
  }
  setTimeout(wanderLoop, 3000 + Math.random()*4000);
}

/* ============================================================
   ⑤-3 전달봇 배달 이벤트 — 이메일 부서 → 실무처리 부서 왕복
   접수 건수가 늘어나면 자동 발동!
   ============================================================ */
function deliveryTrip(){
  const el = charEls['stage_delivered'];
  const worker = charEls['stage_working'];
  if(!el) return;
  if(reduced){ // 모션 최소화 환경: 말풍선만
    showBubble('stage_delivered','실무처리부에 서류 전달! 📦');
    if(worker) showBubble('stage_working','접수 완료! 바로 작업할게요 🛠️');
    return;
  }
  if(traveling) return;
  traveling = true;

  const homeFloor = el.parentElement;
  const targetFloor = document.querySelector('.floor[data-dept="work"]');
  const startLeft = el.style.left, startTop = el.style.top;
  const rect = el.getBoundingClientRect();

  // 고정 좌표로 전환해서 방 밖으로 나갈 수 있게
  el.style.transition = 'none';
  el.style.position = 'fixed';
  el.style.left = (rect.left + rect.width/2) + 'px';
  el.style.top  = rect.bottom + 'px';
  el.style.zIndex = 99;
  document.body.appendChild(el);
  showBubble('stage_delivered','실무처리부로 배달 중~ 🏃');

  requestAnimationFrame(()=>{
    el.style.transition = 'left 2.6s ease-in-out, top 2.6s ease-in-out';
    const t = targetFloor.getBoundingClientRect();
    el.style.left = (t.left + t.width*0.5) + 'px';
    el.style.top  = (t.top + t.height*0.78) + 'px';

    setTimeout(()=>{ // 도착 — 전달!
      showBubble('stage_delivered','서류 전달했습니다! 📦');
      if(worker) showBubble('stage_working','접수 완료! 바로 작업할게요 🛠️');

      setTimeout(()=>{ // 복귀 출발
        const back = homeFloor.getBoundingClientRect();
        el.style.left = (back.left + back.width*0.75) + 'px';
        el.style.top  = (back.top + back.height*0.82) + 'px';

        setTimeout(()=>{ // 원위치 복구
          el.style.transition = 'none';
          el.style.position = 'absolute';
          el.style.zIndex = '';
          el.style.left = startLeft;
          el.style.top  = startTop;
          homeFloor.appendChild(el);
          requestAnimationFrame(()=>{
            el.style.transition = 'left 2.6s ease-in-out, top 2.6s ease-in-out';
          });
          showBubble('stage_delivered','복귀 완료! ☕');
          traveling = false;
        }, 2800);
      }, 1800);
    }, 2800);
  });
}

/* ⑤-2 파일 존재 점검 — 404인 앱은 자동 빨간불 (GitHub Pages에서만 동작) */
const missing = new Set();
async function checkFiles(){
  if(!location.protocol.startsWith('http')) return; // file:// 로 열면 건너뜀
  for(const a of APPS){
    if(!a.url) continue;
    try{
      const res = await fetch(a.url, { method:'HEAD' });
      if(!res.ok){ missing.add(a.id); }
    }catch(e){ missing.add(a.id); }
  }
  if(missing.size) refresh();
}

/* ⑥ 시계 */
function tick(){
  const n = new Date();
  document.getElementById('clock').textContent =
    n.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
}

/* ============================================================
   시작
   ============================================================ */
build();
refresh();
tick();
checkFiles();
fetchPipelineRemote();
setInterval(fetchPipelineRemote, 60000);
/* 데모 배달: 실제 데이터가 연결되기 전에도 배달 장면을 보여줌 */
setTimeout(deliveryTrip, 8000);
setInterval(()=>{ if(pipeline.source === null) deliveryTrip(); }, 75000);
setInterval(refresh, 5000);
setInterval(tick, 15000);
setTimeout(chatterLoop, 1200);
setTimeout(wanderLoop, 2000);
