<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JN AI COMPANY · 3D LIVE OFFICE</title>
<link href="https://cdn.jsdelivr.net/npm/neodgm-webfont@1.530/neodgm/style.css" rel="stylesheet">
<style>
:root{
  --gold:#c9a45c; --gold-dim:#8a6f3e; --cream:#f3e7cd; --ink:#1d1608;
  --green:#4ade80; --yellow:#fbbf24; --red:#f4574d; --bubble:#fffdf5;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:'NeoDunggeunmo','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color:var(--cream);background:#17110a;
}
/* ── 상단 간판 ── */
header{
  position:fixed;top:0;left:0;right:0;z-index:50;
  background:linear-gradient(#2b2c52,#232447);
  border-bottom:3px solid var(--gold);
  padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  box-shadow:0 4px 14px rgba(0,0,0,.5);
}
header h1{font-size:16px;letter-spacing:2px;color:#e8dcae}
header h1 .dot{color:var(--gold)}
.hud{margin-left:auto;display:flex;gap:12px;align-items:center;font-size:13px}
.hud .clock{color:#cfd3ff}
.hud a{color:var(--ink);background:var(--cream);text-decoration:none;
  font-size:12px;border-radius:5px;padding:3px 9px;box-shadow:0 2px 0 rgba(0,0,0,.45)}
.hud .count{display:flex;gap:10px}
.hud .count span::before{content:'●';margin-right:4px}
.hud .c-work::before{color:var(--green)} .hud .c-ready::before{color:var(--yellow)} .hud .c-err::before{color:var(--red)}

/* ── 3D 캔버스 ── */
#scene{position:fixed;inset:0}
#labels{position:fixed;inset:0;pointer-events:none;z-index:10}
#labels *{pointer-events:none}

/* ── CSS2D 라벨들 ── */
.nametag{
  background:var(--cream);color:var(--ink);
  font-size:11px;padding:1px 7px;border-radius:4px;
  box-shadow:0 2px 0 rgba(0,0,0,.45);white-space:nowrap;
}
.nametag.vip{background:linear-gradient(#f7df90,#d9ac37);font-weight:bold;color:#3a2404}
.roomtag{
  background:var(--cream);color:var(--ink);
  font-size:12px;padding:2px 9px;border-radius:5px;
  box-shadow:0 2px 0 rgba(0,0,0,.4);white-space:nowrap;
}
.roomtag.luxe{background:linear-gradient(#f7df90,#d9ac37);font-weight:bold;color:#3a2404}
.bubble{
  background:var(--bubble);color:var(--ink);
  font-size:11px;line-height:1.35;padding:5px 9px;border-radius:9px;
  white-space:nowrap;max-width:220px;
  box-shadow:0 3px 8px rgba(0,0,0,.45);
  transform:scale(0);transition:transform .18s cubic-bezier(.34,1.56,.64,1);
  position:relative;
}
.bubble::after{
  content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:5px solid transparent;border-top-color:var(--bubble);
}
.bubble.show{transform:scale(1)}
.bubble.err{background:#ffe1de}
.bubble.err::after{border-top-color:#ffe1de}
.badge{
  min-width:19px;height:19px;padding:0 5px;border-radius:10px;
  background:#e5484d;color:#fff;font-size:11px;line-height:19px;text-align:center;
  box-shadow:0 2px 4px rgba(0,0,0,.5);
}
.warntag{font-size:15px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}

/* ── 하단 범례 ── */
footer{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:#171008ee;border-top:2px solid var(--gold-dim);
  padding:8px 16px;font-size:12px;color:#d8c69a;
  display:flex;gap:14px;flex-wrap:wrap;align-items:center;
}
footer b{color:var(--cream)}
footer .lg::before{content:'●';margin-right:4px}
.lg-g::before{color:var(--green)} .lg-y::before{color:var(--yellow)} .lg-r::before{color:var(--red)}
@media (max-width:640px){ header h1{font-size:13px} footer{font-size:11px;gap:10px} }
</style>

const DEFAULT_STATUS = { status:'ready', message:null, lastUpdate:null };
const STALE_HOURS = 24;
const STATUS_COLOR = { working:0x4ade80, ready:0xfbbf24, error:0xf4574d };

/* ============================================================
   ② 상태 읽기 (2D 버전과 동일 규약)
   ============================================================ */
const missing = new Set();
function readStatus(app){
  let s = { ...DEFAULT_STATUS };
  try{
    const raw = localStorage.getItem('jn_status_' + app.id);
    if(raw){ s = { ...s, ...JSON.parse(raw) }; }
  }catch(e){}
  if(!['working','ready','error'].includes(s.status)) s.status = 'ready';
  if(s.status === 'working' && s.lastUpdate){
    const age = (Date.now() - new Date(s.lastUpdate).getTime()) / 36e5;
    if(age > STALE_HOURS){ s.status = 'ready'; s.message = '24시간째 소식이 없어요 💤'; }
  }
  if(missing.has(app.id)){ s.status = 'error'; s.message = '파일을 못 찾았어요 🔍 (url 확인 필요)'; }
  return s;
}
async function checkFiles(){
  if(!location.protocol.startsWith('http')) return;
  for(const a of APPS){
    if(!a.url) continue;
    try{ const r = await fetch(a.url, { method:'HEAD' }); if(!r.ok) missing.add(a.id); }
    catch(e){ missing.add(a.id); }
  }
  if(missing.size) refresh();
}

/* 통관 파이프라인 */
const PIPE_KEY = 'jn_customs_pipeline';
let pipeline = { received:0, working:0, hold:0, delivered:0, lastUpdate:null, source:null };
function readPipelineLocal(){
  try{
    const raw = localStorage.getItem(PIPE_KEY);
    if(raw){ pipeline = { ...pipeline, ...JSON.parse(raw), source:'local' }; return true; }
  }catch(e){}
  return false;
}
async function fetchPipelineRemote(){
  if(!location.protocol.startsWith('http')) return;
  try{
    const r = await fetch('customs_status.json?t=' + Date.now());
    if(r.ok){
      const j = await r.json();
      if(!readPipelineLocal()){ pipeline = { ...pipeline, ...j, source:'remote' }; refresh(); }
    }
  }catch(e){}
}
function pipelineStale(){
  if(!pipeline.lastUpdate) return false;
  return (Date.now() - new Date(pipeline.lastUpdate).getTime()) / 36e5 > STALE_HOURS;
}
function stageStatus(stage){
  if(pipeline.source === null) return { status:'ready', message:'파이프라인 데이터 대기 중' };
  if(pipelineStale()) return { status:'ready', message:'데이터가 오래됐어요 💤' };
  const n = pipeline[stage] || 0;
  switch(stage){
    case 'received':  return n>0 ? {status:'working', message:`신규 접수 ${n}건 📬`} : {status:'ready', message:'새 이메일 대기 중'};
    case 'working':   return n>0 ? {status:'working', message:`Entry 작업 중 ${n}건`} : {status:'ready', message:'작업 대기'};
    case 'hold':      return n>0 ? {status:'error',   message:`보류 ${n}건 확인 필요!`} : {status:'working', message:'보류 없음 ✨'};
    case 'delivered': return n>0 ? {status:'working', message:`전달 완료 ${n}건`} : {status:'ready', message:'전달 대기'};
  }
  return { status:'ready', message:null };
}

  const slab = new THREE.Mesh(new THREE.BoxGeometry(d.w, SLAB, d.d), wood);
  slab.position.y = SLAB/2;
  slab.receiveShadow = true;
  g.add(slab);

  // 뒷벽(-z) 높게, 좌우 낮게 (열린 디오라마)
  const back = new THREE.Mesh(new THREE.BoxGeometry(d.w, WALL_H, WALL_T), wallMat);
  back.position.set(0, WALL_H/2, -d.d/2 + WALL_T/2);
  back.castShadow = true; back.receiveShadow = true;
  g.add(back);
  for(const sx of [-1, 1]){
    const side = new THREE.Mesh(new THREE.BoxGeometry(WALL_T, LOW_H, d.d), wallMat);
    side.position.set(sx*(d.w/2 - WALL_T/2), LOW_H/2, 0);
    side.castShadow = true; side.receiveShadow = true;
    g.add(side);
    const trim = new THREE.Mesh(new THREE.BoxGeometry(WALL_T+0.06, 0.12, d.d), accMat);
    trim.position.set(sx*(d.w/2 - WALL_T/2), LOW_H+0.06, 0);
    g.add(trim);
  }
  const backTrim = new THREE.Mesh(new THREE.BoxGeometry(d.w, 0.12, WALL_T+0.06), accMat);
  backTrim.position.set(0, WALL_H+0.06, -d.d/2 + WALL_T/2);
  g.add(backTrim);

  // 신호등 구슬 (뒷벽 우측 상단)
  const dot = new THREE.Mesh(
    new THREE.SphereGeometry(0.3, 16, 16),
    new THREE.MeshStandardMaterial({ color:0x4ade80, emissive:0x4ade80, emissiveIntensity:0.9 })
  );
  dot.position.set(d.w/2 - 0.9, WALL_H - 0.5, -d.d/2 + WALL_T + 0.25);
  g.add(dot);
  roomDots[d.id] = dot;

  // 부서 명패 (뒷벽 위)
  const tag = document.createElement('div');
  tag.className = 'roomtag' + (d.luxe ? ' luxe' : '');
  tag.textContent = d.name;
  const tagObj = new CSS2DObject(tag);
  tagObj.position.set(0, WALL_H + 0.9, -d.d/2 + WALL_T/2);
  g.add(tagObj);

  // 럭셔리: 레드 카펫 + 골드 라인
  if(d.luxe){
    const carpet = new THREE.Mesh(
      new THREE.PlaneGeometry(d.w*0.34, d.d*0.82),
      new THREE.MeshStandardMaterial({ color:0x7a1f27, roughness:0.95 })
    );
    carpet.rotation.x = -Math.PI/2;
    carpet.position.y = SLAB + 0.012;
    carpet.receiveShadow = true;
    g.add(carpet);
    for(const sx of [-1, 1]){
      const line = new THREE.Mesh(
        new THREE.PlaneGeometry(0.18, d.d*0.82),
        new THREE.MeshStandardMaterial({ color:0xd9ac37, emissive:0xd9ac37, emissiveIntensity:0.25 })
      );
      line.rotation.x = -Math.PI/2;
      line.position.set(sx*d.w*0.17, SLAB + 0.015, 0);
      g.add(line);
    }
  }

  // 소품: 책상 + 화분
  const deskMat = new THREE.MeshStandardMaterial({ color:0x5a4429, roughness:0.8 });
  const deskTop = new THREE.MeshStandardMaterial({ color:0x6e5433, roughness:0.7 });
  function desk(dx, dz){
    const b = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.9, 1.1), deskMat);
    b.position.set(dx, SLAB + 0.45, dz);
    b.castShadow = true; b.receiveShadow = true;
    g.add(b);
    const t = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.12, 1.3), deskTop);
    t.position.set(dx, SLAB + 0.96, dz);
    t.castShadow = true;
    g.add(t);
    const mon = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.6, 0.08),
      new THREE.MeshStandardMaterial({ color:0x18222e, emissive:0x3a6ea8, emissiveIntensity:0.6 }));
    mon.position.set(dx, SLAB + 1.35, dz - 0.25);
    g.add(mon);
  }
  desk(-d.w/2 + 2.4, -d.d/2 + 1.9);
  if(d.w > RW+1) desk(d.w/2 - 2.4, -d.d/2 + 1.9);

  const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.28, 0.5, 10),
    new THREE.MeshStandardMaterial({ color:0x8a5a30, roughness:0.9 }));
  pot.position.set(d.w/2 - 1.1, SLAB + 0.25, d.d/2 - 1.1);
  pot.castShadow = true;
  g.add(pot);
  const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.55, 1.1, 8),
    new THREE.MeshStandardMaterial({ color:0x3f7a3f, roughness:0.85 }));
  leaf.position.set(d.w/2 - 1.1, SLAB + 1.05, d.d/2 - 1.1);
  leaf.castShadow = true;
  g.add(leaf);

  scene.add(g);
  const pad = 1.6;
  deptBounds[d.id] = {
    minX: d.x - d.w/2 + pad, maxX: d.x + d.w/2 - pad,
    minZ: d.z - d.d/2 + pad + 1.0, maxZ: d.z + d.d/2 - pad,
  };
}
DEPTS.forEach(makeRoom);

/* ============================================================
   ④ 캐릭터 (빌보드 픽셀 스프라이트)
   ============================================================ */
const texLoader = new THREE.TextureLoader();
const baseTex = CHAR_SHEETS.map(u=>{
  const t = texLoader.load(u);
  t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
});
const petTexBase = texLoader.load(PET_SHEET);
petTexBase.magFilter = THREE.NearestFilter; petTexBase.minFilter = THREE.NearestFilter;
petTexBase.colorSpace = THREE.SRGBColorSpace;

const CHAR_W = 1.5, CHAR_H = 3.0;
const chars = {};        // id -> {app, group, plane, tex, disc, els{...}, state{...}}
const clickables = [];

function makeChar(a){
  const d = DEPTS.find(x=>x.id === a.dept);
  const g = new THREE.Group();
  const b = deptBounds[a.dept];
  g.position.set(
    b.minX + Math.random()*(b.maxX - b.minX),
    0,
    b.minZ + Math.random()*(b.maxZ - b.minZ)
  );

  const tex = (a.pet ? petTexBase : baseTex[a.spr || 0]).clone();
  tex.needsUpdate = true;
  const mat = new THREE.MeshBasicMaterial({ map:tex, transparent:true, alphaTest:0.5, side:THREE.DoubleSide });
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(CHAR_W, CHAR_H), mat);
  plane.position.y = SLAB + CHAR_H/2;
  plane.castShadow = true;
  plane.userData.appId = a.id;
  g.add(plane);
  clickables.push(plane);

  // 발밑 신호등 디스크
  const disc = new THREE.Mesh(
    new THREE.CircleGeometry(0.85, 24),
    new THREE.MeshBasicMaterial({ color:0xfbbf24, transparent:true, opacity:0.4 })
  );
  disc.rotation.x = -Math.PI/2;
  disc.position.y = SLAB + 0.02;
  g.add(disc);

  // 라벨들
  const nt = document.createElement('div');
  nt.className = 'nametag' + (a.vip ? ' vip' : '');
  nt.textContent = (a.vip ? '👑 ' : '') + a.name;
  const ntObj = new CSS2DObject(nt);
  ntObj.position.set(0, SLAB + 0.35, 0);
  g.add(ntObj);

  const bub = document.createElement('div');
  bub.className = 'bubble';
  const bubObj = new CSS2DObject(bub);
  bubObj.position.set(0, SLAB + CHAR_H + 1.0, 0);
  g.add(bubObj);

  const badge = document.createElement('div');
  badge.className = 'badge';
  badge.style.display = 'none';
  const badgeObj = new CSS2DObject(badge);
  badgeObj.position.set(0.75, SLAB + CHAR_H + 0.15, 0);
  g.add(badgeObj);

  const warn = document.createElement('div');
  warn.className = 'warntag';
  warn.textContent = '⚠️';
  warn.style.display = 'none';
  const warnObj = new CSS2DObject(warn);
  warnObj.position.set(-0.75, SLAB + CHAR_H + 0.15, 0);
  g.add(warnObj);

  scene.add(g);
  chars[a.id] = {
    app:a, group:g, plane, tex, disc,
    els:{ bub, badge, warn },
    state:{
      walking:false, target:null, speed:2.2,
      dir:'down', flip:false, f:0, idleF:Math.floor(Math.random()*4),
      frameT:0, idleT:0, nextWander: performance.now() + 1500 + Math.random()*4000,
      locked:false, bubT:0, status:'ready',
    }
  };
}
APPS.forEach(makeChar);

/* 프레임 UV 설정 */
function setFrame(c){
  const st = c.state, tex = c.tex;
  if(c.app.pet){
    const fw = 16/96, fh = 32/96;
    const col = st.walking ? (st.f % 3) : 3 + (st.idleF % 3);
    tex.repeat.set(st.flip ? -fw : fw, fh);
    tex.offset.set(st.flip ? (col+1)*fw : col*fw, 1 - fh);
    return;
  }
  const fw = 16/112, fh = 32/96;
  let col, row;
  if(st.walking){
    const seq = [0,1,2,1];
    col = seq[st.f % 4];
    row = st.dir === 'up' ? 1 : (st.dir === 'down' ? 0 : 2);
  }else{
    col = 3 + (st.idleF % 2);
    row = 0;
  }
  const flip = st.walking && st.dir === 'left';
  tex.repeat.set(flip ? -fw : fw, fh);
  tex.offset.set(flip ? (col+1)*fw : col*fw, 1 - fh*(row+1));
}
Object.values(chars).forEach(setFrame);

/* 걷기 목표 설정 */
function walkTo(c, x, z, speed){
  const st = c.state;
  st.target = new THREE.Vector3(x, 0, z);
  st.speed = speed || 2.2;
  const dx = x - c.group.position.x, dz = z - c.group.position.z;
  if(Math.abs(dx) >= Math.abs(dz)){ st.dir = dx >= 0 ? 'right' : 'left'; }
  else{ st.dir = dz >= 0 ? 'down' : 'up'; }
  st.flip = dx < 0;
  st.walking = true;
  setFrame(c);
}

/* ============================================================
   ⑤ 상태 반영 + 말풍선
   ============================================================ */
const RANK = { error:3, ready:2, working:1 };
const statuses = {};
let lastReceived = null;

function showBubble(id, text, sticky){
  const c = chars[id]; if(!c) return;
  const b = c.els.bub;
  b.textContent = text;
  b.classList.toggle('err', c.state.status === 'error');
  b.classList.add('show');
  clearTimeout(b._t);
  if(!sticky) b._t = setTimeout(()=>b.classList.remove('show'), 3500);
}

function refresh(){
  readPipelineLocal();
  if(pipeline.source !== null){
    if(lastReceived !== null && pipeline.received > lastReceived) setTimeout(deliveryTrip, 600);
    lastReceived = pipeline.received;
  }
  let w=0, r=0, e=0;
  APPS.forEach(a=>{
    const c = chars[a.id];
    const s = a.stage ? { ...stageStatus(a.stage) } : readStatus(a);
    if(a.stage && missing.has(a.id)){ s.status='error'; s.message='파일을 못 찾았어요 🔍'; }
    statuses[a.id] = s;
    c.state.status = s.status;
    c.disc.material.color.setHex(STATUS_COLOR[s.status]);
    c.disc.material.opacity = s.status === 'error' ? 0.75 : 0.4;
    c.els.warn.style.display = s.status === 'error' ? '' : 'none';
    if(a.stage){
      const n = pipeline[a.stage] || 0;
      c.els.badge.style.display = (n === 0 || pipeline.source === null) ? 'none' : '';
      c.els.badge.textContent = n;
    }
    if(s.status === 'working') w++; else if(s.status === 'error') e++; else r++;
    if(s.status === 'error') showBubble(a.id, s.message || '살려줘! 😵', true);
    else if(c.els.bub.classList.contains('err')){ c.els.bub.classList.remove('show','err'); }
  });
  for(const d of DEPTS){
    let worst = 'working';
    APPS.filter(a=>a.dept === d.id).forEach(a=>{
      if(RANK[statuses[a.id].status] > RANK[worst]) worst = statuses[a.id].status;
    });
    if(!APPS.some(a=>a.dept === d.id)) worst = 'ready';
    roomDots[d.id].material.color.setHex(STATUS_COLOR[worst]);
    roomDots[d.id].material.emissive.setHex(STATUS_COLOR[worst]);
  }
  document.getElementById('cntWork').textContent = '근무 ' + w;
  document.getElementById('cntReady').textContent = '대기 ' + r;
  document.getElementById('cntErr').textContent = '점검 ' + e;
  document.getElementById('totalLine').textContent =
    `${APPS.length}명의 AI 직원이 ${DEPTS.length}개 부서에서 근무 중`;
}

function chatterLoop(){
  const pool = APPS.filter(a => statuses[a.id] && statuses[a.id].status !== 'error');
  if(pool.length){
    const a = pool[Math.floor(Math.random()*pool.length)];
    const s = statuses[a.id];
    const text = (s.message && Math.random() < 0.5) ? s.message
               : a.msgs[Math.floor(Math.random()*a.msgs.length)];
    showBubble(a.id, text);
  }
  setTimeout(chatterLoop, 2500 + Math.random()*3500);
}

/* ============================================================
   ⑥ 전달봇 배달 이벤트 (이메일 → 실무처리 왕복)
   ============================================================ */
let traveling = false;
function deliveryTrip(){
  const c = chars['stage_delivered'];
  if(!c || traveling) return;
  traveling = true;
  c.state.locked = true;
  const home = c.group.position.clone();
  const eb = deptBounds['email'], wb = deptBounds['work'];
  const doorE = new THREE.Vector3((eb.minX+eb.maxX)/2, 0, eb.maxZ + 2.5);
  const doorW = new THREE.Vector3((wb.minX+wb.maxX)/2, 0, wb.minZ - 2.5);
  const deskW = new THREE.Vector3((wb.minX+wb.maxX)/2, 0, (wb.minZ+wb.maxZ)/2);

  showBubble('stage_delivered', '실무처리부로 배달 중~ 🏃');
  const steps = [
    [doorE, 3.2], [doorW, 3.6], [deskW, 3.2],
  ];
  let i = 0;
  c.state.onArrive = ()=>{
    i++;
    if(i < steps.length){ walkTo(c, steps[i][0].x, steps[i][0].z, steps[i][1]); return; }
    if(i === steps.length){ // 도착!
      showBubble('stage_delivered', '서류 전달했습니다! 📦');
      showBubble('stage_working', '접수 완료! 바로 작업할게요 🛠️');
      setTimeout(()=>{
        showBubble('stage_delivered', '복귀합니다~');
        c.state.onArrive = ()=>{
          if(i === steps.length + 1){ i++; walkTo(c, doorE.x, doorE.z, 3.6); return; }
          if(i === steps.length + 2){ i++; walkTo(c, home.x, home.z, 3.0); return; }
          showBubble('stage_delivered', '복귀 완료! ☕');
          c.state.onArrive = null;
          c.state.locked = false;
          traveling = false;
        };
        i++;
        walkTo(c, doorW.x, doorW.z, 3.2);
      }, 1800);
      return;
    }
  };
  walkTo(c, steps[0][0].x, steps[0][0].z, steps[0][1]);
}

/* ============================================================
   ⑦ 클릭 → 앱 열기
   ============================================================ */
const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e=>{ downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e=>{
  if(!downAt) return;
  const moved = Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]);
  downAt = null;
  if(moved > 6) return; // 드래그(회전)는 무시
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(clickables, false)[0];
  if(!hit) return;
  const id = hit.object.userData.appId;
  const a = APPS.find(x=>x.id === id);
  if(missing.has(id)){ showBubble(id, '아직 제 자리가 없어요… url을 고쳐주세요! 🙏', true); return; }
  if(!a.url) { showBubble(id, '멍멍! 🐕'); return; }
  const w = window.open(a.url, '_blank');
  if(!w){ try{ window.top.location.href = a.url; }catch(err){ location.href = a.url; } }
});

/* ============================================================
   ⑧ 메인 루프
   ============================================================ */
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clock3 = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock3.getDelta(), 0.1);
  const now = performance.now();

  for(const c of Object.values(chars)){
    const st = c.state, g = c.group;
    // 걷기
    if(st.walking && st.target){
      const dx = st.target.x - g.position.x, dz = st.target.z - g.position.z;
      const dist = Math.hypot(dx, dz);
      const step = st.speed * dt;
      if(dist <= step){
        g.position.x = st.target.x; g.position.z = st.target.z;
        st.walking = false; st.target = null; st.dir = 'down';
        st.nextWander = now + 2000 + Math.random()*5000;
        setFrame(c);
        if(st.onArrive) st.onArrive();
      }else{
        g.position.x += dx/dist*step;
        g.position.z += dz/dist*step;
        st.frameT += dt;
        if(st.frameT > 0.15){ st.frameT = 0; st.f++; setFrame(c); }
      }
    }else{
      st.idleT += dt;
      if(st.idleT > 0.65){ st.idleT = 0; st.idleF++; setFrame(c); }
      if(!reduced && !st.locked && now > st.nextWander){
        const b = deptBounds[c.app.dept];
        walkTo(c, b.minX + Math.random()*(b.maxX-b.minX), b.minZ + Math.random()*(b.maxZ-b.minZ),
               c.app.pet ? 1.6 : 2.2);
      }
    }
    // 에러 시 부들부들
    if(st.status === 'error'){
      c.plane.position.x = Math.sin(now/40) * 0.06;
      c.disc.scale.setScalar(1 + Math.sin(now/220)*0.18);
    }else{
      c.plane.position.x = 0;
      c.disc.scale.setScalar(1);
    }
    // 카메라 향해 서기 (원통형 빌보드)
    c.plane.rotation.y = Math.atan2(camera.position.x - g.position.x, camera.position.z - g.position.z);
  }

  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
animate();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ⑨ 시계·시작 */
function tick(){
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
}
refresh();
tick();
checkFiles();
fetchPipelineRemote();
setInterval(refresh, 5000);
setInterval(tick, 15000);
setInterval(fetchPipelineRemote, 60000);
setTimeout(chatterLoop, 1500);
setTimeout(deliveryTrip, 8000);
setInterval(()=>{ if(pipeline.source === null) deliveryTrip(); }, 75000);
</script>
