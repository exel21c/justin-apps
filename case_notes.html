<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case Notes DB — Exel Logistics</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy: #0F2744;
  --navy-mid: #1A3A5C;
  --navy-light: #EBF0F7;
  --blue: #2563EB;
  --blue-light: #DBEAFE;
  --gold: #B45309;
  --gold-light: #FEF3C7;
  --green: #065F46;
  --green-light: #D1FAE5;
  --red: #991B1B;
  --red-light: #FEE2E2;
  --gray-50: #F9FAFB;
  --gray-100: #F3F4F6;
  --gray-200: #E5E7EB;
  --gray-400: #9CA3AF;
  --gray-600: #4B5563;
  --gray-800: #1F2937;
  --text: #111827;
  --text-sec: #6B7280;
  --border: #E5E7EB;
  --radius: 8px;
  --radius-lg: 12px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--gray-50);
  color: var(--text);
  min-height: 100vh;
  font-size: 14px;
}

/* ── HEADER ── */
.app-header {
  background: var(--navy);
  color: white;
  padding: 0 24px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.app-header h1 {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.app-header .sub {
  font-size: 11px;
  color: #94A3B8;
  margin-top: 1px;
}
.header-actions { display: flex; gap: 8px; }
.btn-icon {
  background: rgba(255,255,255,0.1);
  border: none;
  color: white;
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
  display: flex; align-items: center; gap: 5px;
  transition: background 0.15s;
}
.btn-icon:hover { background: rgba(255,255,255,0.2); }
.btn-icon svg { width: 14px; height: 14px; }

/* ── LAYOUT ── */
.app-body {
  display: grid;
  grid-template-columns: 280px 1fr;
  min-height: calc(100vh - 56px);
}

/* ── SIDEBAR ── */
.sidebar {
  background: white;
  border-right: 1px solid var(--border);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.stats-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.stat-card {
  background: var(--gray-50);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 12px;
  text-align: center;
}
.stat-num { font-size: 22px; font-weight: 700; color: var(--navy); line-height: 1; }
.stat-label { font-size: 10px; color: var(--text-sec); margin-top: 3px; text-transform: uppercase; letter-spacing: 0.05em; }

.section-title {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-sec);
  text-transform: uppercase;
  letter-spacing: 0.07em;
  margin-bottom: 6px;
}

.filter-group { display: flex; flex-direction: column; gap: 4px; }
.filter-btn {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 10px;
  border-radius: var(--radius);
  border: none;
  background: transparent;
  cursor: pointer;
  font-size: 13px;
  color: var(--gray-600);
  text-align: left;
  transition: all 0.12s;
}
.filter-btn:hover { background: var(--gray-100); }
.filter-btn.active { background: var(--navy-light); color: var(--navy); font-weight: 500; }
.filter-count {
  font-size: 11px;
  background: var(--gray-200);
  color: var(--gray-600);
  padding: 1px 7px;
  border-radius: 10px;
}
.filter-btn.active .filter-count { background: var(--navy); color: white; }

.tag-cloud { display: flex; flex-wrap: wrap; gap: 5px; }
.tag-pill {
  padding: 3px 9px;
  border-radius: 12px;
  font-size: 11px;
  cursor: pointer;
  border: 1px solid var(--border);
  background: white;
  color: var(--gray-600);
  transition: all 0.12s;
}
.tag-pill:hover, .tag-pill.active { background: var(--navy); color: white; border-color: var(--navy); }

/* ── MAIN ── */
.main { padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }

/* ── SEARCH BAR ── */
.search-bar {
  display: flex; gap: 10px; align-items: center;
}
.search-wrap {
  flex: 1; position: relative;
}
.search-wrap svg {
  position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
  width: 16px; height: 16px; color: var(--gray-400);
}
.search-wrap input {
  width: 100%;
  padding: 9px 12px 9px 34px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 13px;
  background: white;
  color: var(--text);
  outline: none;
  transition: border 0.15s;
}
.search-wrap input:focus { border-color: var(--blue); }
.btn-add {
  background: var(--navy);
  color: white;
  border: none;
  padding: 9px 16px;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  display: flex; align-items: center; gap: 6px;
  transition: background 0.15s;
}
.btn-add:hover { background: var(--navy-mid); }
.btn-add svg { width: 15px; height: 15px; }

/* ── CASE LIST ── */
.cases-list { display: flex; flex-direction: column; gap: 8px; }
.case-card {
  background: white;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px 16px;
  cursor: pointer;
  transition: all 0.15s;
  border-left: 3px solid transparent;
}
.case-card:hover { border-color: var(--navy-light); box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.case-card.selected { border-left-color: var(--blue); background: #FAFCFF; }
.case-card.flag-stale { border-left-color: var(--gold); }

.case-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.case-hts {
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: 13px;
  font-weight: 600;
  color: var(--navy);
  background: var(--navy-light);
  padding: 2px 8px;
  border-radius: 4px;
  letter-spacing: 0.03em;
}
.case-date { font-size: 11px; color: var(--text-sec); white-space: nowrap; }
.case-title { font-size: 14px; font-weight: 500; margin-bottom: 4px; color: var(--text); }
.case-client { font-size: 12px; color: var(--text-sec); margin-bottom: 8px; }
.case-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.case-tag {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  background: var(--gray-100);
  color: var(--gray-600);
}
.case-tag.origin { background: var(--blue-light); color: #1D4ED8; }
.case-tag.stale-flag { background: var(--gold-light); color: var(--gold); }
.case-tag.ruling { background: var(--green-light); color: var(--green); }

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-sec);
}
.empty-state svg { width: 40px; height: 40px; color: var(--gray-200); margin: 0 auto 12px; display: block; }
.empty-state p { font-size: 13px; }

/* ── DETAIL PANEL ── */
.detail-panel {
  display: none;
  background: white;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.detail-panel.open { display: flex; flex-direction: column; }

.detail-header {
  background: var(--navy);
  color: white;
  padding: 16px 20px;
  display: flex; align-items: flex-start; justify-content: space-between;
}
.detail-hts {
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.05em;
  margin-bottom: 4px;
}
.detail-title { font-size: 14px; color: #94A3B8; }
.btn-close {
  background: rgba(255,255,255,0.15);
  border: none;
  color: white;
  width: 28px; height: 28px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 16px;
  display: flex; align-items: center; justify-content: center;
}
.btn-close:hover { background: rgba(255,255,255,0.25); }

.detail-body { padding: 20px; flex: 1; overflow-y: auto; }
.detail-section { margin-bottom: 20px; }
.detail-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-sec);
  margin-bottom: 6px;
}
.detail-value {
  font-size: 13px;
  color: var(--text);
  line-height: 1.6;
  white-space: pre-wrap;
}
.detail-meta {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 16px;
}
.meta-item { }
.ruling-box {
  background: var(--green-light);
  border: 1px solid #6EE7B7;
  border-radius: var(--radius);
  padding: 10px 12px;
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: 13px;
  color: var(--green);
  font-weight: 600;
}
.stale-box {
  background: var(--gold-light);
  border: 1px solid #FCD34D;
  border-radius: var(--radius);
  padding: 10px 12px;
  font-size: 12px;
  color: var(--gold);
  display: flex; align-items: center; gap: 8px;
}
.detail-actions {
  padding: 14px 20px;
  border-top: 1px solid var(--border);
  display: flex; gap: 8px;
}
.btn-edit {
  background: var(--navy);
  color: white;
  border: none;
  padding: 8px 16px;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s;
}
.btn-edit:hover { background: var(--navy-mid); }
.btn-delete {
  background: white;
  color: var(--red);
  border: 1px solid #FCA5A5;
  padding: 8px 16px;
  border-radius: var(--radius);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-delete:hover { background: var(--red-light); }

/* ── MODAL ── */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 200;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: white;
  border-radius: var(--radius-lg);
  width: 100%;
  max-width: 600px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
}
.modal-header {
  padding: 18px 20px 14px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.modal-header h2 { font-size: 15px; font-weight: 600; }
.modal-body { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 12px; font-weight: 500; color: var(--gray-600); }
.field input, .field select, .field textarea {
  padding: 8px 11px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 13px;
  color: var(--text);
  background: white;
  font-family: inherit;
  outline: none;
  transition: border 0.15s;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--blue); }
.field textarea { resize: vertical; min-height: 80px; }
.field input.mono { font-family: 'SF Mono', 'Fira Code', monospace; letter-spacing: 0.05em; }
.field-hint { font-size: 11px; color: var(--text-sec); }
.modal-footer {
  padding: 14px 20px;
  border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end; gap: 8px;
}
.btn-cancel {
  background: white;
  border: 1px solid var(--border);
  color: var(--gray-600);
  padding: 8px 16px;
  border-radius: var(--radius);
  font-size: 13px;
  cursor: pointer;
}
.btn-save {
  background: var(--navy);
  color: white;
  border: none;
  padding: 8px 20px;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s;
}
.btn-save:hover { background: var(--navy-mid); }

/* ── TOAST ── */
.toast {
  position: fixed;
  bottom: 24px; right: 24px;
  background: var(--navy);
  color: white;
  padding: 10px 18px;
  border-radius: var(--radius);
  font-size: 13px;
  opacity: 0;
  transform: translateY(8px);
  transition: all 0.2s;
  z-index: 999;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateY(0); }

@media (max-width: 768px) {
  .app-body { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .field-row { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header class="app-header">
  <div>
    <div class="app-header h1" style="font-size:15px;font-weight:600;letter-spacing:-0.01em;color:white;">Case Notes DB</div>
    <div class="sub">Exel Logistics — CBP #42913</div>
  </div>
  <div class="header-actions">
    <button class="btn-icon" onclick="exportJSON()">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
      Export JSON
    </button>
    <label class="btn-icon" style="cursor:pointer;">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l4-4m0 0l4 4m-4-4v12"/></svg>
      Import JSON
      <input type="file" accept=".json" style="display:none" onchange="importJSON(event)">
    </label>
  </div>
</header>

<div class="app-body">

  <aside class="sidebar">
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-num" id="statTotal">0</div>
        <div class="stat-label">총 케이스</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statStale" style="color:var(--gold);">0</div>
        <div class="stat-label">재확인 필요</div>
      </div>
    </div>

    <div>
      <div class="section-title">카테고리</div>
      <div class="filter-group">
        <button class="filter-btn active" onclick="setFilter('all',this)" data-filter="all">
          전체
          <span class="filter-count" id="countAll">0</span>
        </button>
        <button class="filter-btn" onclick="setFilter('HTS분류',this)" data-filter="HTS분류">
          HTS 분류
          <span class="filter-count" id="countHTS">0</span>
        </button>
        <button class="filter-btn" onclick="setFilter('원산지',this)" data-filter="원산지">
          원산지
          <span class="filter-count" id="countOrigin">0</span>
        </button>
        <button class="filter-btn" onclick="setFilter('검사',this)" data-filter="검사">
          검사 이력
          <span class="filter-count" id="countInsp">0</span>
        </button>
        <button class="filter-btn" onclick="setFilter('ADD/CVD',this)" data-filter="ADD/CVD">
          ADD/CVD
          <span class="filter-count" id="countADD">0</span>
        </button>
        <button class="filter-btn" onclick="setFilter('클라이언트',this)" data-filter="클라이언트">
          클라이언트 이슈
          <span class="filter-count" id="countClient">0</span>
        </button>
        <button class="filter-btn" onclick="setFilter('stale',this)" data-filter="stale">
          ⚑ 재확인 필요
          <span class="filter-count" id="countStale2">0</span>
        </button>
      </div>
    </div>

    <div>
      <div class="section-title">태그</div>
      <div class="tag-cloud" id="tagCloud"></div>
    </div>
  </aside>

  <main class="main">
    <div class="search-bar">
      <div class="search-wrap">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0"/></svg>
        <input type="text" id="searchInput" placeholder="HTS번호, 품목명, 키워드 검색..." oninput="renderList()">
      </div>
      <button class="btn-add" onclick="openModal()">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        새 케이스
      </button>
    </div>

    <div style="display:grid; grid-template-columns: 1fr 360px; gap:16px; align-items:start;">
      <div>
        <div class="cases-list" id="casesList"></div>
      </div>
      <div class="detail-panel" id="detailPanel"></div>
    </div>
  </main>
</div>

<!-- ADD/EDIT MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">새 케이스 등록</h2>
      <button class="btn-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="field-row">
        <div class="field">
          <label>HTS 번호 *</label>
          <input type="text" id="f_hts" class="mono" placeholder="0000.00.0000" maxlength="12">
          <span class="field-hint">예: 3304.99.5000</span>
        </div>
        <div class="field">
          <label>카테고리 *</label>
          <select id="f_category">
            <option value="HTS분류">HTS 분류</option>
            <option value="원산지">원산지</option>
            <option value="검사">검사 이력</option>
            <option value="ADD/CVD">ADD/CVD</option>
            <option value="클라이언트">클라이언트 이슈</option>
            <option value="기타">기타</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>품목명 *</label>
        <input type="text" id="f_title" placeholder="예: Korean BB Cream with SPF 30">
      </div>
      <div class="field-row">
        <div class="field">
          <label>클라이언트</label>
          <input type="text" id="f_client" placeholder="예: ABC Imports">
        </div>
        <div class="field">
          <label>원산지</label>
          <input type="text" id="f_origin" placeholder="예: Korea (KR)">
        </div>
      </div>
      <div class="field">
        <label>분류 근거 / 케이스 요약 *</label>
        <textarea id="f_rationale" placeholder="왜 이 HTS를 선택했는지, 어떤 기준을 적용했는지 기록하세요.&#10;예: Chapter 33 기준, 주 성분이 sunscreen이 아닌 skincare이므로 3304.99로 분류."></textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label>CBP Ruling 번호</label>
          <input type="text" id="f_ruling" class="mono" placeholder="예: N123456">
        </div>
        <div class="field">
          <label>세율 (MFN)</label>
          <input type="text" id="f_rate" placeholder="예: Free / 3.5%">
        </div>
      </div>
      <div class="field">
        <label>태그 (쉼표로 구분)</label>
        <input type="text" id="f_tags" placeholder="예: K-beauty, SPF, Chapter33, cosmetics">
      </div>
      <div class="field">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
          <input type="checkbox" id="f_stale" style="width:14px;height:14px;">
          관세율 재확인 필요 플래그
        </label>
        <span class="field-hint">Section 301, AD/CVD 등 세율이 바뀔 수 있는 케이스에 체크</span>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-save" onclick="saveCase()">저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'exel_case_notes_v1';
let cases = [];
let activeFilter = 'all';
let activeTag = null;
let editingId = null;
let selectedId = null;

function loadCases() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    cases = raw ? JSON.parse(raw) : [];
  } catch(e) { cases = []; }
}

function saveCases() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(cases));
}

function genId() {
  return Date.now().toString(36) + Math.random().toString(36).substr(2,5);
}

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('ko-KR', { year:'numeric', month:'short', day:'numeric' });
}

function getFiltered() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  return cases.filter(c => {
    const matchFilter = activeFilter === 'all' ? true
      : activeFilter === 'stale' ? c.stale
      : c.category === activeFilter;
    const matchTag = activeTag ? (c.tags||[]).some(t => t.toLowerCase() === activeTag.toLowerCase()) : true;
    const matchSearch = !q ? true : [
      c.hts, c.title, c.client, c.origin, c.rationale, c.ruling, ...(c.tags||[])
    ].some(v => v && v.toLowerCase().includes(q));
    return matchFilter && matchTag && matchSearch;
  });
}

function renderList() {
  const list = document.getElementById('casesList');
  const filtered = getFiltered();

  if (!filtered.length) {
    list.innerHTML = `<div class="empty-state">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      <p>${cases.length === 0 ? '"새 케이스" 버튼으로 첫 케이스를 등록하세요.' : '검색 결과가 없어요.'}</p>
    </div>`;
    return;
  }

  list.innerHTML = filtered.sort((a,b) => b.createdAt.localeCompare(a.createdAt)).map(c => {
    const tags = (c.tags||[]).slice(0,3).map(t =>
      `<span class="case-tag">${t}</span>`).join('');
    const staleBadge = c.stale ? `<span class="case-tag stale-flag">⚑ 재확인</span>` : '';
    const rulingBadge = c.ruling ? `<span class="case-tag ruling">Ruling</span>` : '';
    const originTag = c.origin ? `<span class="case-tag origin">${c.origin}</span>` : '';
    return `<div class="case-card${c.stale?' flag-stale':''}${c.id===selectedId?' selected':''}" onclick="showDetail('${c.id}')">
      <div class="case-top">
        <span class="case-hts">${c.hts || '—'}</span>
        <span class="case-date">${formatDate(c.createdAt)}</span>
      </div>
      <div class="case-title">${c.title}</div>
      <div class="case-client">${c.client || '—'} ${c.category ? '· '+c.category : ''}</div>
      <div class="case-tags">${originTag}${rulingBadge}${staleBadge}${tags}</div>
    </div>`;
  }).join('');

  updateStats();
  updateTagCloud();
}

function updateStats() {
  document.getElementById('statTotal').textContent = cases.length;
  const stale = cases.filter(c=>c.stale).length;
  document.getElementById('statStale').textContent = stale;
  document.getElementById('countAll').textContent = cases.length;
  document.getElementById('countHTS').textContent = cases.filter(c=>c.category==='HTS분류').length;
  document.getElementById('countOrigin').textContent = cases.filter(c=>c.category==='원산지').length;
  document.getElementById('countInsp').textContent = cases.filter(c=>c.category==='검사').length;
  document.getElementById('countADD').textContent = cases.filter(c=>c.category==='ADD/CVD').length;
  document.getElementById('countClient').textContent = cases.filter(c=>c.category==='클라이언트').length;
  document.getElementById('countStale2').textContent = stale;
}

function updateTagCloud() {
  const freq = {};
  cases.forEach(c => (c.tags||[]).forEach(t => { freq[t] = (freq[t]||0)+1; }));
  const sorted = Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,20);
  document.getElementById('tagCloud').innerHTML = sorted.map(([t,n]) =>
    `<button class="tag-pill${activeTag===t?' active':''}" onclick="setTagFilter('${t}')">${t} <span style="opacity:.6;">${n}</span></button>`
  ).join('');
}

function setFilter(f, el) {
  activeFilter = f;
  activeTag = null;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  renderList();
}

function setTagFilter(tag) {
  if (activeTag === tag) {
    activeTag = null;
  } else {
    activeTag = tag;
    activeFilter = 'all';
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    document.querySelector('[data-filter="all"]').classList.add('active');
  }
  renderList();
  updateTagCloud();
}

function showDetail(id) {
  selectedId = id;
  const c = cases.find(x=>x.id===id);
  if (!c) return;
  renderList();
  const panel = document.getElementById('detailPanel');
  const tags = (c.tags||[]).map(t=>`<span class="case-tag">${t}</span>`).join(' ');
  panel.className = 'detail-panel open';
  panel.innerHTML = `
    <div class="detail-header">
      <div>
        <div class="detail-hts">${c.hts || '—'}</div>
        <div class="detail-title">${c.title}</div>
      </div>
      <button class="btn-close" onclick="closeDetail()">×</button>
    </div>
    <div class="detail-body">
      ${c.stale ? `<div class="stale-box" style="margin-bottom:16px;">⚑ 관세율 재확인이 필요한 케이스입니다. ACE/CROSS에서 현재 세율을 확인하세요.</div>` : ''}
      <div class="detail-meta">
        <div class="meta-item"><div class="detail-label">카테고리</div><div class="detail-value">${c.category}</div></div>
        <div class="meta-item"><div class="detail-label">등록일</div><div class="detail-value">${formatDate(c.createdAt)}</div></div>
        <div class="meta-item"><div class="detail-label">클라이언트</div><div class="detail-value">${c.client||'—'}</div></div>
        <div class="meta-item"><div class="detail-label">원산지</div><div class="detail-value">${c.origin||'—'}</div></div>
      </div>
      ${c.ruling ? `<div class="detail-section"><div class="detail-label">CBP Ruling</div><div class="ruling-box">${c.ruling}</div></div>` : ''}
      ${c.rate ? `<div class="detail-section"><div class="detail-label">세율 (MFN)</div><div class="detail-value">${c.rate}</div></div>` : ''}
      <div class="detail-section">
        <div class="detail-label">분류 근거 / 케이스 요약</div>
        <div class="detail-value" style="background:var(--gray-50);padding:12px;border-radius:var(--radius);border:1px solid var(--border);">${c.rationale||'—'}</div>
      </div>
      ${(c.tags||[]).length ? `<div class="detail-section"><div class="detail-label">태그</div><div>${tags}</div></div>` : ''}
    </div>
    <div class="detail-actions">
      <button class="btn-edit" onclick="openModal('${c.id}')">수정</button>
      <button class="btn-delete" onclick="deleteCase('${c.id}')">삭제</button>
    </div>`;
}

function closeDetail() {
  selectedId = null;
  document.getElementById('detailPanel').className = 'detail-panel';
  renderList();
}

function openModal(id) {
  editingId = id || null;
  document.getElementById('modalTitle').textContent = id ? '케이스 수정' : '새 케이스 등록';
  if (id) {
    const c = cases.find(x=>x.id===id);
    document.getElementById('f_hts').value = c.hts||'';
    document.getElementById('f_category').value = c.category||'HTS분류';
    document.getElementById('f_title').value = c.title||'';
    document.getElementById('f_client').value = c.client||'';
    document.getElementById('f_origin').value = c.origin||'';
    document.getElementById('f_rationale').value = c.rationale||'';
    document.getElementById('f_ruling').value = c.ruling||'';
    document.getElementById('f_rate').value = c.rate||'';
    document.getElementById('f_tags').value = (c.tags||[]).join(', ');
    document.getElementById('f_stale').checked = !!c.stale;
  } else {
    ['f_hts','f_title','f_client','f_origin','f_rationale','f_ruling','f_rate','f_tags'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('f_category').value = 'HTS분류';
    document.getElementById('f_stale').checked = false;
  }
  document.getElementById('modalOverlay').className = 'modal-overlay open';
}

function closeModal() {
  document.getElementById('modalOverlay').className = 'modal-overlay';
  editingId = null;
}

function saveCase() {
  const hts = document.getElementById('f_hts').value.trim();
  const title = document.getElementById('f_title').value.trim();
  const rationale = document.getElementById('f_rationale').value.trim();
  if (!title || !rationale) { showToast('품목명과 분류 근거는 필수예요.'); return; }

  const tags = document.getElementById('f_tags').value.split(',').map(t=>t.trim()).filter(Boolean);
  const data = {
    hts, title, rationale, tags,
    category: document.getElementById('f_category').value,
    client: document.getElementById('f_client').value.trim(),
    origin: document.getElementById('f_origin').value.trim(),
    ruling: document.getElementById('f_ruling').value.trim(),
    rate: document.getElementById('f_rate').value.trim(),
    stale: document.getElementById('f_stale').checked,
  };

  if (editingId) {
    const idx = cases.findIndex(c=>c.id===editingId);
    cases[idx] = { ...cases[idx], ...data, updatedAt: new Date().toISOString() };
    showToast('케이스가 수정됐어요.');
    showDetail(editingId);
  } else {
    const newCase = { ...data, id: genId(), createdAt: new Date().toISOString() };
    cases.unshift(newCase);
    showToast('케이스가 등록됐어요.');
  }
  saveCases();
  closeModal();
  renderList();
}

function deleteCase(id) {
  if (!confirm('이 케이스를 삭제할까요?')) return;
  cases = cases.filter(c=>c.id!==id);
  saveCases();
  closeDetail();
  renderList();
  showToast('삭제됐어요.');
}

function exportJSON() {
  const blob = new Blob([JSON.stringify(cases, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `case_notes_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('JSON 파일로 내보냈어요.');
}

function importJSON(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const imported = JSON.parse(ev.target.result);
      if (!Array.isArray(imported)) throw new Error();
      const existingIds = new Set(cases.map(c=>c.id));
      const newOnes = imported.filter(c=>!existingIds.has(c.id));
      cases = [...cases, ...newOnes];
      saveCases();
      renderList();
      showToast(`${newOnes.length}개 케이스를 가져왔어요.`);
    } catch { showToast('파일 형식이 올바르지 않아요.'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show';
  setTimeout(()=>t.className='toast', 2500);
}

document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});

loadCases();
renderList();

// ── URL parameter auto-search (called from broker_ledger) ──
(function(){
  const params = new URLSearchParams(window.location.search);
  const hts = params.get('hts');
  if (hts) {
    const input = document.getElementById('searchInput');
    if (input) {
      input.value = hts;
      renderList();
      // Show a toast-style banner
      const banner = document.createElement('div');
      banner.style.cssText = 'position:fixed;top:64px;left:50%;transform:translateX(-50%);background:#0F2744;color:#fff;padding:9px 20px;border-radius:8px;font-size:13px;z-index:500;box-shadow:0 4px 16px rgba(0,0,0,.2)';
      banner.textContent = '🔗 broker_ledger에서 연결됨 — HTS: ' + hts;
      document.body.appendChild(banner);
      setTimeout(() => banner.remove(), 3500);
    }
  }
})();
</script>
