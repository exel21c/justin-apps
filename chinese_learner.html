<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>汉语 — Chinese Learner</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#ebe9e2;color:#1a1a18;min-height:100vh}
:root{
  --blue:#185FA5;--teal:#0F6E56;--amber:#854F0B;--coral:#D85A30;
  --bg:#ffffff;--bg2:#f5f4f0;--bg3:#ebe9e2;
  --text:#1a1a18;--text2:#5f5e5a;--text3:#888780;
  --border:rgba(0,0,0,0.09);--radius:12px;
}
#app{max-width:640px;margin:0 auto;background:var(--bg);min-height:100vh;box-shadow:0 0 40px rgba(0,0,0,0.1)}

/* NAV */
.top-nav{display:flex;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:100}
.nav-logo{padding:13px 16px;font-weight:600;font-size:16px;color:var(--blue);border-right:1px solid var(--border);letter-spacing:-0.02em;white-space:nowrap}
.nav-tab{flex:1;padding:12px 6px;border:none;background:transparent;cursor:pointer;font-size:12px;color:var(--text2);border-bottom:2px solid transparent;font-family:inherit;transition:all .15s;position:relative}
.nav-tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:500}
.nav-badge{position:absolute;top:6px;right:calc(50% - 18px);background:var(--coral);color:#fff;border-radius:50%;width:15px;height:15px;font-size:9px;display:flex;align-items:center;justify-content:center}

/* VIEWS */
.view{display:none;padding:1.25rem 1rem}
.view.active{display:block}

/* CARDS */
.card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);padding:1rem 1.25rem}

/* BUTTONS */
.btn{padding:9px 16px;border-radius:8px;border:0.5px solid var(--border);background:var(--bg);color:var(--text);font-size:13px;cursor:pointer;font-family:inherit;transition:all .15s}
.btn:hover{background:var(--bg2)}
.btn-block{width:100%;padding:14px;font-size:15px;border-radius:10px}

/* UTILS */
.row{display:flex;align-items:center;gap:10px}
.row-between{display:flex;align-items:center;justify-content:space-between}
.col{display:flex;flex-direction:column;gap:10px}
.section-label{font-size:11px;letter-spacing:.07em;color:var(--text3);margin-bottom:10px;text-transform:uppercase}
.pill{font-size:10px;padding:2px 8px;border-radius:10px}

/* XP CARD */
.xp-card{background:var(--blue);border-radius:var(--radius);padding:1rem 1.25rem;margin-bottom:12px}
.xp-bar-track{height:6px;background:#0C447C;border-radius:3px;overflow:hidden;margin:10px 0 4px}
.xp-bar-fill{height:100%;background:#85B7EB;border-radius:3px;transition:width .6s ease}

/* STATS */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.stat-card{background:var(--bg2);border-radius:10px;padding:.6rem .4rem;text-align:center}
.stat-val{font-size:18px;font-weight:500}
.stat-lbl{font-size:9px;color:var(--text3);margin-top:2px}

/* LESSON CARDS */
.lesson-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);padding:.9rem 1rem;cursor:pointer;transition:background .15s;margin-bottom:10px}
.lesson-card:hover{background:var(--bg2)}
.pbar-track{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-top:10px}
.pbar-fill{height:100%;border-radius:2px;transition:width .5s}

/* VOCAB GRID */
.vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;margin-bottom:14px}
.vocab-card{background:var(--bg);border:0.5px solid var(--border);border-radius:10px;padding:.7rem}
.mastery-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* QUIZ */
.quiz-wrap{padding:1rem}
.quiz-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.qpbar-track{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:26px}
.qpbar-fill{height:100%;background:var(--blue);border-radius:2px;transition:width .3s}
.char-card{border:0.5px solid var(--border);border-radius:var(--radius);padding:2rem 1rem;text-align:center;margin-bottom:22px;transition:background .3s}
.char-big{font-size:68px;line-height:1}
.opts-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt-btn{padding:14px 10px;border-radius:10px;border:0.5px solid var(--border);background:var(--bg);cursor:pointer;font-size:14px;font-family:inherit;transition:all .2s;color:var(--text);text-align:center}
.opt-btn:hover:not(:disabled){background:var(--bg2)}
.opt-btn.correct{background:#EAF3DE!important;border:1.5px solid #639922!important}
.opt-btn.wrong{background:#FCEBEB!important;border:1.5px solid #E24B4A!important}
.opt-btn:disabled{cursor:default}

/* DIALOGUE */
.dlg-line{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:.5px solid var(--border)}
.dlg-line:last-child{border-bottom:none}
.dlg-badge{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;flex-shrink:0;margin-top:2px}

/* PROGRESS / CHARTS */
.bar-row{margin-bottom:10px}
.bar-track{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px}
.chart-wrap{display:flex;align-items:flex-end;gap:6px;height:120px;margin-bottom:4px}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.chart-bar{width:100%;border-radius:4px 4px 0 0;min-height:2px}
.chart-lbl{font-size:9px;color:var(--text3);text-align:center}
.chart-val{font-size:10px;color:var(--text2);font-weight:500}
.done-wrap{padding:2rem 1rem;text-align:center}
.result-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:.5px solid var(--border)}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2)}
.empty-card{border:.5px dashed var(--border);border-radius:var(--radius);padding:1.25rem;text-align:center;color:var(--text3);font-size:13px}
.dlg-toggle{width:100%;padding:10px;border-radius:8px;border:.5px solid var(--border);background:transparent;cursor:pointer;font-size:13px;font-family:inherit;color:var(--text);margin-bottom:10px}
.info-box{margin-top:20px;padding:.8rem 1rem;border-radius:10px;background:var(--bg2);font-size:12px;color:var(--text2);line-height:1.7}
.sound-bar{padding:6px 16px;font-size:11px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border)}
.sound-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.vocab-card{cursor:pointer;transition:background .15s}
.vocab-card:hover{background:var(--bg2)}
.vocab-card.speaking{background:#E6F1FB!important;border-color:#185FA5!important}
.dlg-line{cursor:pointer;transition:background .15s}
.dlg-line:hover{background:var(--bg2)}
.dlg-line.speaking{background:#E6F1FB!important}
</style>
</head>
<body>
<div id="app">
  <nav class="top-nav">
    <div class="nav-logo">汉语</div>

    <button class="nav-tab" data-view="learn" onclick="goView('learn')">학습</button>
    <button class="nav-tab" data-view="progress" onclick="goView('progress')">현황</button>
    <button class="nav-tab" data-view="search" onclick="goView('search')">검색</button>
  </nav>
  <div id="sound-bar" class="sound-bar">

  </div>

  <div id="view-learn"    class="view"></div>
  <div id="view-lesson"   class="view"></div>
  <div id="view-quiz" class="view" style="padding:0"></div>

  <!-- SEARCH VIEW -->

        style="width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;outline:none;background:var(--card);box-sizing:border-box"
        oninput="renderSearch()" />
    </div>
    <div id="search-results">
      <div style="text-align:center;padding:2rem;color:var(--text3);font-size:13px">단어, 병음, 뜻을 입력하세요</div>
    </div>
  </div>

const LVL_LABELS = ["새로운","입문","초급","중급","고급","마스터"];

const STORE_KEY  = "clp-html-v2";

const ALL_VOCAB = [...new Map(
  CURRICULUM.flatMap(l=>l.vocab).map(v=>[v.char,v])
).values()];

};

// ━━━━━━━━━━━━━━━━━━━━━━━━
// HELPERS
// ━━━━━━━━━━━━━━━━━━━━━━━━
const nextRev  = (lv)=>Date.now()+SRS_DAYS[Math.min(lv,5)]*86400000;
const isDue    = (wm)=>!wm||wm.level===0||Date.now()>=wm.nextReview;
const today    = ()=>new Date().toISOString().slice(0,10);

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function buildOpts(correct){
  const wrong=shuffle(ALL_VOCAB.filter(v=>v.meaning!==correct.meaning)).slice(0,3);
  return shuffle([correct,...wrong]);
}
function buildCards(vocab){
  return shuffle(vocab).map(v=>({...v,opts:buildOpts(v)}));
}
function getDue(){
  return ALL_VOCAB.filter(v=>{
    const wm=P.wordMastery[v.char];
    return wm&&wm.level>0&&isDue(wm);
  }).length;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━
// NAVIGATION
// ━━━━━━━━━━━━━━━━━━━━━━━━
function renderSearch(){
  var q = (document.getElementById('search-input').value||'').trim().toLowerCase();
  var el = document.getElementById('search-results');
  if(!el) return;
  if(!q){ el.innerHTML='<div style="text-align:center;padding:2rem;color:var(--text3);font-size:13px">단어, 병음, 뜻을 입력하세요</div>'; return; }

  var results = [];
  CURRICULUM.forEach(function(lesson){
    // Search vocab
    (lesson.vocab||[]).forEach(function(v){
      var ch = (v.char||v.ch||'').toLowerCase();
      var py = (v.pinyin||v.py||'').toLowerCase();
      var mn = (v.meaning||v.kr||'').toLowerCase();
      if(ch.includes(q)||py.includes(q)||mn.includes(q)){
        results.push({type:'vocab',lesson:lesson,item:v});
      }
    });
    // Search dialogue
    (lesson.dialogue||[]).forEach(function(line){
      var zh = (line.zh||'').toLowerCase();
      var py = (line.py||'').toLowerCase();
      var kr = (line.kr||'').toLowerCase();
      if(zh.includes(q)||py.includes(q)||kr.includes(q)){
        results.push({type:'dialogue',lesson:lesson,item:line});
      }
    });
    // Search grammar
    (lesson.grammar||[]).forEach(function(g){
      var t = (g.title||'').toLowerCase();
      var r = (g.rule||'').toLowerCase();
      var ex = (g.example||'').toLowerCase();
      var mn = (g.meaning||'').toLowerCase();
      if(t.includes(q)||r.includes(q)||ex.includes(q)||mn.includes(q)){
        results.push({type:'grammar',lesson:lesson,item:g});
      }
    });
  });

  if(!results.length){
    el.innerHTML='<div style="text-align:center;padding:2rem;color:var(--text3);font-size:13px">검색 결과가 없습니다: "'+q+'"</div>';
    return;
  }

  var typeLabel = {vocab:'단어',dialogue:'대화문',grammar:'문법'};
  var typeColor = {vocab:'#185FA5',dialogue:'#059669',grammar:'#854F0B'};
  var typeBg    = {vocab:'#E6F1FB',dialogue:'#D1FAE5',grammar:'#FAEEDA'};

  var html2 = '<div style="font-size:11px;color:var(--text3);margin-bottom:.8rem">'+results.length+'개 결과</div>';

  results.forEach(function(r){
    var it = r.item;
    var lc = r.lesson.color||'#185FA5';
    var tl = typeLabel[r.type];
    var tc = typeColor[r.type];
    var tb = typeBg[r.type];

    html2 += '<div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.8rem 1rem;margin-bottom:8px;cursor:pointer" data-lid="'+r.lesson.id+'" onclick="goToLesson(this)">';
    // Lesson badge
    html2 += '<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">';
    html2 += '<span style="font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;background:'+tb+';color:'+tc+'">'+tl+'</span>';
    html2 += '<span style="font-size:10px;color:var(--text3)">WEEK '+r.lesson.week+' · '+r.lesson.title+'</span>';
    html2 += '</div>';

    if(r.type==='vocab'){
      html2 += '<div style="display:flex;align-items:baseline;gap:10px">';
      html2 += '<span style="font-size:22px;font-weight:600;color:var(--text1)">'+(it.char||it.ch||'')+'</span>';
      html2 += '<span style="font-size:12px;color:'+lc+'">'+(it.pinyin||it.py||'')+'</span>';
      html2 += '<span style="font-size:12px;color:var(--text2);margin-left:auto">'+(it.meaning||it.kr||'')+'</span>';
      html2 += '</div>';
    } else if(r.type==='dialogue'){
      html2 += '<div style="display:flex;gap:8px;align-items:flex-start">';
      html2 += '<span style="min-width:20px;height:20px;border-radius:50%;background:'+(it.sp==='A'?'#E6F1FB':'#FAEEDA')+';color:'+(it.sp==='A'?'#185FA5':'#854F0B')+';font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center">'+it.sp+'</span>';
      html2 += '<div><div style="font-size:14px">'+(it.zh||'')+'</div>';
      html2 += '<div style="font-size:11px;color:#185FA5">'+(it.py||'')+'</div>';
      html2 += '<div style="font-size:11px;color:var(--text2)">'+(it.kr||'')+'</div></div>';
      html2 += '</div>';
    } else if(r.type==='grammar'){
      html2 += '<div style="font-size:13px;font-weight:600;color:var(--text1);margin-bottom:3px">'+(it.title||'')+'</div>';
      html2 += '<div style="font-size:11px;color:var(--text3);background:var(--bg);padding:4px 8px;border-radius:5px">'+(it.rule||'')+'</div>';
    }
    html2 += '</div>';
  });

  el.innerHTML = html2;
}

function goToLesson(el){
  var lessonId=el.getAttribute('data-lid');
  var lesson = CURRICULUM.find(function(l){return l.id===lessonId;});
  if(!lesson) return;
  openLesson(lesson);
  goView('lesson');
}

function goView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>{
    t.classList.toggle('active',t.dataset.view===name);
  });
  currentView=name;
  document.getElementById('view-'+name).classList.add('active');
  render();
}

function render(){
  if(currentView==='home')     renderHome();
  if(currentView==='learn')    renderLearn();
  if(currentView==='lesson')   renderLesson();
  if(currentView==='quiz')     renderQuiz();
  if(currentView==='progress') renderProgress();
  refreshBadge();
}

function refreshBadge(){
  const tab=document.querySelector('[data-view="home"]');
  const old=tab.querySelector('.nav-badge');
  if(old)old.remove();
  const n=getDue();
  if(n>0){
    const b=document.createElement('span');
    b.className='nav-badge';b.textContent=n;tab.appendChild(b);
  }
}

function openLesson(id){
  selectedLesson=CURRICULUM.find(l=>l.id===id);
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  currentView='lesson';
  document.getElementById('view-lesson').classList.add('active');
  renderLesson();
}

        </div>

      </div>`;
    });
    html+=`</div>`;
  });

  html+=`<div class="empty-card">새 수업이 매주 추가될 예정입니다 📌</div>`;
  el.innerHTML=html;
}

// QUIZ
// ━━━━━━━━━━━━━━━━━━━━━━━━
function startQuiz(lessonId,mode){
  const lesson=CURRICULUM.find(l=>l.id===lessonId);
  let pool=lesson.vocab;
  if(mode==='hard'){
    pool=lesson.vocab.filter(v=>{const lv=P.wordMastery[v.char]?.level||0;return lv===0||lv===1;});
    if(!pool.length)pool=lesson.vocab;
  }
  quiz={lessonId,title:lesson.title,cards:buildCards(pool),
    idx:0,results:[],phase:'question',xpEarned:0,chosen:null,wasCorrect:null};
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  currentView='quiz';
  document.getElementById('view-quiz').classList.add('active');
  renderQuiz();
}

function startReview(){
  const due=ALL_VOCAB.filter(v=>{
    const wm=P.wordMastery[v.char];
    return wm&&wm.level>0&&isDue(wm);
  });
  if(!due.length)return;
  quiz={lessonId:null,title:'복습',cards:buildCards(due),
    idx:0,results:[],phase:'question',xpEarned:0,chosen:null,wasCorrect:null};
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  currentView='quiz';
  document.getElementById('view-quiz').classList.add('active');
  renderQuiz();
}

function renderQuiz(){
  const el=document.getElementById('view-quiz');
  if(!quiz)return;

  if(quiz.phase==='done'){
    const correct=quiz.results.filter(r=>r.correct).length;
    const total=quiz.results.length;
    const score=Math.round(correct/total*100);
    const emoji=score>=80?'🎉':score>=60?'👍':'💪';
    const rows=quiz.results.map(r=>`
      <div class="result-row">
        <span style="font-size:18px">${r.char}</span>
        <span>${r.correct?'✅':'❌'}</span>
      </div>`).join('');
    const backFn=quiz.lessonId?`goView('learn')`:`goView('home')`;
    el.innerHTML=`<div class="done-wrap">
      <div style="font-size:52px;margin-bottom:12px">${emoji}</div>
      <div style="font-size:24px;font-weight:500;margin-bottom:6px">완료!</div>
      <div style="font-size:14px;color:var(--text2);margin-bottom:6px">${total}개 중 ${correct}개 정답 (${score}%)</div>
      <div style="font-size:20px;font-weight:500;color:var(--amber);margin-bottom:28px">+${quiz.xpEarned} XP 획득!</div>
      <div style="text-align:left;margin-bottom:24px">${rows}</div>
      <button class="btn btn-block" style="background:var(--blue);border:none;color:#fff" onclick="${backFn}">완료</button>
    </div>`;
    return;
  }

  const c=quiz.cards[quiz.idx];
  const pct=Math.round(quiz.idx/quiz.cards.length*100);
  let charBg='var(--bg)';
  if(quiz.phase==='reveal')charBg=quiz.wasCorrect?'#EAF3DE':'#FCEBEB';

  const backFn=quiz.lessonId?`goView('lesson')`:`goView('home')`;
  const opts=c.opts.map(opt=>{
    let cls='opt-btn';
    if(quiz.phase==='reveal'){
      if(opt.meaning===c.meaning)cls+=' correct';
      else if(opt.meaning===quiz.chosen)cls+=' wrong';
    }
    const esc=opt.meaning.replace(/'/g,"\\'");
    return`<button class="${cls}"${quiz.phase==='reveal'?' disabled':''} onclick="answer('${esc}')">${opt.meaning}</button>`;
  }).join('');

  el.innerHTML=`<div class="quiz-wrap">
    <div class="quiz-hdr">
      <button class="btn" style="padding:6px 12px;font-size:13px" onclick="${backFn}">✕</button>
      <span style="font-size:13px;color:var(--text2)">${quiz.title} · ${quiz.idx+1}/${quiz.cards.length}</span>
      <span style="font-size:13px;font-weight:500;color:var(--amber)">+${quiz.xpEarned} XP</span>
    </div>
    <div class="qpbar-track"><div class="qpbar-fill" style="width:${pct}%"></div></div>
    <div style="font-size:12px;color:var(--text3);text-align:center;margin-bottom:8px">올바른 뜻을 고르세요</div>
    <div class="char-card" style="background:${charBg}">
      <div class="char-big">${c.char}</div>
      ${quiz.phase==='reveal'?`
        <div style="margin-top:12px">
          <div style="font-size:16px;color:#185FA5;font-weight:500">${c.pinyin}</div>
          <div style="font-size:13px;color:var(--text2);margin-top:4px">${c.meaning}</div>
          <div style="font-size:20px;margin-top:8px">${quiz.wasCorrect?'✅ 정답!':'❌ 틀렸어요'}</div>
        </div>`:''}
    </div>
    <div class="opts-grid">${opts}</div>
  </div>`;
}

function answer(choice){
  if(!quiz||quiz.phase!=='question')return;
  const c=quiz.cards[quiz.idx];
  const correct=choice===c.meaning;
  const newResults=[...quiz.results,{char:c.char,correct}];
  const wm=P.wordMastery[c.char]||{level:0,correct:0,wrong:0};
  const newLv=correct?Math.min(wm.level+1,5):Math.max(wm.level-1,0);
  const xpGain=correct?10:0;
  const isLast=quiz.idx===quiz.cards.length-1;
  const t=today();

  P.xp+=xpGain;
  P.totalReviews++;
  if(correct)P.totalCorrect++;
  P.lastStudied=Date.now();
  P.wordMastery[c.char]={level:newLv,nextReview:nextRev(newLv),
    correct:wm.correct+(correct?1:0),wrong:wm.wrong+(correct?0:1)};
  P.xpHistory[t]=(P.xpHistory[t]||0)+xpGain;

  if(isLast&&quiz.lessonId){
    const score=Math.round(newResults.filter(r=>r.correct).length/newResults.length*100);
    const lp=P.lessonProgress[quiz.lessonId]||{};
    P.lessonProgress[quiz.lessonId]={
      completed:score>=60,
      bestScore:Math.max(lp.bestScore||0,score),
      attempts:(lp.attempts||0)+1,
    };
  }
  saveP();

  quiz.results=newResults;
  quiz.xpEarned+=xpGain;
  quiz.phase='reveal';
  quiz.chosen=choice;
  quiz.wasCorrect=correct;
  renderQuiz();
  speak(c.char); // pronounce the word on reveal

  setTimeout(()=>{
    if(isLast){quiz.phase='done';}
    else{quiz.idx++;quiz.phase='question';quiz.chosen=null;quiz.wasCorrect=null;}
    renderQuiz();
  },1200);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━
// PROGRESS
// ━━━━━━━━━━━━━━━━━━━━━━━━
function renderProgress(){
  const el=document.getElementById('view-progress');
  const accuracy=P.totalReviews?Math.round(P.totalCorrect/P.totalReviews*100):0;
  const learnedCount=Object.keys(P.wordMastery).length;

  // Mastery distribution
  const mastDist=LVL_LABELS.map((label,i)=>{
    const count=i===0
      ?ALL_VOCAB.length-Object.values(P.wordMastery).filter(w=>w.level>0).length
      :Object.values(P.wordMastery).filter(w=>w.level===i).length;
    return{label,count,color:LVL_COLORS[i]};
  });
  const mastBars=mastDist.map(d=>`
    <div class="bar-row">
      <div class="row-between" style="margin-bottom:4px">
        <div class="row" style="gap:6px">
          <div class="mastery-dot" style="background:${d.color}"></div>
          <span style="font-size:12px;color:var(--text2)">${d.label}</span>
        </div>
        <span style="font-size:12px;font-weight:500">${d.count}개</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${ALL_VOCAB.length?d.count/ALL_VOCAB.length*100:0}%;background:${d.color}"></div>
      </div>
    </div>`).join('');

  // Lesson stacked bars
  const lesData=CURRICULUM.map(l=>{
    const mastered=l.vocab.filter(v=>(P.wordMastery[v.char]?.level||0)>=4).length;
    const learning=l.vocab.filter(v=>{const lv=P.wordMastery[v.char]?.level||0;return lv>0&&lv<4;}).length;
    return{name:l.title,mastered,learning,none:l.vocab.length-mastered-learning,total:l.vocab.length};
  });
  const maxT=Math.max(...lesData.map(d=>d.total));
  const lesCols=lesData.map(d=>{
    const mH=d.total?d.mastered/maxT*100:0;
    const lH=d.total?d.learning/maxT*100:0;
    const nH=d.total?d.none/maxT*100:0;
    return`<div class="chart-col">
      <div class="chart-val">${Math.round(d.mastered/d.total*100)}%</div>
      <div style="width:100%;display:flex;flex-direction:column;justify-content:flex-end;flex:1;gap:1px">
        <div class="chart-bar" style="height:${mH}%;background:#639922"></div>
        <div class="chart-bar" style="height:${lH}%;background:#378ADD;border-radius:0"></div>
        <div class="chart-bar" style="height:${nH}%;background:#D3D1C7;border-radius:0 0 4px 4px"></div>
      </div>
      <div class="chart-lbl">${d.name}</div>
    </div>`;
  }).join('');

  // XP history 7 days
  const xpDays=Array.from({length:7},(_,i)=>{
    const d=new Date(Date.now()-(6-i)*86400000);
    const key=d.toISOString().slice(0,10);
    return{name:`${d.getMonth()+1}/${d.getDate()}`,xp:P.xpHistory[key]||0};
  });
  const maxXP=Math.max(...xpDays.map(d=>d.xp),10);
  const xpCols=xpDays.map(d=>`
    <div class="chart-col">
      ${d.xp>0?`<div class="chart-val">${d.xp}</div>`:''}
      <div style="width:100%;display:flex;flex-direction:column;justify-content:flex-end;flex:1">
        <div class="chart-bar" style="height:${d.xp/maxXP*100}%;background:#185FA5"></div>
      </div>
      <div class="chart-lbl">${d.name}</div>
    </div>`).join('');

  el.innerHTML=`
<div style="font-size:18px;font-weight:500;margin-bottom:1rem">학습 현황</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
  ${[
    {label:'총 XP',value:P.xp},
    {label:'정확도',value:accuracy+'%'},
    {label:'총 복습 횟수',value:P.totalReviews},
    {label:'학습한 단어',value:learnedCount},
  ].map(s=>`<div style="background:var(--bg2);border-radius:10px;padding:.8rem 1rem">
    <div style="font-size:10px;color:var(--text3);margin-bottom:4px">${s.label}</div>
    <div style="font-size:22px;font-weight:500">${s.value}</div>
  </div>`).join('')}
</div>

<div class="card" style="margin-bottom:14px">
  <div style="font-size:13px;font-weight:500;margin-bottom:14px">단어 숙련도 분포</div>
  ${mastBars}
</div>

<div class="card" style="margin-bottom:14px">
  <div style="font-size:13px;font-weight:500;margin-bottom:8px">수업별 마스터율</div>
  <div style="font-size:11px;color:var(--text3);margin-bottom:12px">
    <span style="color:#639922">■</span> 마스터 &nbsp;
    <span style="color:#378ADD">■</span> 학습중 &nbsp;
    <span style="color:#D3D1C7">■</span> 미학습
  </div>
  <div class="chart-wrap">${lesCols}</div>
</div>

<div class="card">
  <div style="font-size:13px;font-weight:500;margin-bottom:14px">최근 7일 XP 획득량</div>
  <div class="chart-wrap">${xpCols}</div>
</div>`;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━
// SPEECH ENGINE
// ━━━━━━━━━━━━━━━━━━━━━━━━
let selectedVoice = null;

function initSpeech() {
  if (!window.speechSynthesis) {
    setSoundStatus('red', '이 브라우저는 음성을 지원하지 않습니다');
    return;
  }
  function tryLoad() {
    const all = window.speechSynthesis.getVoices();
    if (!all.length) return;
    const zh = all.filter(v => v.lang.startsWith('zh'));
    if (zh.length) {
      selectedVoice = zh[0];
      setSoundStatus('green', '중국어 음성 준비됨: ' + zh[0].name + ' — 단어를 클릭하면 소리가 납니다');
    } else {
      setSoundStatus('orange', '중국어 음성 없음. Brave → 방패 해제 후 재시도, 또는 OS에서 중국어 음성 설치 필요');
    }
  }
  tryLoad();
  window.speechSynthesis.addEventListener('voiceschanged', tryLoad);
}

function setSoundStatus(color, msg) {
  const colors = { green:'#1D9E75', orange:'#BA7517', red:'#E24B4A' };
  document.getElementById('sound-dot').style.background = colors[color] || '#B4B2A9';
  document.getElementById('sound-msg').textContent = msg;
}

function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  if (selectedVoice) u.voice = selectedVoice;
  u.lang = 'zh-CN';
  u.rate = 0.82;
  window.speechSynthesis.speak(u);
}

function testSpeak() {

function setSoundBar(color, msg) {
  const colors = { green:'#1D9E75', orange:'#BA7517', red:'#E24B4A' };
  document.getElementById('sound-dot').style.background = colors[color] || '#B4B2A9';
  document.getElementById('sound-msg').textContent = msg;
}

function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  if (selectedVoice) u.voice = selectedVoice;
  u.lang = 'zh-CN';
  u.rate = 0.82;
  window.speechSynthesis.speak(u);
}

function testSpeak() {
  speak('你好');
}
