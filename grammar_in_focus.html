<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grammar in Focus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#18181B;--ink2:#52525B;--ink3:#A1A1AA;
  --paper:#FAFAF9;--card:#FFFFFF;--card2:#F4F4F5;
  --border:rgba(0,0,0,0.08);--radius:14px;
  --shadow:0 1px 4px rgba(0,0,0,0.06),0 4px 16px rgba(0,0,0,0.04);
}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'DM Serif Display',Georgia,serif;font-weight:400}
#app{max-width:640px;margin:0 auto;background:var(--paper);min-height:100vh}

/* ── NAV ── */
.nav{display:flex;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;box-shadow:0 1px 8px rgba(0,0,0,0.05)}
.nav-brand{padding:13px 16px;font-family:'DM Serif Display',serif;font-size:16px;color:var(--ink);border-right:1px solid var(--border);white-space:nowrap;letter-spacing:-0.01em}
.nav-tab{flex:1;padding:13px 4px;border:none;background:transparent;cursor:pointer;font-size:12px;font-weight:500;color:var(--ink3);border-bottom:2px solid transparent;font-family:'DM Sans',inherit;transition:all .15s}
.nav-tab.active{color:var(--ink);border-bottom-color:var(--ink)}
.nav-badge{position:absolute;top:7px;right:calc(50% - 20px);background:#EF4444;color:#fff;border-radius:8px;padding:1px 5px;font-size:9px;font-weight:700}

/* ── VIEWS ── */
.view{display:none}.view.active{display:block}
.pad{padding:1.2rem 1rem}

/* ── HOME ── */
.hero{padding:1.5rem 1rem 1rem;border-bottom:1px solid var(--border);background:var(--card)}
.hero-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px;font-weight:600}
.hero-title{font-size:26px;color:var(--ink);line-height:1.15;margin-bottom:4px}
.hero-sub{font-size:13px;color:var(--ink2);line-height:1.6}

/* ── PROGRESS RING ── */
.ring-wrap{position:relative;width:60px;height:60px;flex-shrink:0}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--card2);stroke-width:4}
.ring-fill{fill:none;stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.ring-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}

/* ── STAT STRIP ── */
.stat-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:.8rem 1rem;border-bottom:1px solid var(--border)}
.stat{background:var(--card);border-radius:10px;border:1px solid var(--border);padding:.55rem .4rem;text-align:center}
.stat-v{font-size:19px;font-weight:600;font-family:'DM Serif Display',serif}
.stat-l{font-size:9px;color:var(--ink3);margin-top:1px;font-weight:500}

/* ── TODAY'S MISSION ── */
.mission{border-radius:var(--radius);padding:1rem 1.1rem;margin:.8rem 1rem;color:#fff;position:relative;overflow:hidden}
.mission::after{content:"";position:absolute;right:-20px;bottom:-20px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.08)}
.mission-eyebrow{font-size:10px;opacity:.75;letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin-bottom:4px}
.mission-name{font-size:16px;font-weight:600;margin-bottom:4px;line-height:1.2}
.mission-sub{font-size:12px;opacity:.8;margin-bottom:12px;line-height:1.5}
.mission-btn{display:inline-block;padding:7px 16px;border-radius:8px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s;text-decoration:none;margin-right:6px}
.mission-btn:hover{background:rgba(255,255,255,.35)}

/* ── ACTION BTNS ── */
.action-row{display:flex;flex-direction:column;gap:8px;padding:0 1rem .8rem}
.action-btn{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-family:inherit;color:var(--ink);font-size:14px;text-align:left;transition:all .15s;box-shadow:var(--shadow)}
.action-btn:hover{background:var(--card2);border-color:rgba(0,0,0,.14)}
.action-btn .ab-icon{font-size:20px;flex-shrink:0;width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.action-btn .ab-txt strong{display:block;font-size:14px;font-weight:600}
.action-btn .ab-txt small{font-size:11px;color:var(--ink2)}
.action-btn .ab-arrow{margin-left:auto;color:var(--ink3);font-size:15px}

/* ── UNITS LIST ── */
.sec-header{padding:.5rem 1rem;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);background:var(--paper);border-bottom:1px solid var(--border)}
.unit-row{display:flex;align-items:center;gap:12px;padding:13px 1rem;background:var(--card);border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;width:100%;border-left:none;border-right:none;border-top:none;font-family:inherit;text-align:left}
.unit-row:hover{background:#FAFAF8}
.unit-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.unit-info{flex:1;min-width:0}
.unit-title{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit-sub{font-size:11px;color:var(--ink2)}
.unit-right{text-align:right;flex-shrink:0}
.unit-pct{font-size:15px;font-weight:700}
.unit-done-badge{font-size:9px;color:#16A34A;font-weight:700;margin-top:1px}

/* ── UNIT DETAIL ── */
.unit-hdr{padding:1rem;background:var(--card);border-bottom:1px solid var(--border)}
.back-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:transparent;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;color:var(--ink2);margin-bottom:12px;transition:background .1s}
.back-btn:hover{background:var(--card2)}
.unit-eyebrow{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:4px;font-weight:600}
.unit-h1{font-size:22px;color:var(--ink);margin-bottom:2px}
.unit-h2{font-size:13px;color:var(--ink2);margin-bottom:10px}
.unit-pbar{height:5px;background:var(--card2);border-radius:3px;overflow:hidden}
.unit-pbar-fill{height:100%;border-radius:3px;transition:width .5s}

/* ── RULE CARDS ── */
.rules-wrap{padding:.8rem 1rem}
.rule-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin-bottom:10px;border-left:3px solid}
.rule-title{font-size:13px;font-weight:700;margin-bottom:3px;color:var(--ink)}
.rule-ko{font-size:11px;color:var(--ink2);margin-bottom:8px}
.formula-box{background:var(--card2);border-radius:8px;padding:8px 12px;font-family:monospace;font-size:13px;color:var(--ink);margin-bottom:10px;letter-spacing:.01em}
.example-row{display:flex;flex-direction:column;gap:1px;padding:5px 0;border-bottom:1px solid var(--border)}
.example-row:last-child{border-bottom:none}
.ex-en{font-size:13px;color:var(--ink)}
.ex-ko{font-size:11px;color:var(--ink3)}

/* ── QUIZ ── */
.quiz-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 1rem;border-bottom:1px solid var(--border);background:var(--card)}
.quiz-prog-bar{height:3px;background:var(--card2)}
.quiz-prog-fill{height:100%;transition:width .3s}
.quiz-prompt-lbl{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);text-align:center;margin-bottom:8px;padding:.8rem 1rem 0}
.quiz-q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin:.5rem 1rem 1rem;padding:1.5rem 1.2rem;text-align:center;transition:background .25s,border-color .25s;box-shadow:var(--shadow)}
.quiz-q-card.correct{background:#F0FDF4;border-color:#86EFAC}
.quiz-q-card.wrong{background:#FEF2F2;border-color:#FCA5A5}
.quiz-q-text{font-size:17px;font-weight:600;color:var(--ink);line-height:1.5;margin-bottom:10px}
.fill-blank{display:inline-block;border-bottom:2px solid;padding:0 6px;min-width:80px;font-size:17px;font-weight:600;font-family:'DM Serif Display',serif}
.quiz-reveal{margin-top:12px;font-size:13px;color:var(--ink2);line-height:1.6}
.quiz-reveal .answer{font-weight:700;font-size:15px;margin-bottom:4px}
.quiz-reveal .ko{color:var(--ink3)}
.reveal-icon{font-size:24px;margin-bottom:4px}

.opts-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 1rem 1rem}
.opt{padding:13px 10px;border-radius:10px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:14px;font-weight:500;font-family:inherit;color:var(--ink);text-align:center;transition:all .15s;line-height:1.3}
.opt:hover:not([disabled]){background:var(--card2);border-color:rgba(0,0,0,.15)}
.opt.correct-opt{background:#F0FDF4!important;border-color:#86EFAC!important;color:#16A34A!important;font-weight:700!important}
.opt.wrong-opt{background:#FEF2F2!important;border-color:#FCA5A5!important;color:#DC2626!important}
.opt[disabled]{cursor:default}

/* ── FILL EXERCISE ── */
.fill-input{width:100%;border:1.5px solid;border-radius:8px;padding:10px 14px;font-size:15px;font-family:inherit;background:var(--card);color:var(--ink);outline:none;transition:border-color .15s;margin-bottom:8px}
.fill-input:focus{border-color:var(--ink)}
.fill-input.correct-input{border-color:#16A34A;background:#F0FDF4}
.fill-input.wrong-input{border-color:#DC2626;background:#FEF2F2}
.check-btn{width:100%;padding:12px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.check-btn.primary{background:var(--ink);color:#fff}
.check-btn.primary:hover{opacity:.9}
.check-btn.next{background:var(--card2);color:var(--ink);border:1px solid var(--border)}
.check-btn.next:hover{background:var(--card);border-color:rgba(0,0,0,.15)}

/* ── DONE SCREEN ── */
.done-wrap{padding:2rem 1rem;text-align:center}
.done-score-ring{width:100px;height:100px;margin:0 auto 16px}
.done-score-ring svg{transform:rotate(-90deg)}
.done-score-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:22px;font-weight:700;font-family:'DM Serif Display',serif}
.done-score-txt small{font-size:11px;font-family:'DM Sans',sans-serif;font-weight:500;color:var(--ink2)}
.done-title{font-size:24px;margin-bottom:6px}
.done-xp{font-size:15px;font-weight:600;color:#D97706;margin-bottom:24px}
.result-list{text-align:left;margin-bottom:24px}
.result-item{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}

/* ── PROGRESS VIEW ── */
.sec-prog-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow)}
.sec-prog-hdr{padding:.75rem 1rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.sec-prog-body{padding:.75rem 1rem}
.mbar{margin-bottom:8px}
.mbar-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px;font-size:11px}
.bar-track{height:5px;background:var(--card2);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .5s}
.xp-card-full{background:linear-gradient(135deg,#18181B,#3F3F46);color:#fff;border-radius:var(--radius);padding:1.2rem;margin:.8rem 1rem}
.xp-lv{font-size:10px;letter-spacing:.1em;opacity:.6;font-weight:600}
.xp-num{font-size:28px;font-family:'DM Serif Display',serif;margin:2px 0}
.xp-bar-track{height:6px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden;margin:8px 0 4px}
.xp-bar-fill{height:100%;background:rgba(255,255,255,.8);border-radius:3px;transition:width .6s}
.xp-sub{font-size:10px;opacity:.55}

/* ── CHART BARS ── */
.chart-wrap{display:flex;align-items:flex-end;gap:4px;height:90px;margin-bottom:4px}
.c-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;height:100%;justify-content:flex-end}
.c-bar{width:100%;border-radius:3px 3px 0 0;min-height:2px}
.c-lbl{font-size:8px;color:var(--ink3);text-align:center}
.c-val{font-size:9px;font-weight:600;color:var(--ink2)}

.empty{text-align:center;padding:2rem;color:var(--ink3);font-size:13px}
.example-row:hover{background:#EFF6FF !important}
.info-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600}
</style>
</head>
<body>
<div id="app">
<nav class="nav">
  <div class="nav-brand">Grammar in Focus</div>
  <button class="nav-tab active" data-v="home" onclick="go('home')">홈</button>
  <button class="nav-tab" data-v="units" onclick="go('units')">단원</button>
  <button class="nav-tab" data-v="review" onclick="go('review')">복습</button>
  <button class="nav-tab" data-v="progress" onclick="go('progress')">현황</button>
</nav>
<div id="v-home" class="view active"></div>
<div id="v-units" class="view"></div>
<div id="v-unit" class="view"></div>
<div id="v-quiz" class="view" style="padding:0"></div>
<div id="v-progress" class="view"></div>
</div>

<script>
const GRAMMAR = 
[
{
"id": 1,
"section": "Present Tenses",
"sectionKo": "현재 시제",
"title": "Present Simple",
"ko": "현재 단순 시제",
"color": "#2563EB",
"rules": [
{
"title": "Facts & habits",
"ko": "사실과 습관",
"formula": "Subject + verb(s/es)",
"ex": [
[
"The earth orbits the sun.",
"지구는 태양 주위를 돌아요."
],
[
"She drinks coffee every morning.",
"그녀는 매일 아침 커피를 마셔요."
],
[
"Water boils at 100°C.",
"물은 100도에서 끓어요."
]
]
},
{
"title": "He/She/It → add -s or -es",
"ko": "3인칭 단수 → 동사에 s/es 추가",
"formula": "he/she/it + verb+s  |  go→goes, watch→watches",
"ex": [
[
"He plays football on Saturdays.",
"그는 토요일에 축구를 해요."
],
[
"She watches TV every night.",
"그녀는 매일 밤 TV를 봐요."
],
[
"The bus leaves at 8 a.m.",
"버스는 오전 8시에 출발해요."
]
]
},
{
"title": "Negatives & Questions",
"ko": "부정문과 의문문",
"formula": "don't/doesn't + base verb | Do/Does + subject + verb?",
"ex": [
[
"I don't eat meat.",
"나는 고기를 먹지 않아요."
],
[
"She doesn't like spicy food.",
"그녀는 매운 음식을 좋아하지 않아요."
],
[
"Do you speak Korean?",
"한국어를 할 줄 알아요?"
]
]
}
],
"exercises": [
{
"type": "mc",
"q": "She _____ to the gym three times a week.",
"a": "goes",
"opts": [
"go",
"goes",
"is going",
"went"
],
"exp": "'She'는 3인칭 단수 → go에 es를 붙여 'goes'. 규칙적인 습관이므로 현재 단순 시제!"
},
{
"type": "mc",
"q": "Water _____ at 100 degrees Celsius.",
"a": "boils",
"opts": [
"boil",
"is boiling",
"boils",
"boiled"
],
"exp": "변하지 않는 과학적 사실 → 현재 단순 시제 'boils'. 3인칭 단수라서 s를 붙여요."
},
{
"type": "mc",
"q": "They _____ meat. They're vegetarian.",
"a": "don't eat",
"opts": [
"aren't eating",
"doesn't eat",
"don't eat",
"not eat"
],
"exp": "복수 주어 'They' → don't + base verb. doesn't는 he/she/it에만 사용해요."
},
{
"type": "mc",
"q": "_____ your brother work in London?",
"a": "Does",
"opts": [
"Do",
"Is",
"Does",
"Has"
],
"exp": "3인칭 단수 의문문 → Does + subject + base verb. 동사에는 s를 붙이지 않아요."
},
{
"type": "mc",
"q": "The last train _____ at midnight.",
"a": "leaves",
"opts": [
"leave",
"is leaving",
"has left",
"leaves"
],
"exp": "시간표나 일정에는 현재 단순 시제를 사용해요. 3인칭 단수라서 leaves."
},
{
"type": "mc",
"q": "I _____ understand the question.",
"a": "don't",
"opts": [
"doesn't",
"not",
"don't",
"am not"
],
"exp": "1인칭(I) 부정문 → don't + base verb. doesn't는 he/she/it에만 사용해요."
},
{
"type": "fill",
"q": "My sister _____ (speak) three languages.",
"a": "speaks",
"exp": "my sister = 3인칭 단수 → speak + s = speaks"
},
{
"type": "fill",
"q": "The museum _____ (close) on Mondays.",
"a": "closes",
"exp": "museum = 3인칭 단수, close + s = closes. 규칙적인 일정!"
}
]
},
{
"id": 2,
"section": "Present Tenses",
"sectionKo": "현재 시제",
"title": "Present Continuous",
"ko": "현재 진행 시제",
"color": "#7C3AED",
"rules": [
{
"title": "Actions happening NOW",
"ko": "지금 이 순간 일어나는 일",
"formula": "am/is/are + verb-ing",
"ex": [
[
"I'm studying English right now.",
"나는 지금 영어를 공부하고 있어요."
],
[
"It's raining outside.",
"밖에 비가 오고 있어요."
],
[
"Look! The cat is sleeping on the sofa.",
"봐요! 고양이가 소파에서 자고 있어요."
]
]
},
{
"title": "Temporary situations",
"ko": "일시적인 상황 (요즘, 이번 주 등)",
"formula": "Subject + is/are + verb-ing",
"ex": [
[
"She's staying with her parents this month.",
"그녀는 이번 달에 부모님과 함께 지내고 있어요."
],
[
"I'm reading a really interesting book.",
"나는 정말 흥미로운 책을 읽고 있어요."
],
[
"He's working from home this week.",
"그는 이번 주에 재택근무를 하고 있어요."
]
]
},
{
"title": "Changing / developing situations",
"ko": "변화하고 있는 상황",
"formula": "It/Things + is/are + getting/becoming/growing…",
"ex": [
[
"Your English is getting better!",
"당신의 영어 실력이 좋아지고 있어요!"
],
[
"The weather is changing quickly.",
"날씨가 빠르게 변하고 있어요."
],
[
"Prices are rising every year.",
"물가가 매년 오르고 있어요."
]
]
}
],
"exercises": [
{
"type": "mc",
"q": "Please be quiet. The baby _____.",
"a": "is sleeping",
"opts": [
"sleeps",
"is sleeping",
"sleep",
"was sleeping"
],
"exp": "지금 이 순간 일어나는 일 → 현재 진행형 is + sleeping. 'please be quiet'이 지금 상황임을 알려줘요."
},
{
"type": "mc",
"q": "I can't talk now. I _____ dinner.",
"a": "'m cooking",
"opts": [
"cook",
"cooked",
"'m cooking",
"have cooked"
],
"exp": "지금 바로 하고 있는 일 → am + cooking. I'm = I am의 축약형이에요."
},
{
"type": "mc",
"q": "Look at that man! He _____ to cross the road.",
"a": "is trying",
"opts": [
"tries",
"tried",
"is trying",
"try"
],
"exp": "'Look!'은 지금 일어나는 일을 가리켜요 → is trying (현재 진행형)."
},
{
"type": "mc",
"q": "The company _____ a lot of new staff this year.",

const today = ()=>new Date().toISOString().slice(0,10);
const isDue = (m)=>!m||m.srsLevel===0||Date.now()>=m.nextReview;
function getDue(){return GRAMMAR.filter(u=>{const m=P.mastery[u.id];return m&&m.srsLevel>0&&isDue(m);}).length;}
function updateStreak(){const t=today();if(P.lastDay===t)return;const y=new Date(Date.now()-86400000).toISOString().slice(0,10);P.streak=P.lastDay===y?(P.streak||0)+1:1;P.lastDay=t;}
function unitScore(id){return P.mastery[id]?.score||0;}
function unitDone(id){return P.mastery[id]?.done||false;}

  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));

  CV=name;
  document.getElementById('v-'+name).classList.add('active');
  render();
}
function openUnit(id){
  SEL=GRAMMAR.find(u=>u.id===id);
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  CV='unit'; document.getElementById('v-unit').classList.add('active');
  renderUnit();
}
function render(){
  if(CV==='home')renderHome();
  if(CV==='units')renderUnits();
  if(CV==='unit')renderUnit();
  if(CV==='quiz')renderQuiz();
  if(CV==='progress')renderProgress();
  if(CV==='review')renderReview();
  refreshBadge();
}

  document.querySelectorAll('.nav-badge').forEach(b=>b.remove());

}

  초·중급 학습자를 위한 핵심 영문법 30개 단원. 현재·과거 시제부터 조동사, 조건문, 수동태, 관사, 비교급까지. 모든 설명에 한국어 번역 포함. SRS로 장기기억 강화!
</div>`;
}

// ═══════════════════════════════
// UNITS LIST
// ═══════════════════════════════
function renderUnits(){
  const el=document.getElementById('v-units');
  const sections=[...new Set(GRAMMAR.map(u=>u.section))];
  let html='';
  sections.forEach(sec=>{
    html+=`<div class="sec-header">${GRAMMAR.find(u=>u.section===sec).sectionKo} · ${sec}</div>`;
    GRAMMAR.filter(u=>u.section===sec).forEach(u=>{
      const sc=unitScore(u.id);
      const done=unitDone(u.id);
      const m=P.mastery[u.id]||{};
      const lv=m.srsLevel||0;
      html+=`<button class="unit-row" onclick="openUnit(${u.id})">
        <div class="unit-icon" style="background:${u.color}22;color:${u.color};font-weight:700;font-size:13px">U${u.id}</div>
        <div class="unit-info">
          <div class="unit-title">${u.title}</div>
          <div class="unit-sub">${u.ko} · ${u.exercises.length}개 문제</div>
          <div style="display:flex;align-items:center;gap:6px;margin-top:4px">
            <div style="flex:1;height:3px;background:var(--card2);border-radius:2px;overflow:hidden">
              <div style="height:100%;width:${sc}%;background:${u.color};border-radius:2px"></div>
            </div>
          </div>
        </div>
        <div class="unit-right">
          <div class="unit-pct" style="color:${u.color}">${sc}%</div>
          <div class="unit-done-badge">${done?'완료 ✓':lv>0?LVL_LABELS[lv]:''}</div>
        </div>
      </button>`;
    });
  });
  el.innerHTML=html;
}

// ═══════════════════════════════
// UNIT DETAIL
// ═══════════════════════════════
function renderUnit(){
  if(!SEL)return;
  const el=document.getElementById('v-unit');
  const u=SEL;
  const sc=unitScore(u.id);

  const rulesHtml=u.rules.map(r=>`
    <div class="rule-card" style="border-left-color:${u.color}">
      <div class="rule-title">${r.title}</div>
      <div class="rule-ko">${r.ko}</div>
      <div class="formula-box">${r.formula}</div>
      ${r.ex.map(([en,ko])=>{
        const esc = en.replace(/`/g,"\\`").replace(/'/g,"\\'");
        return `<div class="example-row" onclick="speakEN('${esc}', this)" title="클릭해서 듣기" style="cursor:pointer;border-radius:6px;padding:5px 4px;transition:background .2s">
          <div class="ex-en" style="display:flex;align-items:center;gap:6px">
            <span style="font-size:10px;opacity:.4;flex-shrink:0">🔊</span>
            <span>${en}</span>
          </div>
          <div class="ex-ko" style="padding-left:18px">${ko}</div>
        </div>`;
      }).join('')}
    </div>`).join('');

  el.innerHTML=`
<div class="unit-hdr">
  <button class="back-btn" onclick="go('units')">← 단원 목록</button>
  <div class="unit-eyebrow">${u.sectionKo} · ${u.section}</div>
  <h1 class="unit-h1">Unit ${u.id}: ${u.title}</h1>
  <div class="unit-h2">${u.ko} · ${u.exercises.length}개 문제${sc>0?' · 최고 점수: '+sc+'%':''}</div>
  <div class="unit-pbar"><div class="unit-pbar-fill" style="width:${sc}%;background:${u.color}"></div></div>
</div>

<div class="rules-wrap">${rulesHtml}</div>

<div style="padding:0 1rem 1.5rem">
  <button onclick="startQuiz(${u.id})" style="width:100%;padding:14px;border-radius:12px;border:none;background:${u.color};color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;box-shadow:0 2px 8px ${u.color}44">
    연습 문제 시작 →
  </button>
</div>`;
}

// ═══════════════════════════════
// QUIZ ENGINE
// ═══════════════════════════════
function startQuiz(unitId){
  SEL=GRAMMAR.find(u=>u.id===unitId);
  QUIZ_IDX=0; QUIZ_XP=0; QUIZ_RESULTS=[];
  QUIZ_PHASE='q'; QUIZ=null;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  CV='quiz'; document.getElementById('v-quiz').classList.add('active');
  renderQuiz();
}

function startReview(){
  // Find due units and pick exercises
  const dueUnits=GRAMMAR.filter(u=>{const m=P.mastery[u.id];return m&&m.srsLevel>0&&isDue(m);});
  if(!dueUnits.length){alert('복습할 단원이 없어요!');return;}
  SEL=dueUnits[0];
  startQuiz(SEL.id);
}

function renderQuiz(){
  const el=document.getElementById('v-quiz');
  if(!SEL)return;
  const u=SEL;
  const exs=u.exercises;

  if(QUIZ_IDX>=exs.length||QUIZ_PHASE==='done'){
    renderDone();return;
  }

  const ex=exs[QUIZ_IDX];
  const pct=Math.round(QUIZ_IDX/exs.length*100);
  const backFn=`openUnit(${u.id})`;
  let cardClass='quiz-q-card';
  if(QUIZ_PHASE==='reveal')cardClass+=(QUIZ?.correct?' correct':' wrong');

  // Build question text with blank
  let qText=ex.q;
  if(ex.type==='mc'){
    qText=qText.replace('_____',`<span class="fill-blank" style="border-color:${u.color}">${QUIZ_PHASE==='reveal'?ex.a:'&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;'}</span>`);
  }

  let revealHtml='';
  if(QUIZ_PHASE==='reveal'){
    revealHtml=`<div class="quiz-reveal">
      <div class="reveal-icon">${QUIZ.correct?'✅':'❌'}</div>
      <div class="answer" style="color:${u.color}">${QUIZ.correct?'정답!':'정답: '+ex.a}</div>
      <div class="ko">${ex.exp}</div>
    </div>`;
  }

  let interactionHtml='';
  if(ex.type==='mc'){
    // FIX: use index to avoid apostrophe escaping bugs
    const opts=ex.opts.map((o,oi)=>{
      let cls='opt';
      if(QUIZ_PHASE==='reveal'){
        if(o===ex.a)cls+=' correct-opt';
        else if(o===QUIZ?.chosen)cls+=' wrong-opt';
      }
      return`<button class="${cls}" ${QUIZ_PHASE==='reveal'?'disabled':''} onclick="answerMC(${oi})">${o}</button>`;
    }).join('');
    const nextBtn = QUIZ_PHASE==='reveal'
      ? `<div style="padding:0 1rem .8rem"><button class="check-btn next" onclick="nextQ()">다음 문제 →</button></div>`
      : '';
    interactionHtml=`<div class="opts-grid">${opts}</div>${nextBtn}`;
  } else {
    if(QUIZ_PHASE==='q'){
      interactionHtml=`<div style="padding:0 1rem 1rem">
        <input type="text" id="fill-inp" class="fill-input" style="border-color:${u.color}" placeholder="정답을 입력하세요..." onkeydown="if(event.key==='Enter')checkFill()">
        <button class="check-btn primary" onclick="checkFill()">확인하기</button>
      </div>`;
    } else {
      interactionHtml=`<div style="padding:0 1rem 1rem">
        <button class="check-btn next" onclick="nextQ()">다음 문제 →</button>
      </div>`;
    }
  }

  el.innerHTML=`
<div class="quiz-hdr">
  <button class="back-btn" style="margin:0" onclick="${backFn}">✕</button>
  <span style="font-size:12px;color:var(--ink2);font-weight:500">${u.title} · ${QUIZ_IDX+1}/${exs.length}</span>
  <span style="font-size:13px;font-weight:700;color:#D97706">+${QUIZ_XP} XP</span>
</div>
<div class="quiz-prog-bar"><div class="quiz-prog-fill" style="width:${pct}%;background:${u.color}"></div></div>
<div class="quiz-prompt-lbl">${ex.type==='mc'?'올바른 것을 고르세요':'빈칸을 채우세요'}</div>
<div class="${cardClass}">
  <div class="quiz-q-text">${qText}</div>
  ${revealHtml}
</div>
${interactionHtml}`;

  if(ex.type==='fill'&&QUIZ_PHASE==='q'){
    setTimeout(()=>{const i=document.getElementById('fill-inp');if(i)i.focus();},50);
  }


}

function answerMC(optIdx){
  if(QUIZ_PHASE!=='q')return;
  const ex=SEL.exercises[QUIZ_IDX];
  const choice=ex.opts[optIdx]; // index-based — avoids apostrophe bugs
  const correct=choice===ex.a;
  QUIZ={correct,chosen:choice};
  QUIZ_PHASE='reveal';
  if(correct)QUIZ_XP+=10;
  P.totalQ++;if(correct)P.totalRight++;
  updateStreak();saveP();
  QUIZ_RESULTS.push({q:ex.q,a:ex.a,correct,type:'mc'});
  renderQuiz();
  setTimeout(()=>speakEN(ex.a), 200);
}

function checkFill(){
  if(QUIZ_PHASE!=='q')return;
  const inp=document.getElementById('fill-inp');
  if(!inp)return;
  const ex=SEL.exercises[QUIZ_IDX];
  const val=inp.value.trim().toLowerCase();
  // Accept multiple possible answers (split by /)
  const answers=ex.a.split(' / ').map(a=>a.trim().toLowerCase());
  const correct=answers.some(a=>val===a||val===a.replace(/'/g,''));
  inp.className='fill-input '+(correct?'correct-input':'wrong-input');
  QUIZ={correct,chosen:val};
  QUIZ_PHASE='reveal';
  if(correct)QUIZ_XP+=10;
  P.totalQ++;if(correct)P.totalRight++;
  updateStreak();saveP();
  QUIZ_RESULTS.push({q:ex.q,a:ex.a,correct,type:'fill'});
  renderQuiz();
  // Speak the correct answer
  setTimeout(()=>speakEN(ex.a), 200);
}

function nextQ(){
  QUIZ_IDX++;
  QUIZ_PHASE='q';QUIZ=null;
  if(QUIZ_IDX>=SEL.exercises.length){QUIZ_PHASE='done';}
  renderQuiz();
}

function renderDone(){
  const el=document.getElementById('v-quiz');
  const u=SEL;
  const total=QUIZ_RESULTS.length;
  const right=QUIZ_RESULTS.filter(r=>r.correct).length;
  const score=Math.round(right/total*100);
  const emoji=score>=80?'🎉':score>=60?'👍':'💪';

  // Update mastery
  const old=P.mastery[u.id]||{srsLevel:0,score:0,done:false,attempts:0};
  const newLv=Math.min(old.srsLevel+(score>=60?1:0),5);
  const nextRev=Date.now()+[0,1,3,7,14,30][newLv]*86400000;
  P.mastery[u.id]={srsLevel:newLv,score:Math.max(old.score,score),done:score>=60,attempts:old.attempts+1,nextReview:nextRev};
  P.xp+=QUIZ_XP;
  const t=today();
  P.xpHistory[t]=(P.xpHistory[t]||0)+QUIZ_XP;
  saveP();

  const rows=QUIZ_RESULTS.map(r=>`<div class="result-item"><span style="flex:1;padding-right:8px">${r.q.replace(/_____/,'(___)')}</span><span>${r.correct?'✅':'❌'}</span></div>`).join('');
  const backFn=`openUnit(${u.id})`;

  el.innerHTML=`<div class="done-wrap">
    <div style="position:relative" class="done-score-ring">
      <svg width="100" height="100" viewBox="0 0 100 100">
        <circle class="ring-bg" cx="50" cy="50" r="42"/>
        <circle class="ring-fill" cx="50" cy="50" r="42"
          stroke="${u.color}"
          stroke-dasharray="${2*Math.PI*42}"
          stroke-dashoffset="${2*Math.PI*42*(1-score/100)}"/>
      </svg>
      <div class="done-score-txt">${score}<small>%</small></div>
    </div>
    <h2 class="done-title">${emoji} 완료!</h2>
    <p style="color:var(--ink2);margin-bottom:6px">${total}개 중 ${right}개 정답</p>
    <p class="done-xp">+${QUIZ_XP} XP 획득!</p>
    <div class="result-list">${rows}</div>
    <button onclick="${backFn}" style="width:100%;padding:13px;border-radius:12px;border:none;background:${u.color};color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit">단원으로 돌아가기</button>
  </div>`;
}

// ═══════════════════════════════
// REVIEW
// ═══════════════════════════════
function renderReview(){
  const el=document.getElementById('v-review');
  const due=GRAMMAR.filter(u=>{const m=P.mastery[u.id];return m&&m.srsLevel>0&&isDue(m);});
  if(!due.length){
    el.innerHTML=`<div class="pad"><h2 style="font-size:20px;margin-bottom:8px">복습 목록</h2><div class="empty">🎉 복습할 단원이 없어요!<br>새 단원을 공부해보세요.</div></div>`;return;
  }
  const rows=due.map(u=>{
    const m=P.mastery[u.id]||{};
    return`<button class="unit-row" onclick="startQuiz(${u.id})">
      <div class="unit-icon" style="background:${u.color}22;color:${u.color};font-weight:700;font-size:12px">U${u.id}</div>
      <div class="unit-info">
        <div class="unit-title">${u.title}</div>
        <div class="unit-sub">${u.ko} · 최고 점수: ${m.score||0}%</div>
      </div>
      <div style="font-size:12px;background:${u.color}22;color:${u.color};padding:4px 10px;border-radius:8px;font-weight:600;white-space:nowrap">복습 →</div>
    </button>`;
  }).join('');
  el.innerHTML=`<div class="pad"><h2 style="font-size:20px;margin-bottom:4px">SRS 복습</h2><p style="font-size:13px;color:var(--ink2);margin-bottom:1rem">${due.length}개 단원이 복습 예정이에요</p></div>${rows}`;
}

// ═══════════════════════════════
// PROGRESS
// ═══════════════════════════════
function renderProgress(){
  const el=document.getElementById('v-progress');
  const acc=P.totalQ?Math.round(P.totalRight/P.totalQ*100):0;
  const xpLv=Math.floor(P.xp/150)+1;
  const xpCur=P.xp%150;
  const done=Object.values(P.mastery).filter(m=>m.done).length;
  const mastered=Object.values(P.mastery).filter(m=>m.srsLevel>=5).length;

  // XP 14-day chart
  const xpDays=Array.from({length:14},(_,i)=>{
    const d=new Date(Date.now()-(13-i)*86400000);
    const k=d.toISOString().slice(0,10);
    return{n:`${d.getMonth()+1}/${d.getDate()}`,xp:P.xpHistory[k]||0};
  });
  const maxXP=Math.max(...xpDays.map(d=>d.xp),1);
  const xpBars=xpDays.map((d,i)=>`<div class="c-col">
    ${d.xp>0?`<div class="c-val">${d.xp}</div>`:''}
    <div class="c-bar" style="height:${Math.max(d.xp/maxXP*80,d.xp>0?4:2)}px;background:${d.xp>0?'var(--ink)':'var(--card2)'}"></div>
    ${i%2===0?`<div class="c-lbl">${d.n}</div>`:'<div class="c-lbl"></div>'}
  </div>`).join('');

  // Section progress
  const sections=[...new Set(GRAMMAR.map(u=>u.section))];
  const secRows=sections.map(sec=>{
    const units=GRAMMAR.filter(u=>u.section===sec);
    const doneCount=units.filter(u=>unitDone(u.id)).length;
    const pct=Math.round(doneCount/units.length*100);
    const color=units[0].color;
    return`<div class="mbar">
      <div class="mbar-top">
        <span style="color:var(--ink2)">${units[0].sectionKo}</span>
        <span style="font-weight:600">${doneCount}/${units.length} 완료</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
    </div>`;
  }).join('');

  el.innerHTML=`<div class="pad">
<h2 style="font-size:20px;margin-bottom:1rem">학습 현황</h2>

<div class="xp-card-full">
  <div class="xp-lv">LEVEL ${xpLv}</div>
  <div class="xp-num">${P.xp} XP</div>
  <div class="xp-bar-track"><div class="xp-bar-fill" style="width:${xpCur/1.5}%"></div></div>
  <div class="xp-sub">${xpCur}/150 XP · 다음 레벨까지 ${150-xpCur}XP</div>
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem">
  ${[{l:"정확도",v:acc+'%'},{l:"🔥 연속",v:(P.streak||0)+'일'},{l:"완료 단원",v:done},{l:"마스터",v:mastered}]
    .map(s=>`<div class="stat" style="padding:.8rem 1rem;text-align:left">
      <div style="font-size:10px;color:var(--ink3);margin-bottom:3px">${s.l}</div>
      <div style="font-size:22px;font-weight:700;font-family:'DM Serif Display',serif">${s.v}</div>
    </div>`).join('')}
</div>

<div class="sec-prog-card">
  <div class="sec-prog-hdr">
    <span style="font-size:13px;font-weight:600">섹션별 진행률</span>
  </div>
  <div class="sec-prog-body">${secRows}</div>
</div>

<div class="sec-prog-card">
  <div class="sec-prog-hdr"><span style="font-size:13px;font-weight:600">최근 14일 XP</span></div>
  <div style="padding:1rem">
    <div class="chart-wrap">${xpBars}</div>
  </div>
</div>

</div>`;
}

// ═══════════════════════════════
// SPEECH ENGINE
// ═══════════════════════════════
let enVoice = null;

function initVoices(){
  if(!window.speechSynthesis) return;
  function load(){
    const vs = window.speechSynthesis.getVoices();
    enVoice = vs.find(v=>v.lang==='en-US') ||
              vs.find(v=>v.lang.startsWith('en')) ||
              vs[0] || null;
  }
  load();
  window.speechSynthesis.addEventListener('voiceschanged', load);
}

function speakEN(text, el){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  if(enVoice) u.voice = enVoice;
  u.lang = 'en-US';
  u.rate = 0.88;
  // Flash highlight
  if(el){ el.style.background='#EFF6FF'; setTimeout(()=>el.style.background='',800); }
  window.speechSynthesis.speak(u);
}

// ═══════════════════════════════
// INIT
// ═══════════════════════════════
loadP();
initVoices();
renderHome();
refreshBadge();
