<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>汉语 — Chinese Learner</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#ebe9e2;color:#1a1a18;min-height:100vh}
:root{
  --blue:#C0392B;--teal:#922B21;--amber:#7B241C;--coral:#E74C3C;
  --blue2:#FDECEA;--blue3:#FADBD8;
  --bg:#ffffff;--bg2:#f5f4f0;--bg3:#ebe9e2;
  --text:#1a1a18;--text2:#5f5e5a;--text3:#888780;
  --border:rgba(0,0,0,0.09);--radius:12px;
}
#app{max-width:640px;margin:0 auto;background:var(--bg);min-height:100vh;box-shadow:0 0 40px rgba(0,0,0,0.1)}

/* NAV */
.top-nav{display:flex;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:100}
.nav-logo{padding:13px 16px;font-weight:600;font-size:16px;color:#C0392B;border-right:1px solid var(--border);letter-spacing:-0.02em;white-space:nowrap}
.nav-tab{flex:1;padding:12px 6px;border:none;background:transparent;cursor:pointer;font-size:12px;color:var(--text2);border-bottom:2px solid transparent;font-family:inherit;transition:all .15s;position:relative}
.nav-tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:500}
.nav-badge{position:absolute;top:6px;right:calc(50% - 18px);background:var(--coral);color:#fff;border-radius:50%;width:15px;height:15px;font-size:9px;display:flex;align-items:center;justify-content:center}

/* VIEWS */
.view{display:none;padding:1.25rem 1rem}
.view.active{display:block}

/* CARDS */
.card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);padding:1rem 1.25rem}

/* BUTTONS */
.btn{padding:9px 16px;border-radius:8px;border:0.5px solid var(--border);background:var(--bg);color:var(--text);font-size:13px;cursor:pointer;font-family:inherit;transition:all .15s}
.btn:hover{background:var(--bg2)}
.btn-block{width:100%;padding:14px;font-size:15px;border-radius:10px}

/* UTILS */
.row{display:flex;align-items:center;gap:10px}
.row-between{display:flex;align-items:center;justify-content:space-between}
.col{display:flex;flex-direction:column;gap:10px}
.section-label{font-size:11px;letter-spacing:.07em;color:var(--text3);margin-bottom:10px;text-transform:uppercase}
.pill{font-size:10px;padding:2px 8px;border-radius:10px}

/* XP CARD */
.xp-card{background:var(--blue);border-radius:var(--radius);padding:1rem 1.25rem;margin-bottom:12px}
.xp-bar-track{height:6px;background:#7B241C;border-radius:3px;overflow:hidden;margin:10px 0 4px}
.xp-bar-fill{height:100%;background:#85B7EB;border-radius:3px;transition:width .6s ease}

/* STATS */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.stat-card{background:var(--bg2);border-radius:10px;padding:.6rem .4rem;text-align:center}
.stat-val{font-size:18px;font-weight:500}
.stat-lbl{font-size:9px;color:var(--text3);margin-top:2px}

/* LESSON CARDS */
.lesson-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);padding:.9rem 1rem;cursor:pointer;transition:background .15s;margin-bottom:10px}
.lesson-card:hover{background:var(--bg2)}
.pbar-track{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-top:10px}
.pbar-fill{height:100%;border-radius:2px;transition:width .5s}

/* VOCAB GRID */
.vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;margin-bottom:14px}
.vocab-card{background:var(--bg);border:0.5px solid var(--border);border-radius:10px;padding:.7rem}
.mastery-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* QUIZ */
.quiz-wrap{padding:1rem}
.quiz-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.qpbar-track{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:26px}
.qpbar-fill{height:100%;background:var(--blue);border-radius:2px;transition:width .3s}
.char-card{border:0.5px solid var(--border);border-radius:var(--radius);padding:2rem 1rem;text-align:center;margin-bottom:22px;transition:background .3s}
.char-big{font-size:68px;line-height:1}
.opts-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt-btn{padding:14px 10px;border-radius:10px;border:0.5px solid var(--border);background:var(--bg);cursor:pointer;font-size:14px;font-family:inherit;transition:all .2s;color:var(--text);text-align:center}
.opt-btn:hover:not(:disabled){background:var(--bg2)}
.opt-btn.correct{background:#EAF3DE!important;border:1.5px solid #639922!important}
.opt-btn.wrong{background:#FCEBEB!important;border:1.5px solid #E24B4A!important}
.opt-btn:disabled{cursor:default}

/* DIALOGUE */
.dlg-line{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:.5px solid var(--border)}
.dlg-line:last-child{border-bottom:none}
.dlg-badge{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;flex-shrink:0;margin-top:2px}

/* PROGRESS / CHARTS */
.bar-row{margin-bottom:10px}
.bar-track{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px}
.chart-wrap{display:flex;align-items:flex-end;gap:6px;height:120px;margin-bottom:4px}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.chart-bar{width:100%;border-radius:4px 4px 0 0;min-height:2px}
.chart-lbl{font-size:9px;color:var(--text3);text-align:center}
.chart-val{font-size:10px;color:var(--text2);font-weight:500}
.done-wrap{padding:2rem 1rem;text-align:center}
.result-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:.5px solid var(--border)}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2)}
.empty-card{border:.5px dashed var(--border);border-radius:var(--radius);padding:1.25rem;text-align:center;color:var(--text3);font-size:13px}
.dlg-toggle{width:100%;padding:10px;border-radius:8px;border:.5px solid var(--border);background:transparent;cursor:pointer;font-size:13px;font-family:inherit;color:var(--text);margin-bottom:10px}
.info-box{margin-top:20px;padding:.8rem 1rem;border-radius:10px;background:var(--bg2);font-size:12px;color:var(--text2);line-height:1.7}
.sound-bar{padding:6px 16px;font-size:11px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border)}
.sound-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.vocab-card{cursor:pointer;transition:background .15s}
.vocab-card:hover{background:var(--bg2)}
.vocab-card.speaking{background:#FDECEA!important;border-color:#C0392B!important}
.dlg-line{cursor:pointer;transition:background .15s}
.dlg-line:hover{background:var(--bg2)}
.dlg-line.speaking{background:#FDECEA!important}
</style>
</head>
<body>
<div id="app">

  <div id="view-lesson"   class="view"></div>

// HELPERS
// ━━━━━━━━━━━━━━━━━━━━━━━━
const nextRev  = (lv)=>Date.now()+SRS_DAYS[Math.min(lv,5)]*86400000;
const isDue    = (wm)=>!wm||wm.level===0||Date.now()>=wm.nextReview;
const today    = ()=>new Date().toISOString().slice(0,10);

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function buildOpts(correct){
  const wrong=shuffle(ALL_VOCAB.filter(v=>v.meaning!==correct.meaning)).slice(0,3);
  return shuffle([correct,...wrong]);
}
function buildCards(vocab){
  return shuffle(vocab).map(v=>({...v,opts:buildOpts(v)}));
}
function getDue(){
  return ALL_VOCAB.filter(v=>{
    const wm=P.wordMastery[v.char];
    return wm&&wm.level>0&&isDue(wm);
  }).length;
}

function renderSearch(){
  var q = (document.getElementById('search-input').value||'').trim().toLowerCase();
  var el = document.getElementById('search-results');
  if(!el) return;
  if(!q){ el.innerHTML='<div style="text-align:center;padding:2rem;color:var(--text3);font-size:13px">단어, 병음, 뜻을 입력하세요</div>'; return; }

  var results = [];
  CURRICULUM.forEach(function(lesson){
    // Search vocab
    (lesson.vocab||[]).forEach(function(v){
      var ch = (v.char||v.ch||'').toLowerCase();
      var py = (v.pinyin||v.py||'').toLowerCase();
      var mn = (v.meaning||v.kr||'').toLowerCase();
      if(ch.includes(q)||py.includes(q)||mn.includes(q)){
        results.push({type:'vocab',lesson:lesson,item:v});
      }
    });
    // Search dialogue
    (lesson.dialogue||[]).forEach(function(line){
      var zh = (line.zh||'').toLowerCase();
      var py = (line.py||'').toLowerCase();
      var kr = (line.kr||'').toLowerCase();
      if(zh.includes(q)||py.includes(q)||kr.includes(q)){
        results.push({type:'dialogue',lesson:lesson,item:line});
      }
    });
    // Search grammar
    (lesson.grammar||[]).forEach(function(g){
      var t = (g.title||'').toLowerCase();
      var r = (g.rule||'').toLowerCase();
      var ex = (g.example||'').toLowerCase();
      var mn = (g.meaning||'').toLowerCase();
      if(t.includes(q)||r.includes(q)||ex.includes(q)||mn.includes(q)){
        results.push({type:'grammar',lesson:lesson,item:g});
      }
    });
  });

  if(!results.length){
    el.innerHTML='<div style="text-align:center;padding:2rem;color:var(--text3);font-size:13px">검색 결과가 없습니다: "'+q+'"</div>';
    return;
  }

  var typeLabel = {vocab:'단어',dialogue:'대화문',grammar:'문법'};
  var typeColor = {vocab:'#C0392B',dialogue:'#059669',grammar:'#854F0B'};
  var typeBg    = {vocab:'#FDECEA',dialogue:'#D1FAE5',grammar:'#FAEEDA'};

  var html2 = '<div style="font-size:11px;color:var(--text3);margin-bottom:.8rem">'+results.length+'개 결과</div>';

  results.forEach(function(r){
    var it = r.item;
    var lc = r.lesson.color||'#C0392B';
    var tl = typeLabel[r.type];
    var tc = typeColor[r.type];
    var tb = typeBg[r.type];

    html2 += '<div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.8rem 1rem;margin-bottom:8px;cursor:pointer" data-lid="'+r.lesson.id+'" onclick="goToLesson(this)">';
    // Lesson badge
    html2 += '<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">';
    html2 += '<span style="font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;background:'+tb+';color:'+tc+'">'+tl+'</span>';
    html2 += '<span style="font-size:10px;color:var(--text3)">WEEK '+r.lesson.week+' · '+r.lesson.title+'</span>';
    html2 += '</div>';

    if(r.type==='vocab'){
      html2 += '<div style="display:flex;align-items:baseline;gap:10px">';
      html2 += '<span style="font-size:22px;font-weight:600;color:var(--text1)">'+(it.char||it.ch||'')+'</span>';
      html2 += '<span style="font-size:12px;color:'+lc+'">'+(it.pinyin||it.py||'')+'</span>';
      html2 += '<span style="font-size:12px;color:var(--text2);margin-left:auto">'+(it.meaning||it.kr||'')+'</span>';
      html2 += '</div>';
    } else if(r.type==='dialogue'){
      html2 += '<div style="display:flex;gap:8px;align-items:flex-start">';
      html2 += '<span style="min-width:20px;height:20px;border-radius:50%;background:'+(it.sp==='A'?'#FDECEA':'#FAEEDA')+';color:'+(it.sp==='A'?'#C0392B':'#854F0B')+';font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center">'+it.sp+'</span>';
      html2 += '<div><div style="font-size:14px">'+(it.zh||'')+'</div>';
      html2 += '<div style="font-size:11px;color:#C0392B">'+(it.py||'')+'</div>';
      html2 += '<div style="font-size:11px;color:var(--text2)">'+(it.kr||'')+'</div></div>';
      html2 += '</div>';
    } else if(r.type==='grammar'){
      html2 += '<div style="font-size:13px;font-weight:600;color:var(--text1);margin-bottom:3px">'+(it.title||'')+'</div>';
      html2 += '<div style="font-size:11px;color:var(--text3);background:var(--bg);padding:4px 8px;border-radius:5px">'+(it.rule||'')+'</div>';
    }
    html2 += '</div>';
  });

  el.innerHTML = html2;
}

function goToLesson(el){
  var lessonId=el.getAttribute('data-lid');
  if(!lessonId) return;
  searchQuery=(document.getElementById('search-input').value||'').trim().toLowerCase();
  openLesson(lessonId);
  // scroll to first highlighted item after render
  setTimeout(function(){
    var hl=document.querySelector('.search-hl-card');
    if(hl) hl.scrollIntoView({behavior:'smooth',block:'center'});
  },200);
}

function goView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>{
    t.classList.toggle('active',t.dataset.view===name);
  });
  currentView=name;
  document.getElementById('view-'+name).classList.add('active');
  if(name!=='lesson') searchQuery='';
  render();
}

function render(){
  if(currentView==='home')     renderHome();
  if(currentView==='learn')    renderLearn();
  if(currentView==='voca100')  renderVoca100();
  if(currentView==='lesson')   renderLesson();
  if(currentView==='quiz')     renderQuiz();
  if(currentView==='progress') renderProgress();
  if(currentView==='search')   initSearch();
  if(currentView==='hsk')      renderHSK();
  refreshBadge();
}

function initSearch(){
  // Just focus the input when switching to search tab
  setTimeout(function(){
    var inp = document.getElementById('search-input');
    if(inp) inp.focus();
  }, 100);
}

function refreshBadge(){
  const tab=document.querySelector('[data-view="home"]');
  const old=tab.querySelector('.nav-badge');
  if(old)old.remove();
  const n=getDue();
  if(n>0){
    const b=document.createElement('span');
    b.className='nav-badge';b.textContent=n;tab.appendChild(b);
  }
}

function openLesson(id){
  selectedLesson=CURRICULUM.find(l=>l.id===id);
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  currentView='lesson';
  document.getElementById('view-lesson').classList.add('active');
  renderLesson();
}

function setLTab(tab){LESSON_TAB=tab;renderLesson();}

function renderLTab(){
  const l=selectedLesson;
  if(!l)return;
  const tc=document.getElementById('lesson-tab-content');
  if(!tc)return;

  if(LESSON_TAB==='vocab'){
    const legend=LVL_LABELS.map((label,i)=>`<div class="legend-item"><div class="mastery-dot" style="background:${LVL_COLORS[i]}"></div><span>${label}</span></div>`).join('');
    const cards=l.vocab.map(v=>{
      const lv=P.wordMastery[v.char]?.level||0;
      const esc=v.char.replace(/'/g,"\'");
      const q=searchQuery;
      const vMatch=q&&(v.char.toLowerCase().includes(q)||(v.pinyin||'').toLowerCase().includes(q)||(v.meaning||'').toLowerCase().includes(q));
      const hlClass=vMatch?' search-hl-card':'';
      const hlBorder=vMatch?'border:2px solid #f59e0b;':'';
      function hlText(t){ if(!q||!t) return t||''; return t.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark style="background:#fef08a;border-radius:2px;padding:0 1px">$1</mark>'); }
      return `<div class="vocab-card${hlClass}" style="${hlBorder}" onclick="speak('${esc}')">
        <div class="row-between" style="margin-bottom:4px">
          <span style="font-size:24px">${hlText(v.char)}</span>
          <span class="mastery-dot" style="background:${LVL_COLORS[lv]}" title="${LVL_LABELS[lv]}"></span>
        </div>
        <div style="font-size:12px;color:var(--blue);font-weight:500">${hlText(v.pinyin)}</div>
        <div style="font-size:11px;color:var(--text2)">${hlText(v.meaning)}</div>
        <div style="font-size:9px;color:var(--text3);margin-top:3px">🔊 클릭</div>
      </div>`;
    }).join('');
    tc.innerHTML=`<div class="legend" style="padding:.8rem 1rem .2rem">${legend}</div><div class="vocab-grid">${cards}</div>`;

  } else if(LESSON_TAB==='grammar'){
    if(!l.grammar||!l.grammar.length){tc.innerHTML='<div class="empty-note">문법 내용 없음</div>';return;}
    const rows=l.grammar.map(g=>`
      <div style="background:var(--bg);border-radius:12px;padding:.9rem 1rem;margin-bottom:10px;border-left:3px solid ${l.color}">
        <div style="font-size:11px;font-weight:700;color:${l.color};letter-spacing:.04em;margin-bottom:5px">${g.title}</div>
        <div style="font-size:12px;background:var(--bg2);border-radius:6px;padding:5px 10px;margin-bottom:8px;color:var(--text2)">${g.rule}</div>
        ${g.example?`<div style="font-size:22px;font-weight:600;margin-bottom:2px">${g.example}</div>`:''}
        ${g.pinyin?`<div style="font-size:13px;color:#C0392B;font-weight:500;margin-bottom:2px">${g.pinyin}</div>`:''}
        ${g.meaning?`<div style="font-size:12px;color:var(--text2)">${g.meaning}</div>`:''}
      </div>`).join('');
    tc.innerHTML=`<div style="padding:1rem">${rows}</div>`;

  } else if(LESSON_TAB==='dialogue'){
    if(!l.dialogue||!l.dialogue.length){tc.innerHTML='<div class="empty-note">대화문 없음</div>';return;}
    const lines=l.dialogue.map(line=>{
      const esc=line.zh.replace(/'/g,"\'");
      const q2=searchQuery;
      const dMatch=q2&&(line.zh.toLowerCase().includes(q2)||(line.py||'').toLowerCase().includes(q2)||(line.kr||'').toLowerCase().includes(q2));
      const dlgStyle=dMatch?'border-left:3px solid #f59e0b;background:#fffbeb;border-radius:8px':'';
      const dlgHlClass=dMatch?' search-hl-card':'';
      function hlD(t){ if(!q2||!t) return t||''; return t.replace(new RegExp('('+q2.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark style="background:#fef08a;border-radius:2px;padding:0 1px">$1</mark>'); }
      return `<div class="dlg-line${dlgHlClass}" style="${dlgStyle}" onclick="speak('${esc}')">
        <div class="dlg-badge" style="background:${line.sp==='A'?'#FDECEA':'#FAEEDA'};color:${line.sp==='A'?'#C0392B':'#854F0B'}">${line.sp}</div>
        <div>
          <div style="font-size:15px">${hlD(line.zh)} <span style="font-size:11px;color:var(--text3)">🔊</span></div>
          <div style="font-size:11px;color:#C0392B">${hlD(line.py)}</div>
          <div style="font-size:11px;color:var(--text2)">${hlD(line.kr)}</div>
        </div>
      </div>`;
    }).join('');

  } else if(LESSON_TAB==='quiz'){
    tc.innerHTML=`<div style="padding:1rem">
      <button class="btn btn-block" style="background:${l.color};border:none;color:#fff;font-weight:500;margin-bottom:10px" onclick="startQuiz('${l.id}','all')">전체 단어 퀴즈 (${l.vocab.length}개)</button>
      <button class="btn btn-block" style="margin-bottom:10px" onclick="startQuiz('${l.id}','hard')">🔥 약한 단어만 퀴즈</button>
    </div>`;

  } else if(LESSON_TAB==='mastery'){
    const rows=l.vocab.map(v=>{
      const lv=P.wordMastery[v.char]?.level||0;
      const wm=P.wordMastery[v.char];
      const dueIn=wm&&wm.level>0?Math.max(0,Math.ceil((wm.nextReview-Date.now())/86400000)):0;
      return`<div class="result-row">
        <div><div style="font-size:15px;font-weight:500">${v.char}</div><div style="font-size:11px;color:var(--text2)">${v.pinyin} · ${v.meaning}</div></div>
        <div style="text-align:right">
          <div style="font-size:11px;font-weight:600;color:${LVL_COLORS[lv]}">${LVL_LABELS[lv]}</div>

        </div>
      </div>`;
    }).join('');
    tc.innerHTML=`<div style="padding:1rem">${rows}</div>`;
  }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━
// QUIZ
// ━━━━━━━━━━━━━━━━━━━━━━━━
function startQuiz(lessonId,mode){
  const lesson=CURRICULUM.find(l=>l.id===lessonId);
  let pool=lesson.vocab;
  if(mode==='hard'){
    pool=lesson.vocab.filter(v=>{const lv=P.wordMastery[v.char]?.level||0;return lv===0||lv===1;});
    if(!pool.length)pool=lesson.vocab;
  }
  quiz={lessonId,title:lesson.title,cards:buildCards(pool),
    idx:0,results:[],phase:'question',xpEarned:0,chosen:null,wasCorrect:null};
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  currentView='quiz';
  document.getElementById('view-quiz').classList.add('active');
  renderQuiz();
}

function startReview(){
  const due=ALL_VOCAB.filter(v=>{
    const wm=P.wordMastery[v.char];
    return wm&&wm.level>0&&isDue(wm);
  });
  if(!due.length)return;
  quiz={lessonId:null,title:'복습',cards:buildCards(due),
    idx:0,results:[],phase:'question',xpEarned:0,chosen:null,wasCorrect:null};
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  currentView='quiz';
  document.getElementById('view-quiz').classList.add('active');
  renderQuiz();
}

function renderQuiz(){
  const el=document.getElementById('view-quiz');
  if(!quiz)return;

  if(quiz.phase==='done'){
    const correct=quiz.results.filter(r=>r.correct).length;
    const total=quiz.results.length;
    const score=Math.round(correct/total*100);
    const emoji=score>=80?'🎉':score>=60?'👍':'💪';
    const rows=quiz.results.map(r=>`
      <div class="result-row">
        <span style="font-size:18px">${r.char}</span>
        <span>${r.correct?'✅':'❌'}</span>
      </div>`).join('');
    const backFn=quiz.lessonId?`goView('learn')`:`goView('home')`;
    el.innerHTML=`<div class="done-wrap">
      <div style="font-size:52px;margin-bottom:12px">${emoji}</div>
      <div style="font-size:24px;font-weight:500;margin-bottom:6px">완료!</div>
      <div style="font-size:14px;color:var(--text2);margin-bottom:6px">${total}개 중 ${correct}개 정답 (${score}%)</div>
      <div style="font-size:20px;font-weight:500;color:var(--amber);margin-bottom:28px">+${quiz.xpEarned} XP 획득!</div>
      <div style="text-align:left;margin-bottom:24px">${rows}</div>
      <button class="btn btn-block" style="background:var(--blue);border:none;color:#fff" onclick="${backFn}">완료</button>
    </div>`;
    return;
  }

  const c=quiz.cards[quiz.idx];
  const pct=Math.round(quiz.idx/quiz.cards.length*100);
  let charBg='var(--bg)';
  if(quiz.phase==='reveal')charBg=quiz.wasCorrect?'#EAF3DE':'#FCEBEB';

  const backFn=quiz.lessonId?`goView('lesson')`:`goView('home')`;
  const opts=c.opts.map(opt=>{
    let cls='opt-btn';
    if(quiz.phase==='reveal'){
      if(opt.meaning===c.meaning)cls+=' correct';
      else if(opt.meaning===quiz.chosen)cls+=' wrong';
    }
    const esc=opt.meaning.replace(/'/g,"\\'");
    return`<button class="${cls}"${quiz.phase==='reveal'?' disabled':''} onclick="answer('${esc}')">${opt.meaning}</button>`;
  }).join('');

  el.innerHTML=`<div class="quiz-wrap">
    <div class="quiz-hdr">
      <button class="btn" style="padding:6px 12px;font-size:13px" onclick="${backFn}">✕</button>
      <span style="font-size:13px;color:var(--text2)">${quiz.title} · ${quiz.idx+1}/${quiz.cards.length}</span>
      <span style="font-size:13px;font-weight:500;color:var(--amber)">+${quiz.xpEarned} XP</span>
    </div>
    <div class="qpbar-track"><div class="qpbar-fill" style="width:${pct}%"></div></div>
    <div style="font-size:12px;color:var(--text3);text-align:center;margin-bottom:8px">올바른 뜻을 고르세요</div>
    <div class="char-card" style="background:${charBg}">
      <div class="char-big">${c.char}</div>
      ${quiz.phase==='reveal'?`
        <div style="margin-top:12px">
          <div style="font-size:16px;color:#C0392B;font-weight:500">${c.pinyin}</div>
          <div style="font-size:13px;color:var(--text2);margin-top:4px">${c.meaning}</div>
          <div style="font-size:20px;margin-top:8px">${quiz.wasCorrect?'✅ 정답!':'❌ 틀렸어요'}</div>
        </div>`:''}
    </div>
    <div class="opts-grid">${opts}</div>
  </div>`;
}

function answer(choice){
  if(!quiz||quiz.phase!=='question')return;
  const c=quiz.cards[quiz.idx];
  const correct=choice===c.meaning;
  const newResults=[...quiz.results,{char:c.char,correct}];
  const wm=P.wordMastery[c.char]||{level:0,correct:0,wrong:0};
  const newLv=correct?Math.min(wm.level+1,5):Math.max(wm.level-1,0);
  const xpGain=correct?10:0;
  const isLast=quiz.idx===quiz.cards.length-1;
  const t=today();

  P.xp+=xpGain;
  P.totalReviews++;
  if(correct)P.totalCorrect++;
  P.lastStudied=Date.now();
  P.wordMastery[c.char]={level:newLv,nextReview:nextRev(newLv),
    correct:wm.correct+(correct?1:0),wrong:wm.wrong+(correct?0:1)};
  P.xpHistory[t]=(P.xpHistory[t]||0)+xpGain;

  if(isLast&&quiz.lessonId){
    const score=Math.round(newResults.filter(r=>r.correct).length/newResults.length*100);
    const lp=P.lessonProgress[quiz.lessonId]||{};
    P.lessonProgress[quiz.lessonId]={
      completed:score>=60,
      bestScore:Math.max(lp.bestScore||0,score),
      attempts:(lp.attempts||0)+1,
    };
  }
  saveP();

  quiz.results=newResults;
  quiz.xpEarned+=xpGain;
  quiz.phase='reveal';
  quiz.chosen=choice;
  quiz.wasCorrect=correct;
  renderQuiz();
  speak(c.char); // pronounce the word on reveal

  setTimeout(()=>{
    if(isLast){quiz.phase='done';}
    else{quiz.idx++;quiz.phase='question';quiz.chosen=null;quiz.wasCorrect=null;}
    renderQuiz();
  },1200);
}

// PROGRESS
// ━━━━━━━━━━━━━━━━━━━━━━━━
function renderProgress(){
  const el=document.getElementById('view-progress');
  const accuracy=P.totalReviews?Math.round(P.totalCorrect/P.totalReviews*100):0;
  const learnedCount=Object.keys(P.wordMastery).length;

  // Mastery distribution
  const mastDist=LVL_LABELS.map((label,i)=>{
    const count=i===0
      ?ALL_VOCAB.length-Object.values(P.wordMastery).filter(w=>w.level>0).length
      :Object.values(P.wordMastery).filter(w=>w.level===i).length;
    return{label,count,color:LVL_COLORS[i]};
  });
  const mastBars=mastDist.map(d=>`
    <div class="bar-row">
      <div class="row-between" style="margin-bottom:4px">
        <div class="row" style="gap:6px">
          <div class="mastery-dot" style="background:${d.color}"></div>
          <span style="font-size:12px;color:var(--text2)">${d.label}</span>
        </div>
        <span style="font-size:12px;font-weight:500">${d.count}개</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${ALL_VOCAB.length?d.count/ALL_VOCAB.length*100:0}%;background:${d.color}"></div>
      </div>
    </div>`).join('');

  // Lesson stacked bars
  const lesData=CURRICULUM.map(l=>{
    const mastered=l.vocab.filter(v=>(P.wordMastery[v.char]?.level||0)>=4).length;
    const learning=l.vocab.filter(v=>{const lv=P.wordMastery[v.char]?.level||0;return lv>0&&lv<4;}).length;
    return{name:l.title,mastered,learning,none:l.vocab.length-mastered-learning,total:l.vocab.length};
  });
  const maxT=Math.max(...lesData.map(d=>d.total));
  const lesCols=lesData.map(d=>{
    const mH=d.total?d.mastered/maxT*100:0;
    const lH=d.total?d.learning/maxT*100:0;
    const nH=d.total?d.none/maxT*100:0;
    return`<div class="chart-col">
      <div class="chart-val">${Math.round(d.mastered/d.total*100)}%</div>
      <div style="width:100%;display:flex;flex-direction:column;justify-content:flex-end;flex:1;gap:1px">
        <div class="chart-bar" style="height:${mH}%;background:#639922"></div>
        <div class="chart-bar" style="height:${lH}%;background:#E74C3C;border-radius:0"></div>
        <div class="chart-bar" style="height:${nH}%;background:#D3D1C7;border-radius:0 0 4px 4px"></div>
      </div>
      <div class="chart-lbl">${d.name}</div>
    </div>`;
  }).join('');

  // XP history 7 days
  const xpDays=Array.from({length:7},(_,i)=>{
    const d=new Date(Date.now()-(6-i)*86400000);
    const key=d.toISOString().slice(0,10);
    return{name:`${d.getMonth()+1}/${d.getDate()}`,xp:P.xpHistory[key]||0};
  });
  const maxXP=Math.max(...xpDays.map(d=>d.xp),10);
  const xpCols=xpDays.map(d=>`
    <div class="chart-col">
      ${d.xp>0?`<div class="chart-val">${d.xp}</div>`:''}
      <div style="width:100%;display:flex;flex-direction:column;justify-content:flex-end;flex:1">
        <div class="chart-bar" style="height:${d.xp/maxXP*100}%;background:#C0392B"></div>
      </div>
      <div class="chart-lbl">${d.name}</div>
    </div>`).join('');

  el.innerHTML=`
<div style="font-size:18px;font-weight:500;margin-bottom:1rem">학습 현황</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
  ${[
    {label:'총 XP',value:P.xp},
    {label:'정확도',value:accuracy+'%'},
    {label:'총 복습 횟수',value:P.totalReviews},
    {label:'학습한 단어',value:learnedCount},
  ].map(s=>`<div style="background:var(--bg2);border-radius:10px;padding:.8rem 1rem">
    <div style="font-size:10px;color:var(--text3);margin-bottom:4px">${s.label}</div>
    <div style="font-size:22px;font-weight:500">${s.value}</div>
  </div>`).join('')}
</div>

<div class="card" style="margin-bottom:14px">
  <div style="font-size:13px;font-weight:500;margin-bottom:14px">단어 숙련도 분포</div>
  ${mastBars}
</div>

<div class="card" style="margin-bottom:14px">
  <div style="font-size:13px;font-weight:500;margin-bottom:8px">수업별 마스터율</div>
  <div style="font-size:11px;color:var(--text3);margin-bottom:12px">
    <span style="color:#639922">■</span> 마스터 &nbsp;
    <span style="color:#E74C3C">■</span> 학습중 &nbsp;
    <span style="color:#D3D1C7">■</span> 미학습
  </div>
  <div class="chart-wrap">${lesCols}</div>
</div>

<div class="card">
  <div style="font-size:13px;font-weight:500;margin-bottom:14px">최근 7일 XP 획득량</div>
  <div class="chart-wrap">${xpCols}</div>
</div>`;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━
// SPEECH ENGINE
// ━━━━━━━━━━━━━━━━━━━━━━━━
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// SPEECH ENGINE — TTS + STT
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
let selectedVoice = null;
let sttRecognizer  = null;
let sttActive      = false;
let sttCallback    = null; // fn(transcript)

// ── TTS init ──────────────────────────────
function initSpeech() {
  if (!window.speechSynthesis) {
    setSoundStatus('red', '이 브라우저는 음성을 지원하지 않아요');
    return;
  }
  function tryLoad() {
    const all = window.speechSynthesis.getVoices();
    if (!all.length) return;
    const zh = all.filter(v => v.lang.startsWith('zh'));
    if (zh.length) {
      selectedVoice = zh[0];
      setSoundStatus('green', '🔊 ' + zh[0].name + ' — 단어 클릭 시 발음 재생');
    } else {
      setSoundStatus('orange', '중국어 음성 없음 — OS에서 중국어(보통화) 음성을 설치해 주세요');
    }
  }
  tryLoad();
  window.speechSynthesis.addEventListener('voiceschanged', tryLoad);
}

function setSoundStatus(color, msg) {
  const colors = { green:'#1D9E75', orange:'#BA7517', red:'#E24B4A' };
  const dot = document.getElementById('sound-dot');
  const txt = document.getElementById('sound-msg');
  if (dot) dot.style.background = colors[color] || '#B4B2A9';
  if (txt) txt.textContent = msg;
}

function speak(text, rate) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  if (selectedVoice) u.voice = selectedVoice;
  u.lang = 'zh-CN';
  u.rate = rate || 0.82;
  window.speechSynthesis.speak(u);
  // flash speaking style on card if any
  document.querySelectorAll('.speaking').forEach(el => el.classList.remove('speaking'));
}

// ── STT init & toggle ─────────────────────
function initSTT() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const r = new SR();
  r.lang = 'zh-CN';
  r.continuous = false;
  r.interimResults = false;
  r.maxAlternatives = 5;
  return r;
}

// Start STT and call cb(transcript, alternatives[])
function startSTT(cb) {
  if (sttActive) { stopSTT(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('이 브라우저는 음성 인식을 지원하지 않아요.\nChrome 또는 Edge를 사용해 주세요.'); return; }
  sttRecognizer = new SR();
  sttRecognizer.lang = 'zh-CN';
  sttRecognizer.continuous = false;
  sttRecognizer.interimResults = false;
  sttRecognizer.maxAlternatives = 5;
  sttCallback = cb;
  sttActive = true;

  sttRecognizer.onresult = function(e) {
    const alts = Array.from(e.results[0]).map(a => a.transcript.trim());
    sttActive = false;
    if (sttCallback) sttCallback(alts[0], alts);
  };
  sttRecognizer.onerror = function(e) {
    sttActive = false;
    if (e.error === 'no-speech') { if(sttCallback) sttCallback('', []); }
    else if (e.error === 'not-allowed') alert('마이크 권한을 허용해 주세요.');
  };
  sttRecognizer.onend = function() { sttActive = false; };
  sttRecognizer.start();
}

function stopSTT() {
  if (sttRecognizer) { try { sttRecognizer.stop(); } catch(e){} }
  sttActive = false;
}

// ── Pronunciation check (STT → compare with target) ─────
// Returns: {score: 0-100, ok: bool, heard: str}
function checkPronunciation(target, heard) {
  // normalize: strip spaces, punctuation, tone marks stripped for loose match
  const norm = s => s.replace(/[，。！？\s]/g,'').toLowerCase();
  const t = norm(target);
  const h = norm(heard);
  if (t === h) return { score: 100, ok: true, heard };
  // character-level match
  let match = 0;
  for (let i = 0; i < Math.min(t.length, h.length); i++) {
    if (t[i] === h[i]) match++;
  }
  const score = Math.round((match / Math.max(t.length, 1)) * 100);
  return { score, ok: score >= 70, heard };
}

// ── STT Quiz: render mic button + result inside a container el ──
// target = Chinese text to say, color = accent color
function renderMicBtn(containerEl, target, color, onResult) {
  color = color || '#1D4ED8';
  containerEl.innerHTML = `
  <div style="text-align:center;padding:.5rem 0">
    <div style="font-size:13px;color:var(--text2);margin-bottom:10px">아래 버튼을 누르고 중국어로 말해보세요</div>
    <div style="font-size:22px;font-weight:700;color:${color};margin-bottom:6px">${target}</div>
    <button id="mic-btn" onclick="toggleMic('${target.replace(/'/g,"\\'")}', this, '${color}')"
      style="margin:10px auto;display:flex;align-items:center;gap:8px;padding:12px 24px;border-radius:50px;border:2px solid ${color};background:transparent;color:${color};font-size:15px;font-weight:600;cursor:pointer;font-family:inherit">
      🎤 말하기
    </button>
    <div id="mic-result" style="min-height:60px;margin-top:8px"></div>
  </div>`;
}

function toggleMic(target, btn, color) {
  if (sttActive) {
    stopSTT();
    btn.textContent = '🎤 말하기';
    btn.style.background = 'transparent';
    return;
  }
  btn.innerHTML = '⏹ 인식 중...';
  btn.style.background = color;
  btn.style.color = '#fff';

  startSTT(function(heard, alts) {
    btn.innerHTML = '🎤 다시 말하기';
    btn.style.background = 'transparent';
    btn.style.color = color;

    const res = document.getElementById('mic-result');
    if (!res) return;
    if (!heard) {
      res.innerHTML = `<div style="color:var(--text2);font-size:13px">소리를 인식하지 못했어요. 다시 시도해 주세요.</div>`;
      return;
    }
    // Check all alternatives for best match
    const results = (alts.length ? alts : [heard]).map(a => checkPronunciation(target, a));
    const best = results.reduce((a,b) => a.score>b.score?a:b);
    const barColor = best.score >= 90 ? '#1D9E75' : best.score >= 70 ? '#BA7517' : '#E24B4A';
    const emoji = best.score >= 90 ? '🎉 완벽해요!' : best.score >= 70 ? '👍 잘했어요!' : '💪 다시 해봐요!';

    // Auto-speak correct pronunciation
    speak(target, 0.75);

    res.innerHTML = `
    <div style="background:var(--bg2);border-radius:10px;padding:12px 14px;text-align:left">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <span style="font-size:13px;color:var(--text2)">인식된 발음</span>
        <span style="font-size:18px;font-weight:700;color:${barColor}">${best.score}점</span>
      </div>
      <div style="font-size:16px;font-weight:600;margin-bottom:6px">${best.heard}</div>
      <div style="height:6px;background:var(--border);border-radius:3px;margin-bottom:8px">
        <div style="height:6px;background:${barColor};border-radius:3px;width:${best.score}%;transition:width .4s"></div>
      </div>
      <div style="font-size:14px;font-weight:500;color:${barColor}">${emoji}</div>
      ${!best.ok ? `<div style="font-size:12px;color:var(--text2);margin-top:4px">정답: <b>${target}</b></div>` : ''}
    </div>`;
  });
}


function toggleGlobalMic() {
  const btn = document.getElementById('global-mic-btn');
  if (sttActive) {
    stopSTT(); btn.textContent='🎤'; return;
  }
  btn.textContent = '⏹';
  startSTT(function(heard, alts) {
    btn.textContent = '🎤';
    if (heard) setSoundStatus('green', '들림: ' + heard);
    else setSoundStatus('orange', '소리를 인식하지 못했어요');
    setTimeout(()=>initSpeech(), 3000);
  });
}

function checkVoca100(correct, chosen, lessonId){
  const ok = correct===chosen;
  PV.totalReviews = (PV.totalReviews||0)+1;
  if(ok) PV.totalCorrect = (PV.totalCorrect||0)+1;
  const m = PV.wordMastery[correct]||{level:0};
  m.level = ok ? Math.min(5, (m.level||0)+1) : Math.max(0,(m.level||0)-1);
  PV.wordMastery[correct] = m;
  saveVoca();
  const el = document.getElementById('voca100-content');
  const l = VOCA100.find(x=>x.id===lessonId);
  const v = l.vocab.find(x=>x.char===correct);
  el.innerHTML = `
<div style="text-align:center;padding:1.5rem 0">
  <div style="font-size:40px;margin-bottom:.5rem">${ok?'✅':'❌'}</div>
  <div style="font-size:22px;font-weight:700;color:${l.color};margin-bottom:.3rem">${v.char}</div>
  <div style="font-size:13px;color:var(--text2);margin-bottom:.3rem">${v.pinyin}</div>
  <div style="font-size:15px;margin-bottom:1rem">${v.meaning}</div>
  <button class="btn btn-block" onclick="voca100Tab='quiz';renderVoca100()">다음 문제</button>
</div>`;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// HSK MODULE — 1~4급 필수 단어 + 시험 모드
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const STORE_KEY_HSK = "hsk-module-v1";
let PH = {wordMastery:{}, examHistory:[], lastStudied:null};
function saveHSK(){try{localStorage.setItem(STORE_KEY_HSK,JSON.stringify(PH));}catch(e){}}
function loadHSK(){try{const r=localStorage.getItem(STORE_KEY_HSK);if(r)PH=JSON.parse(r);}catch(e){}}
loadHSK();

let hskView='home'; // home | level | vocab | quiz | exam | examResult
let hskLevel=1;     // 1~4
let hskTab='vocab'; // vocab | example | quiz | pronun
let hskQuiz=null;
let hskExam=null;
let hskVocabPage=0;
const HSK_PER_PAGE=20;

const HSK_COLORS={1:'#1D9E75',2:'#1D4ED8',3:'#B45309',4:'#9333EA'};
const HSK_NAMES={1:'HSK 1급',2:'HSK 2급',3:'HSK 3급',4:'HSK 4급'};

// ── Main render dispatcher ────────────────
function renderHSK(){
  const el=document.getElementById('view-hsk');
  if(!el)return;
  if(hskView==='home')    renderHSKHome(el);
  else if(hskView==='level')  renderHSKLevel(el);
  else if(hskView==='quiz')   renderHSKQuiz(el);
  else if(hskView==='exam')   renderHSKExam(el);
  else if(hskView==='examResult') renderHSKExamResult(el);
}

// ── HOME — 급별 카드 ─────────────────────
function renderHSKHome(el){
  const totalAll=Object.values(HSK_DATA).flat().length;
  const mastAll=Object.values(HSK_DATA).flat().filter(v=>(PH.wordMastery[v.char]?.level||0)>=4).length;
  const pctAll=Math.round(mastAll/totalAll*100)||0;

  const cards=[1,2,3,4].map(lv=>{
    const words=HSK_DATA[lv];
    const mastered=words.filter(v=>(PH.wordMastery[v.char]?.level||0)>=4).length;
    const pct=Math.round(mastered/words.length*100)||0;
    const examBests=PH.examHistory.filter(e=>e.level===lv);
    const best=examBests.length?Math.max(...examBests.map(e=>e.score)):null;
    const c=HSK_COLORS[lv];
    return `
    <div onclick="hskLevel=${lv};hskView='level';hskTab='vocab';hskVocabPage=0;renderHSK()"
      style="background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;border-left:4px solid ${c};box-shadow:0 1px 4px rgba(0,0,0,.06)">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
        <div>
          <div style="font-size:16px;font-weight:600;color:${c}">${HSK_NAMES[lv]}</div>
          <div style="font-size:12px;color:var(--text2);margin-top:2px">${words.length}개 단어</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:20px;font-weight:700;color:${c}">${pct}%</div>
          <div style="font-size:10px;color:var(--text3)">마스터율</div>
          ${best!==null?`<div style="font-size:10px;color:var(--text3);margin-top:2px">최고 ${best}점</div>`:''}
        </div>
      </div>
      <div style="height:6px;background:var(--border);border-radius:3px">
        <div style="height:6px;background:${c};border-radius:3px;width:${pct}%;transition:width .4s"></div>
      </div>
      <div style="display:flex;gap:6px;margin-top:10px">
        <button onclick="event.stopPropagation();hskLevel=${lv};hskView='level';hskTab='vocab';hskVocabPage=0;renderHSK()"
          style="flex:1;border:none;border-radius:8px;padding:7px;cursor:pointer;background:${c}22;color:${c};font-family:inherit;font-size:12px;font-weight:500">📖 학습</button>
        <button onclick="event.stopPropagation();hskLevel=${lv};startHSKQuiz(${lv},'practice')"
          style="flex:1;border:none;border-radius:8px;padding:7px;cursor:pointer;background:var(--bg2);color:var(--text1);font-family:inherit;font-size:12px">🎯 연습</button>
        <button onclick="event.stopPropagation();hskLevel=${lv};startHSKExam(${lv})"
          style="flex:1;border:none;border-radius:8px;padding:7px;cursor:pointer;background:#9333EA22;color:#9333EA;font-family:inherit;font-size:12px;font-weight:500">📝 시험</button>
      </div>
    </div>`;
  }).join('');

  el.innerHTML=`
<div style="margin-bottom:1rem">
  <div style="font-size:18px;font-weight:600">📚 HSK 필수 단어</div>
  <div style="font-size:12px;color:var(--text2);margin-top:2px">1급~4급 · 총 ${totalAll}개 단어</div>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;text-align:center">
  <div style="background:var(--card);border-radius:10px;padding:10px">
    <div style="font-size:18px;font-weight:700;color:#1D4ED8">${totalAll}</div>
    <div style="font-size:10px;color:var(--text3)">전체 단어</div>
  </div>
  <div style="background:var(--card);border-radius:10px;padding:10px">
    <div style="font-size:18px;font-weight:700;color:#1D9E75">${mastAll}</div>
    <div style="font-size:10px;color:var(--text3)">마스터</div>
  </div>
  <div style="background:var(--card);border-radius:10px;padding:10px">
    <div style="font-size:18px;font-weight:700;color:#B45309">${pctAll}%</div>
    <div style="font-size:10px;color:var(--text3)">진행률</div>
  </div>
</div>
${cards}
<button onclick="startHSKExam('all')"
  style="width:100%;border:none;border-radius:12px;padding:13px;cursor:pointer;background:linear-gradient(135deg,#9333EA,#1D4ED8);color:#fff;font-family:inherit;font-size:14px;font-weight:600;margin-top:4px">
  🏆 전급 통합 시험 (1~4급)
</button>`;
}

// ── LEVEL VIEW — 단어 탭·예문·퀴즈·발음 ─
function renderHSKLevel(el){
  const lv=hskLevel;
  const c=HSK_COLORS[lv];
  const words=HSK_DATA[lv];
  const mastered=words.filter(v=>(PH.wordMastery[v.char]?.level||0)>=4).length;
  const pct=Math.round(mastered/words.length*100)||0;

  const tabStyle=t=>hskTab===t?`color:#fff;background:${c};border-bottom:2px solid ${c}`:'';

  let content='';
  if(hskTab==='vocab'){
    const totalPages=Math.ceil(words.length/HSK_PER_PAGE);
    const start=hskVocabPage*HSK_PER_PAGE;
    const page=words.slice(start,start+HSK_PER_PAGE);
    const LVL_C=['#B4B2A9','#E24B4A','#BA7517','#1D4ED8','#1D9E75','#9333EA'];
    const LVL_L=['미학습','입문','기초','중급','고급','마스터'];
    const cards=page.map((v,i)=>{
      const lv2=PH.wordMastery[v.char]?.level||0;
      return `<div style="background:var(--bg2);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center"
        onclick="speak('${v.char.replace(/'/g,"\\'")}')">
        <div>
          <div style="font-size:18px;font-weight:700;color:${c};cursor:pointer">${v.char}
            <span style="font-size:11px;font-weight:400;color:#1D4ED8;margin-left:6px">${v.pinyin}</span>
          </div>
          <div style="font-size:12px;color:var(--text2);margin-top:2px">${v.meaning}</div>
        </div>
        <span style="font-size:10px;padding:2px 8px;border-radius:10px;background:${LVL_C[lv2]}22;color:${LVL_C[lv2]};white-space:nowrap">${LVL_L[lv2]}</span>
      </div>`;
    }).join('');
    const pager=totalPages>1?`<div style="display:flex;gap:6px;justify-content:center;margin-top:8px">
      ${hskVocabPage>0?`<button onclick="hskVocabPage--;renderHSK()" style="border:1px solid var(--border);background:transparent;border-radius:8px;padding:6px 12px;cursor:pointer;font-family:inherit">← 이전</button>`:''}
      <span style="padding:6px 12px;font-size:13px;color:var(--text2)">${hskVocabPage+1}/${totalPages}</span>
      ${hskVocabPage<totalPages-1?`<button onclick="hskVocabPage++;renderHSK()" style="border:1px solid var(--border);background:transparent;border-radius:8px;padding:6px 12px;cursor:pointer;font-family:inherit">다음 →</button>`:''}
    </div>`:'';
    content=cards+pager;
  } else if(hskTab==='example'){
    const totalPages=Math.ceil(words.length/HSK_PER_PAGE);
    const start=hskVocabPage*HSK_PER_PAGE;
    const page=words.slice(start,start+HSK_PER_PAGE);
    content=page.map(v=>`
    <div style="background:var(--bg2);border-radius:10px;padding:11px 13px;margin-bottom:8px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <span style="font-size:16px;font-weight:700;color:${c};cursor:pointer" onclick="speak('${v.char.replace(/'/g,"\\'")}'">${v.char}</span>
        <span style="font-size:11px;color:#1D4ED8">${v.pinyin}</span>
        <span style="font-size:11px;color:var(--text2)">${v.meaning}</span>
        <button onclick="speak('${v.char.replace(/'/g,"\\'")}')" style="margin-left:auto;border:none;background:transparent;cursor:pointer;font-size:14px">🔊</button>
      </div>
      <div style="font-size:14px;font-weight:500;cursor:pointer" onclick="speak('${v.example.replace(/'/g,"\\'")}')">${v.example}</div>
      <div style="font-size:11px;color:#1D4ED8;margin-top:2px">${v.exPy}</div>
      <div style="font-size:11px;color:var(--text2);margin-top:1px">${v.exKr}</div>
    </div>`).join('')+(totalPages>1?`<div style="display:flex;gap:6px;justify-content:center;margin-top:8px">
      ${hskVocabPage>0?`<button onclick="hskVocabPage--;renderHSK()" style="border:1px solid var(--border);background:transparent;border-radius:8px;padding:6px 12px;cursor:pointer;font-family:inherit">← 이전</button>`:''}
      <span style="padding:6px 12px;font-size:13px;color:var(--text2)">${hskVocabPage+1}/${totalPages}</span>
      ${hskVocabPage<totalPages-1?`<button onclick="hskVocabPage++;renderHSK()" style="border:1px solid var(--border);background:transparent;border-radius:8px;padding:6px 12px;cursor:pointer;font-family:inherit">다음 →</button>`:''}
    </div>`:'');
  } else if(hskTab==='quiz'){
    content=`<div style="padding:.5rem 0">
      <button onclick="startHSKQuiz(${lv},'practice')"
        style="width:100%;border:none;border-radius:12px;padding:14px;cursor:pointer;background:${c};color:#fff;font-family:inherit;font-size:14px;font-weight:600;margin-bottom:10px">
        🎯 연습 퀴즈 (20문제)</button>
      <button onclick="startHSKQuiz(${lv},'hard')"
        style="width:100%;border:none;border-radius:12px;padding:14px;cursor:pointer;background:var(--bg2);color:var(--text1);font-family:inherit;font-size:14px;margin-bottom:10px">
        🔥 약한 단어만 (틀린 것 위주)</button>
      <button onclick="startHSKExam(${lv})"
        style="width:100%;border:none;border-radius:12px;padding:14px;cursor:pointer;background:#9333EA;color:#fff;font-family:inherit;font-size:14px;font-weight:600">
        📝 HSK ${lv}급 모의시험 (50문제)</button>
    </div>`;
  } else if(hskTab==='pronun'){
    const pV=words[Math.floor(Math.random()*words.length)];
    const pEsc=pV.char.replace(/'/g,"\\'");
    content=`<div style="padding:.5rem 0">
      <div style="font-size:13px;color:var(--text2);margin-bottom:.5rem">단어를 듣고 따라 말해보세요</div>
      <div style="background:var(--bg2);border-radius:12px;padding:1.2rem;text-align:center;margin-bottom:1rem">
        <div style="font-size:36px;font-weight:700;color:${c};cursor:pointer" onclick="speak('${pEsc}')">${pV.char}</div>
        <div style="font-size:13px;color:#1D4ED8;margin-top:4px">${pV.pinyin}</div>
        <div style="font-size:12px;color:var(--text2);margin-top:2px">${pV.meaning}</div>
        <div style="font-size:12px;color:var(--text3);margin-top:6px;font-style:italic">"${pV.example}"</div>
        <button onclick="speak('${pEsc}',0.6)" style="margin-top:10px;border:none;background:var(--border);border-radius:20px;padding:6px 16px;cursor:pointer;font-family:inherit;font-size:12px">🐢 천천히 듣기</button>
      </div>
      <div id="hsk-mic-area"></div>
      <button onclick="hskTab='pronun';renderHSK()" style="margin-top:12px;width:100%;border:1px solid var(--border);background:transparent;border-radius:8px;padding:8px;cursor:pointer;font-family:inherit;font-size:13px;color:var(--text2)">🔀 다른 단어</button>
    </div>`;
  }

  el.innerHTML=`
<button onclick="hskView='home';renderHSK()" style="border:none;background:transparent;cursor:pointer;font-size:13px;color:var(--text2);padding:0;margin-bottom:12px">← 목록으로</button>
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
  <div style="font-size:18px;font-weight:600;color:${c}">${HSK_NAMES[lv]}</div>
  <div style="font-size:13px;color:${c};font-weight:500">${pct}% 마스터</div>
</div>
<div style="height:5px;background:var(--border);border-radius:3px;margin-bottom:14px">
  <div style="height:5px;background:${c};border-radius:3px;width:${pct}%"></div>
</div>
<div class="tab-bar" style="margin-bottom:1rem">
  <button class="tab-item" onclick="hskTab='vocab';hskVocabPage=0;renderHSK()" style="${tabStyle('vocab')}">단어 (${words.length})</button>
  <button class="tab-item" onclick="hskTab='example';hskVocabPage=0;renderHSK()" style="${tabStyle('example')}">예문</button>
  <button class="tab-item" onclick="hskTab='quiz';renderHSK()" style="${tabStyle('quiz')}">퀴즈</button>
  <button class="tab-item" onclick="hskTab='pronun';renderHSK()" style="${tabStyle('pronun')}">🎤 발음</button>
</div>
<div id="hsk-tab-content">${content}</div>`;

  if(hskTab==='pronun'){
    const pV=words[Math.floor(Math.random()*words.length)];
    const pEsc=pV.char.replace(/'/g,"\\'");
    setTimeout(()=>{
      speak(pEsc);
      const ma=document.getElementById('hsk-mic-area');
      if(ma&&typeof renderMicBtn==='function') renderMicBtn(ma,pEsc,c);
    },400);
  }
}

// ── QUIZ — 연습 퀴즈 ─────────────────────
function startHSKQuiz(lv,mode){
  hskLevel=typeof lv==='number'?lv:1;
  let pool=HSK_DATA[hskLevel];
  if(mode==='hard'){
    const hard=pool.filter(v=>{const m=PH.wordMastery[v.char];return !m||m.level<=1;});
    if(hard.length>=4) pool=hard;
  }
  const shuffled=[...pool].sort(()=>Math.random()-.5).slice(0,20);
  hskQuiz={
    cards:shuffled.map(v=>{
      const allWords=HSK_DATA[hskLevel];
      const wrongs=[...allWords].filter(w=>w.meaning!==v.meaning).sort(()=>Math.random()-.5).slice(0,3);
      const opts=[...wrongs,v].sort(()=>Math.random()-.5);
      return{...v,opts};
    }),
    idx:0,phase:'question',results:[],chosen:null,wasCorrect:null
  };
  hskView='quiz';
  renderHSK();
}

function renderHSKQuiz(el){
  if(!hskQuiz){hskView='home';renderHSK();return;}
  const lv=hskLevel;
  const c=HSK_COLORS[lv];

  if(hskQuiz.phase==='done'){
    const correct=hskQuiz.results.filter(r=>r.ok).length;
    const total=hskQuiz.results.length;
    const score=Math.round(correct/total*100);
    const emoji=score>=80?'🎉':score>=60?'👍':'💪';
    const rows=hskQuiz.results.map(r=>`
      <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:0.5px solid var(--border)">
        <span style="font-size:15px;font-weight:500;color:${c}">${r.char}</span>
        <span style="font-size:12px;color:var(--text2)">${r.meaning}</span>
        <span>${r.ok?'✅':'❌'}</span>
      </div>`).join('');
    el.innerHTML=`<div style="padding:1rem 0;text-align:center">
      <div style="font-size:48px;margin-bottom:12px">${emoji}</div>
      <div style="font-size:22px;font-weight:600;margin-bottom:4px">${total}문제 중 ${correct}개 정답</div>
      <div style="font-size:28px;font-weight:700;color:${c};margin-bottom:20px">${score}점</div>
      <div style="text-align:left;margin-bottom:20px">${rows}</div>
      <button onclick="startHSKQuiz(${lv},'practice')"
        style="width:100%;border:none;border-radius:12px;padding:13px;cursor:pointer;background:${c};color:#fff;font-family:inherit;font-size:14px;font-weight:600;margin-bottom:8px">다시 연습</button>
      <button onclick="hskView='level';renderHSK()"
        style="width:100%;border:1px solid var(--border);border-radius:12px;padding:13px;cursor:pointer;background:transparent;font-family:inherit;font-size:14px">목록으로</button>
    </div>`;
    return;
  }

  const q=hskQuiz.cards[hskQuiz.idx];
  const pct=Math.round(hskQuiz.idx/hskQuiz.cards.length*100);
  let charBg='var(--bg2)';
  if(hskQuiz.phase==='reveal') charBg=hskQuiz.wasCorrect?'#EAF3DE':'#FCEBEB';

  const opts=q.opts.map(o=>{
    let style='width:100%;border:1.5px solid var(--border);border-radius:10px;padding:12px;cursor:pointer;background:var(--card);font-family:inherit;font-size:13px;text-align:left;margin-bottom:8px;display:block';
    if(hskQuiz.phase==='reveal'){
      if(o.meaning===q.meaning) style=style.replace('var(--border)','#1D9E75').replace('var(--card)','#EAF3DE');
      else if(o.meaning===hskQuiz.chosen) style=style.replace('var(--border)','#E24B4A').replace('var(--card)','#FCEBEB');
    }
    const esc=o.meaning.replace(/'/g,"\\'");
    const disabled=hskQuiz.phase==='reveal'?' disabled':'';
    return `<button${disabled} onclick="answerHSKQuiz('${esc}')" style="${style}">${o.meaning}</button>`;
  }).join('');

  el.innerHTML=`
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
  <button onclick="hskView='level';renderHSK()" style="border:none;background:transparent;cursor:pointer;font-size:18px;color:var(--text2)">✕</button>
  <span style="font-size:12px;color:var(--text2)">${HSK_NAMES[lv]} · ${hskQuiz.idx+1}/${hskQuiz.cards.length}</span>
  <span style="font-size:12px;color:${c};font-weight:500">${hskQuiz.results.filter(r=>r.ok).length}정답</span>
</div>
<div style="height:4px;background:var(--border);border-radius:2px;margin-bottom:16px">
  <div style="height:4px;background:${c};border-radius:2px;width:${pct}%"></div>
</div>
<div style="font-size:12px;color:var(--text3);text-align:center;margin-bottom:8px">올바른 뜻을 고르세요</div>
<div style="background:${charBg};border-radius:16px;padding:24px;text-align:center;margin-bottom:16px">
  <div style="font-size:40px;font-weight:700;color:${c};cursor:pointer" onclick="speak('${q.char.replace(/'/g,"\\'")}')">${q.char}</div>
  ${hskQuiz.phase==='reveal'?`
  <div style="margin-top:10px">
    <div style="font-size:16px;color:#1D4ED8;font-weight:500">${q.pinyin}</div>
    <div style="font-size:13px;color:var(--text2);margin-top:3px">${q.meaning}</div>
    <div style="font-size:22px;margin-top:8px">${hskQuiz.wasCorrect?'✅ 정답!':'❌ 틀렸어요'}</div>
    <div style="font-size:12px;color:var(--text2);margin-top:6px;font-style:italic">${q.example}</div>
  </div>`:'<div style="font-size:13px;color:var(--text3);margin-top:8px">클릭하면 발음을 들을 수 있어요 🔊</div>'}
</div>
${opts}
${hskQuiz.phase==='reveal'?`<button onclick="nextHSKQuiz()" style="width:100%;border:none;border-radius:12px;padding:13px;cursor:pointer;background:${c};color:#fff;font-family:inherit;font-size:14px;font-weight:600;margin-top:4px">${hskQuiz.idx===hskQuiz.cards.length-1?'결과 보기':'다음 문제 →'}</button>`:''}`;
}

function answerHSKQuiz(choice){
  if(!hskQuiz||hskQuiz.phase!=='question')return;
  const q=hskQuiz.cards[hskQuiz.idx];
  const ok=choice===q.meaning;
  const wm=PH.wordMastery[q.char]||{level:0};
  wm.level=ok?Math.min(wm.level+1,5):Math.max(wm.level-1,0);
  PH.wordMastery[q.char]=wm;
  hskQuiz.results.push({char:q.char,meaning:q.meaning,ok});
  hskQuiz.phase='reveal';
  hskQuiz.chosen=choice;
  hskQuiz.wasCorrect=ok;
  saveHSK();
  speak(q.char);
  renderHSK();
}

function nextHSKQuiz(){
  if(!hskQuiz)return;
  if(hskQuiz.idx===hskQuiz.cards.length-1){
    hskQuiz.phase='done';
  } else {
    hskQuiz.idx++;
    hskQuiz.phase='question';
    hskQuiz.chosen=null;
    hskQuiz.wasCorrect=null;
  }
  renderHSK();
}

// ── EXAM — 급별 모의시험 ─────────────────
function startHSKExam(lv){
  const levels=lv==='all'?[1,2,3,4]:[lv];
  const allWords=levels.flatMap(l=>HSK_DATA[l]);
  const pool=[...allWords].sort(()=>Math.random()-.5).slice(0,50);
  hskExam={
    level:lv, levels,
    cards:pool.map(v=>{
      // 4지선다: 뜻 맞추기
      const wrongs=[...allWords].filter(w=>w.meaning!==v.meaning).sort(()=>Math.random()-.5).slice(0,3);
      const opts=[...wrongs,v].sort(()=>Math.random()-.5);
      return{...v,opts,type:'meaning'};
    }),
    idx:0,phase:'question',results:[],
    startTime:Date.now(),chosen:null,wasCorrect:null
  };
  hskView='exam';
  renderHSK();
}

function renderHSKExam(el){
  if(!hskExam){hskView='home';renderHSK();return;}
  const lv=hskExam.level;
  const c=lv==='all'?'#9333EA':(HSK_COLORS[lv]||'#1D4ED8');
  const name=lv==='all'?'HSK 1~4급 통합':HSK_NAMES[lv];

  if(hskExam.phase==='done'){
    renderHSKExamResult(el); return;
  }

  const q=hskExam.cards[hskExam.idx];
  const pct=Math.round(hskExam.idx/hskExam.cards.length*100);
  const elapsed=Math.round((Date.now()-hskExam.startTime)/1000);
  const mins=Math.floor(elapsed/60);
  const secs=elapsed%60;
  let charBg='var(--bg2)';
  if(hskExam.phase==='reveal') charBg=hskExam.wasCorrect?'#EAF3DE':'#FCEBEB';

  const opts=q.opts.map(o=>{
    let style='width:100%;border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;cursor:pointer;background:var(--card);font-family:inherit;font-size:13px;text-align:left;margin-bottom:8px;display:block';
    if(hskExam.phase==='reveal'){
      if(o.meaning===q.meaning) style=style.replace('var(--border)','#1D9E75').replace('var(--card)','#EAF3DE');
      else if(o.meaning===hskExam.chosen) style=style.replace('var(--border)','#E24B4A').replace('var(--card)','#FCEBEB');
    }
    const esc=o.meaning.replace(/'/g,"\\'");
    const disabled=hskExam.phase==='reveal'?' disabled':'';
    return `<button${disabled} onclick="answerHSKExam('${esc}')" style="${style}">${o.meaning}</button>`;
  }).join('');

  el.innerHTML=`
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
  <div style="font-size:12px;font-weight:600;color:${c}">📝 ${name} 모의시험</div>
  <div style="font-size:12px;color:var(--text3)">${mins}:${String(secs).padStart(2,'0')} ⏱</div>
</div>
<div style="display:flex;justify-content:space-between;margin-bottom:6px">
  <span style="font-size:12px;color:var(--text2)">${hskExam.idx+1} / ${hskExam.cards.length}</span>
  <span style="font-size:12px;color:#1D9E75">✅ ${hskExam.results.filter(r=>r.ok).length}</span>
</div>
<div style="height:4px;background:var(--border);border-radius:2px;margin-bottom:14px">
  <div style="height:4px;background:${c};border-radius:2px;width:${pct}%"></div>
</div>
<div style="background:${charBg};border-radius:16px;padding:22px;text-align:center;margin-bottom:14px">
  <div style="font-size:11px;color:var(--text3);margin-bottom:6px">뜻을 고르세요</div>
  <div style="font-size:42px;font-weight:700;color:${c};cursor:pointer" onclick="speak('${q.char.replace(/'/g,"\\'")}')">${q.char}</div>
  ${hskExam.phase==='reveal'?`
  <div style="margin-top:8px">
    <div style="font-size:15px;color:#1D4ED8;font-weight:500">${q.pinyin}</div>
    <div style="font-size:13px;color:var(--text2);margin-top:2px">${q.meaning}</div>
    <div style="font-size:20px;margin-top:6px">${hskExam.wasCorrect?'✅':'❌'}</div>
  </div>`:''}
</div>
${opts}
${hskExam.phase==='reveal'?`<button onclick="nextHSKExam()" style="width:100%;border:none;border-radius:12px;padding:13px;cursor:pointer;background:${c};color:#fff;font-family:inherit;font-size:14px;font-weight:600;margin-top:4px">${hskExam.idx===hskExam.cards.length-1?'결과 보기':'다음 문제 →'}</button>`:''}`;
}

function answerHSKExam(choice){
  if(!hskExam||hskExam.phase!=='question')return;
  const q=hskExam.cards[hskExam.idx];
  const ok=choice===q.meaning;
  hskExam.results.push({char:q.char,meaning:q.meaning,ok});
  hskExam.phase='reveal';
  hskExam.chosen=choice;
  hskExam.wasCorrect=ok;
  // update mastery
  const wm=PH.wordMastery[q.char]||{level:0};
  wm.level=ok?Math.min(wm.level+1,5):Math.max(wm.level-1,0);
  PH.wordMastery[q.char]=wm;
  saveHSK();
  speak(q.char);
  renderHSK();
}

function nextHSKExam(){
  if(!hskExam)return;
  if(hskExam.idx===hskExam.cards.length-1){
    hskExam.phase='done';
    const score=Math.round(hskExam.results.filter(r=>r.ok).length/hskExam.results.length*100);
    const elapsed=Math.round((Date.now()-hskExam.startTime)/1000);
    PH.examHistory=PH.examHistory||[];
    PH.examHistory.push({level:hskExam.level,score,date:new Date().toLocaleDateString('ko'),elapsed});
    if(PH.examHistory.length>50) PH.examHistory=PH.examHistory.slice(-50);
    saveHSK();
  } else {
    hskExam.idx++;
    hskExam.phase='question';
    hskExam.chosen=null;
    hskExam.wasCorrect=null;
  }
  renderHSK();
}

function renderHSKExamResult(el){
  const lv=hskExam.level;
  const c=lv==='all'?'#9333EA':(HSK_COLORS[lv]||'#1D4ED8');
  const name=lv==='all'?'HSK 1~4급 통합':HSK_NAMES[lv];
  const correct=hskExam.results.filter(r=>r.ok).length;
  const total=hskExam.results.length;
  const score=Math.round(correct/total*100);
  const elapsed=Math.round((Date.now()-hskExam.startTime)/1000);
  const pass=score>=60;
  const emoji=score>=90?'🏆':score>=80?'🎉':score>=60?'👍':'💪';
  const levelMsg=score>=90?'최우수!':score>=80?'우수':score>=60?'합격':'다시 도전!';
  const history=(PH.examHistory||[]).filter(e=>e.level===lv).slice(-5);
  const rows=hskExam.results.map(r=>`
    <div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:0.5px solid var(--border)">
      <span style="font-size:14px;font-weight:600;color:${c}">${r.char}</span>
      <span style="font-size:11px;color:var(--text2)">${r.meaning}</span>
      <span>${r.ok?'✅':'❌'}</span>
    </div>`).join('');
  const histRows=history.map(h=>`<div style="display:flex;justify-content:space-between;font-size:11px;padding:3px 0">
    <span>${h.date}</span><span style="font-weight:600;color:${h.score>=60?'#1D9E75':'#E24B4A'}">${h.score}점</span>
  </div>`).join('');

  el.innerHTML=`<div style="text-align:center;padding:1rem 0">
    <div style="font-size:48px;margin-bottom:8px">${emoji}</div>
    <div style="font-size:14px;color:${c};font-weight:500;margin-bottom:4px">${name} 모의시험</div>
    <div style="font-size:36px;font-weight:700;color:${c};margin-bottom:4px">${score}점</div>
    <div style="font-size:14px;color:${pass?'#1D9E75':'#E24B4A'};font-weight:600;margin-bottom:2px">${pass?'✅ 합격':'❌ 불합격'} — ${levelMsg}</div>
    <div style="font-size:12px;color:var(--text2);margin-bottom:16px">${total}문제 중 ${correct}개 정답 · ${Math.floor(elapsed/60)}분 ${elapsed%60}초</div>
    ${history.length>1?`<div style="text-align:left;background:var(--bg2);border-radius:10px;padding:10px 12px;margin-bottom:16px">
      <div style="font-size:12px;font-weight:600;margin-bottom:6px">최근 시험 기록</div>${histRows}</div>`:''}
    <div style="text-align:left;margin-bottom:20px;max-height:300px;overflow-y:auto">${rows}</div>
    <button onclick="startHSKExam(${JSON.stringify(lv)})"
      style="width:100%;border:none;border-radius:12px;padding:13px;cursor:pointer;background:${c};color:#fff;font-family:inherit;font-size:14px;font-weight:600;margin-bottom:8px">🔄 다시 시험</button>
    <button onclick="hskView='home';renderHSK()"
      style="width:100%;border:1px solid var(--border);border-radius:12px;padding:13px;cursor:pointer;background:transparent;font-family:inherit;font-size:14px">홈으로</button>
  </div>`;
}

</script>
</body>
</html>
